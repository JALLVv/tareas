  // mutuamente y la nube muere para las dos, en silencio).
  const EPOCH_KEY = "rachas_epoch";
  function localEpoch(){ try{ return localStorage.getItem(EPOCH_KEY); }catch(e){ return null; } }
  async function claimEpoch(){
    try{
      if(!client || !uid) return;
      const e = "e"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
      try{ localStorage.setItem(EPOCH_KEY, e); }catch(_){}
      await client.from('profiles').upsert({ id:uid, device_epoch:e });
    }catch(e){}
  }
  async function init(){
    if(ready) return uid;
    if(superseded) return null;  // esta instalación fue transferida: no usar la sesión
    if(!configured()) return null;
    if(initing) return initing;
    initing = (async ()=>{
      try{
        client = sdk().createClient(SUPABASE_URL, SUPABASE_ANON, { auth:{ persistSession:true, autoRefreshToken:true } });
        let { data:{ session } } = await client.auth.getSession();
        if(!session){
          // CLAVE: si ya teníamos una cuenta (uid guardado) pero ahora mismo no
          // hay sesión, NO crear una cuenta anónima nueva — eso "abandonaría" la
          // cuenta vieja y perdería amigos/calendario (esto pasó tras transferir
          // datos). Se reintenta unas veces (el SDK puede estar restaurando la
          // sesión aún); si sigue sin sesión, se deja la nube DESCONECTADA (los
          // datos locales se conservan y se reconecta en el próximo arranque),
          // en vez de arrancar una cuenta nueva vacía.
          if(knownUid()){
            for(let i=0;i<3 && !session;i++){
              await new Promise(r=>setTimeout(r,700));
              try{ session=(await client.auth.getSession()).data.session; }catch(e){}
              // intenta también REFRESCAR con el refresh token guardado (getSession
              // puede devolver null aunque el token siga siendo recuperable)
              if(!session){ try{ const r=await client.auth.refreshSession(); session=(r.data&&r.data.session)||null; }catch(e){} }
            }
            if(!session){ ready=false; disconnected=true; return null; }
          } else {
            const { data, error } = await client.auth.signInAnonymously(); if(error) throw error; session=data.session;
          }
        }
        uid = session && session.user ? session.user.id : null; ready=!!uid;
        rememberUid(uid);
        // ¿Sigue siendo ESTA instalación la dueña de la cuenta? Si la marca de
        // la nube es de otra (cuenta transferida sin borrar esta app), retirarse:
        // parar la renovación del token (fin de la "pelea" que mataba la sesión
        // de ambas) y dejar la nube inactiva aquí. Reclamable desde Ajustes.
        if(ready){
          try{
            const { data:prof } = await client.from('profiles').select('device_epoch').eq('id', uid).maybeSingle();
            const cloudE = prof && prof.device_epoch;
            const mine = localEpoch();
            if(!cloudE){ claimEpoch(); }                    // cuenta sin marca: reclamar
            else if(cloudE !== mine){
              superseded=true; ready=false;
              try{ client.auth.stopAutoRefresh(); }catch(_){}
              return null;
            }
          }catch(e){} // sin red para comprobar: seguir normal (se comprueba al próximo arranque)
        }
        return uid;
      }catch(e){ console.warn("Cloud init:", e && e.message); client=null; return null; }
      finally{ initing=null; }
    })();
    return initing;
  }
  function myId(){ return uid; }
  // Estado de la nube, visible en Ajustes: conectada / desconectada (sesión
  // perdida). Antes esta desconexión era SILENCIOSA: la app funcionaba local
  // pero dejaba de subir todo (amigos veían el perfil congelado y sin avisos).
  function state(){ return { connected: !!ready, disconnected, superseded, hasAccount: !!knownUid(), uid }; }
  // Reintenta restaurar la sesión (getSession + refreshSession). Si lo logra,
  // re-sincroniza todo para que los amigos vuelvan a ver los avances.
  async function reconnect(){
    ready=false; initing=null; disconnected=false;
    const id=await init();
    if(id){ disconnected=false; pushProfile(); syncBacklog(2000); ensurePush(); syncAllReminders(); }
    return id;
  }
  // "Usar la cuenta en ESTA instalación": reclama la marca de dueño (la otra
  // instalación se retirará sola al abrirse) y re-sincroniza todo aquí.
  async function reclaimHere(){
    superseded=false; ready=false; initing=null;
    const id=await init();          // puede volver a marcar superseded (marca ajena)
    if(!id && !uid) return null;    // sin sesión: no hay nada que reclamar
    superseded=false; ready=true;
    try{ if(client) client.auth.startAutoRefresh(); }catch(_){}
    await claimEpoch();             // ahora la marca es de ESTA instalación
    pushProfile(); syncBacklog(2000); ensurePush(); syncAllReminders();
    return uid;
  }
  // ÚLTIMO RECURSO (lo elige el usuario en Ajustes): la sesión es irrecuperable →
  // crea una cuenta de nube NUEVA y re-sube TODOS los datos locales (perfil,
  // historial completo y fotos). Se conserva todo lo tuyo; los amigos tendrán
  // que volver a agregarte porque tu ID cambia.
  async function startFresh(){
    try{
      if(!configured()) return null;
      if(!client) client = sdk().createClient(SUPABASE_URL, SUPABASE_ANON, { auth:{ persistSession:true, autoRefreshToken:true } });
      const { data, error } = await client.auth.signInAnonymously(); if(error) throw error;
      uid = data.session && data.session.user ? data.session.user.id : null;
      if(!uid) return null;
      ready=true; disconnected=false; superseded=false; rememberUid(uid);
      await claimEpoch(); // esta instalación es la dueña de la cuenta nueva
      await pushProfile();
      forceResync();      // re-sube historial completo + fotos y reconcilia
      ensurePush(); syncAllReminders();
      return uid;
    }catch(e){ console.warn("startFresh:", e && e.message); return null; }
  }
  // URL pública "adivinada" de la foto de una completada, según el patrón de
  // subida ({uid}/{id}.jpg). Sirve como último recurso para mostrar una foto
  // que perdió su enlace: si el archivo existe en el Storage de esta cuenta se
  // ve; si no, la imagen falla y se muestra el marcador (no se guarda nada).
  function guessPhotoUrl(id){
    try{ if(!client || !uid || !id) return null; return client.storage.from('photos').getPublicUrl(`${uid}/${id}.jpg`).data.publicUrl; }
    catch(e){ return null; }
  }

  async function uploadDataUrl(path, dataUrl){
    try{
      const blob = await (await fetch(dataUrl)).blob();
      const { error } = await client.storage.from('photos').upload(path, blob, { upsert:true, contentType:'image/jpeg' });
      if(error && !/exist/i.test(error.message||"")) throw error;
      return client.storage.from('photos').getPublicUrl(path).data.publicUrl;
    }catch(e){ console.warn("upload:", e && e.message); return null; }
  }

  async function pushProfile(){
    if(!enabled() || !await init() || !client) return;
    const s=Store.get();
    let avatarUrl = (s.cloud && s.cloud.avatarUrl) || null;
    if(s.profile.avatar && (!s.cloud || s.cloud.avatarSrc!==s.profile.avatar)){
      const base = await uploadDataUrl(`${uid}/avatar.jpg`, s.profile.avatar); // máxima calidad (sin reescalar)
      if(base){ avatarUrl = base + "?v=" + Date.now(); // cache-bust solo en la URL, no en la ruta
        Store.update(st=>{ st.cloud=st.cloud||{}; st.cloud.avatarUrl=avatarUrl; st.cloud.avatarSrc=s.profile.avatar; }); }
    }
    try{
      await client.from('profiles').upsert({ id:uid, name:s.profile.name||"Atleta", avatar_url:avatarUrl,
        points:s.points, streak_current:s.streak.current, streak_best:s.streak.best, penalties:(s.penalties||0),
        tz_offset:new Date().getTimezoneOffset(), updated_at:new Date().toISOString() });
    }catch(e){ console.warn("pushProfile:", e && e.message);
      // compatibilidad: si la columna tz_offset aún no existe en el proyecto,
      // reintenta sin ella para no dejar el perfil sin sincronizar.
      try{ await client.from('profiles').upsert({ id:uid, name:s.profile.name||"Atleta", avatar_url:avatarUrl,
        points:s.points, streak_current:s.streak.current, streak_best:s.streak.best, penalties:(s.penalties||0), updated_at:new Date().toISOString() }); }catch(_){}
    }
  }

  function markSynced(id){ Store.update(s=>{ s.cloud=s.cloud||{}; s.cloud.syncedCompletions=s.cloud.syncedCompletions||[]; if(!s.cloud.syncedCompletions.includes(id)) s.cloud.syncedCompletions.push(id); }); }
  // justNow=true SOLO en la completación interactiva (no en re-sincronizaciones):
  // manda a cada amigo un push de RESPALDO además del que envía el trigger del
  // servidor. Mismo tag ('shared_done-<ref>') → si llegan los dos, se funden en uno.
  async function pushCompletion(entry, photoDataUrl, justNow){
    if(!enabled() || !await init() || !client) return;
    // CLAVE: si no hay foto nueva que subir, se CONSERVA la URL existente
    // (entry.photoUrl) en vez de poner null. Antes se ponía null y eso BORRABA
    // el enlace de la foto en la nube — así, tras una transferencia (que quita
    // la foto local y deja solo la URL), cualquier re-subida dejaba el
    // calendario sin fotos.
    let photo_url = entry.photoUrl || null;
    let photoOk = !photoDataUrl;
    if(photoDataUrl){
      let up=await uploadDataUrl(`${uid}/${entry.id}.jpg`, photoDataUrl); // foto original (máxima calidad)
      if(!up){ up=await uploadDataUrl(`${uid}/${entry.id}.jpg`, photoDataUrl); } // un reintento
      if(up){ photo_url=up; photoOk=true;
        // guardar la URL en el historial local: así la foto sobrevive a una
        // transferencia (el código lleva photoUrl) y se puede volver a mostrar.
        Store.update(s=>{ const h=(s.history||[]).find(x=>x.id===entry.id); if(h && !h.photoUrl) h.photoUrl=up; });
      } else photoOk=false;
    }
    try{
      await client.from('completions').upsert({ id:entry.id, user_id:uid, date:entry.date, title:entry.title,
        category:entry.category, points:entry.points, time:entry.time, photo_url, random:!!entry.random,
        partner_id:entry.partnerId||null, partner_name:entry.partnerName||null, shared_id:entry.sharedId||null });
      // solo se marca como sincronizada si la foto subió (o no había). Si la foto
      // falló, se reintenta en el próximo arranque (syncBacklog).
      if(photoOk) markSynced(entry.id);
      if(justNow){
        // Respaldo SOLO de fila: si el trigger no creó el aviso, lo crea este
        // dispositivo, y ESA inserción dispara su push. Sin push directo extra:
        // mandarlo además del push del trigger duplicaba la notificación.
        (Store.get().friends||[]).forEach(f=>{ if(f.cloudId) backupDoneNotify(f.cloudId, entry, photo_url); });
      }
    }catch(e){ console.warn("pushCompletion:", e && e.message); }
  }
  // sube una completada de tarea COMPARTIDA recibida del compañero: usa la
  // foto que ya está en el Storage del que la completó (no se vuelve a subir).
  // Así aparece en TU calendario en la nube (el que ven tus amigos).
  async function pushSharedCompletion(entry){
    if(!enabled() || !await init() || !client) return;
    try{
      const sid = entry.sharedId || (typeof entry.id==='string' && entry.id.slice(0,3)==='sh_' ? entry.id.slice(3) : null);
      await client.from('completions').upsert({ id:entry.id, user_id:uid, date:entry.date, title:entry.title,
        category:entry.category, points:entry.points, time:entry.time, photo_url:entry.photoUrl||null, random:false,
        partner_id:entry.partnerId||null, partner_name:entry.partnerName||null, shared_id:sid });
      markSynced(entry.id);
    }catch(e){ console.warn("pushSharedCompletion:", e && e.message); }
  }
  // Parchea solo las columnas "con quién" de una completada ya existente en la
  // nube (sin tocar la foto). Para rellenar registros antiguos.
  async function updatePartner(id, partnerId, partnerName){
    if(!enabled() || !await init() || !client) return;
    if(!partnerId && !partnerName) return;
    try{ await client.from('completions').update({ partner_id:partnerId||null, partner_name:partnerName||null }).eq('id', id).eq('user_id', uid); }catch(e){}
  }
  // sube al servidor las completadas que aún no se han sincronizado (por
  // defecto máx 60 recientes; forceResync pide un tope alto para subir TODO)
  async function syncBacklog(limit){
    if(!enabled() || !await init() || !client) return;
    const s=Store.get(); const done=(s.cloud&&s.cloud.syncedCompletions)||[];
    const pending=s.history.filter(h=>!done.includes(h.id)).slice(0, limit||60);
    for(const h of pending){
      if(h.shared && h.photoUrl && !h.photoId){
        // completada compartida recibida del compañero: la foto ya está en la nube
        await pushSharedCompletion({ id:h.id, date:h.date, title:h.title, category:h.category, points:h.points, time:h.time,
          photoUrl:h.photoUrl, partnerId:h.partnerId, partnerName:h.partnerName });
      } else {
        let photo=null; if(h.photoId){ try{ photo=await DB.get(h.photoId); }catch(e){} }
        await pushCompletion({ id:h.id, date:h.date, title:h.title, category:h.category, points:h.points, time:h.time, random:h.random,
          partnerId:h.partnerId, partnerName:h.partnerName, photoUrl:h.photoUrl }, photo);
      }
    }
  }

  // Borra del servidor las completadas que ya NO existen en tu historial local
  // (tareas eliminadas). Limpia filas, fotos del Storage y el registro local.
  async function reconcile(){
    if(!enabled() || !await init() || !client) return;
    try{
      const { data, error } = await client.from('completions').select('id').eq('user_id', uid);
      if(error) throw error;
      const cloudIds=(data||[]).map(r=>r.id);
      const localIds=new Set(Store.get().history.map(h=>h.id));
      const toDelete=cloudIds.filter(id=>!localIds.has(id));
      if(!toDelete.length) return;
      await client.from('completions').delete().in('id', toDelete).eq('user_id', uid);
      try{ await client.storage.from('photos').remove(toDelete.map(id=>`${uid}/${id}.jpg`)); }catch(e){}
      Store.update(s=>{ if(s.cloud&&s.cloud.syncedCompletions) s.cloud.syncedCompletions=s.cloud.syncedCompletions.filter(x=>!toDelete.includes(x)); });
    }catch(e){ console.warn("reconcile:", e && e.message); }
  }

  // descarga el perfil + completadas de un amigo (en vivo)
  async function pullFriend(id){
    if(!await init() || !client) return null;
    try{
      const { data:prof, error:e1 } = await client.from('profiles').select('*').eq('id',id).maybeSingle();
      if(e1) throw e1;
      if(!prof) return null;
      const { data:comps } = await client.from('completions').select('*').eq('user_id',id).order('date',{ascending:false}).limit(500);
      const history=(comps||[]).map(c=>({ id:c.id, sharedId:c.shared_id||null, date:c.date, title:c.title||"", category:c.category||"", points:c.points||0, time:c.time||"", photoUrl:c.photo_url||null, partnerId:c.partner_id||null, partnerName:c.partner_name||"", random:!!c.random }));
      const dates=[...new Set(history.map(h=>h.date).filter(Boolean))];
      return { cloudId:id, name:prof.name||"Amigo", avatar:prof.avatar_url||null,
        points:prof.points||0, streak:{current:prof.streak_current||0, best:prof.streak_best||0, lastDate:null}, dates, history };
    }catch(e){ console.warn("pullFriend:", e && e.message); return null; }
  }

  // Fuerza re-subir TODO (perfil + avatar + todas las completadas con foto) y
  // limpia lo eliminado. Recupera fotos que no llegaron a subirse en el pasado.
  async function forceResync(){
    if(!enabled() || !await init() || !client) return false;
    Store.update(s=>{ if(s.cloud){ s.cloud.syncedCompletions=[]; s.cloud.avatarSrc=null; } });
    await pushProfile(); await syncBacklog(2000); await reconcile(); // sube TODO el historial
    return true;
  }
  // Rellena en el historial local las URLs de foto que falten, leyéndolas de las
  // completadas de la nube de esta misma cuenta. Recupera fotos del calendario
  // que, tras una transferencia, quedaron sin enlace local (solo tenían la foto
  // en la nube). Devuelve true si cambió algo.
  async function relinkPhotos(){
    if(!enabled() || !await init() || !client) return false;
    try{
      const { data } = await client.from('completions').select('id,photo_url').eq('user_id', uid).limit(2000);
      const urlById={}; (data||[]).forEach(c=>{ if(c.photo_url) urlById[c.id]=c.photo_url; });
      let changed=false;
      Store.update(s=>{
        (s.history||[]).forEach(h=>{
          if(!h.photoId && !h.photoUrl && urlById[h.id]){ h.photoUrl=urlById[h.id]; changed=true; }
        });
      });
      return changed;
    }catch(e){ console.warn("relinkPhotos:", e && e.message); return false; }
  }

  /* ---------- Tareas compartidas ---------- */
  // Crear una compartida es una INVITACIÓN (igual que una solicitud de amistad):
  // se guarda como 'invited' y NO se añade a ninguna lista hasta que el
  // destinatario la acepte (ver acceptShared). El aviso lleva Aceptar/Rechazar.
  async function createShared(row){
    if(!enabled() || !await init() || !client) return false;
    try{ const { error }=await client.from('shared_tasks').insert({ ...row, status:'invited' }); if(error) throw error; }
    catch(e){ console.warn("createShared:", e && e.message); return false; }
    await notify(row.partner_id, 'shared_invite', row.title, null, row.id);
    return true;
  }
  async function fetchShared(){
    // Devuelve null si la consulta FALLÓ (para no confundir "sin red" con "sin
    // tareas" y borrar datos por error); [] si de verdad no hay compartidas.
    if(!enabled() || !await init() || !client) return null;
    try{ const { data, error }=await client.from('shared_tasks').select('*').or(`owner_id.eq.${uid},partner_id.eq.${uid}`); if(error) throw error; return data||[]; }
    catch(e){ console.warn("fetchShared:", e && e.message); return null; }
  }
  async function fetchSharedOne(id){
    if(!enabled() || !await init() || !client || !id) return null;
    try{ const { data, error }=await client.from('shared_tasks').select('*').eq('id', id).maybeSingle(); if(error) throw error; return data; }
    catch(e){ console.warn("fetchSharedOne:", e && e.message); return null; }
  }
  // Aceptar/rechazar una invitación a una tarea compartida (solo el invitado, y
  // solo mientras siga 'invited'), igual que aceptar/rechazar una solicitud de amistad.
  async function acceptShared(id){
    if(!enabled() || !await init() || !client) return false;
    try{ const { error }=await client.from('shared_tasks').update({ status:'pending' }).eq('id', id).eq('partner_id', uid).eq('status','invited'); if(error) throw error; return true; }
    catch(e){ console.warn("acceptShared:", e && e.message); return false; }
  }
  async function rejectShared(id){
    if(!enabled() || !await init() || !client) return;
    try{ await client.from('shared_tasks').delete().eq('id', id).eq('partner_id', uid).eq('status','invited'); }
    catch(e){ console.warn("rejectShared:", e && e.message); }
  }
  async function completeShared(id, fields){
    if(!enabled() || !await init() || !client) return false;
    try{ const { error }=await client.from('shared_tasks').update(fields).eq('id', id); if(error) throw error; return true; }
    catch(e){ console.warn("completeShared:", e && e.message); return false; }
  }
  async function deleteShared(id){
    if(!enabled() || !await init() || !client) return;
    try{ await client.from('shared_tasks').delete().eq('id', id); }catch(e){ console.warn("deleteShared:", e && e.message); }
  }
  async function uploadShared(sharedId, dataUrl){
    if(!enabled() || !await init() || !client) return null;
    return await uploadDataUrl(`${uid}/shared_${sharedId}.jpg`, dataUrl); // foto en tu carpeta (lectura pública)
  }

  /* ---------- Notificaciones ---------- */
  // PUSH REDUNDANTE (para que llegue en cualquier circunstancia): el aviso viaja
  // por DOS caminos a la vez — (1) el trigger del servidor lo envía al insertarse
  // la fila (funciona aunque cierres la app justo después) y (2) este dispositivo
  // manda un envío de RESPALDO directo a la Edge Function (funciona aunque el
  // trigger del servidor esté desactualizado o falle en silencio). Ambos llevan
  // el MISMO tag determinista, así que si llegan los dos, el sistema los funde
  // en UNA sola notificación (cero duplicados).
  function pushBodyFor(type, actorName){
    switch(type){
      case 'friend_request': return (actorName||'Alguien')+' te ha enviado una solicitud de amistad';
      case 'shared_invite':  return (actorName||'Alguien')+' quiere agregarte a una tarea';
      case 'comment':        return (actorName||'Alguien')+' te comentó';
      case 'shared_done':    return (actorName||'Un amigo')+' completó una tarea';
      default:               return (actorName||'Alguien')+' te envió una notificación';
    }
  }
  // Envío directo (respaldo). Nunca lanza: si falla, el trigger del servidor
  // sigue siendo el camino principal.
  async function backupPush(recipientId, type, refKey, photoUrl){
    try{
      if(!client || !recipientId || recipientId===uid) return;
      const actorName=(Store.get().profile.name||"Atleta");
      await client.functions.invoke('send-push', { body:{
        recipientId, title:"Tareas", body:pushBodyFor(type, actorName),
        photo:photoUrl||null,
        tag: type+'-'+(refKey||uid)   // mismo tag que construye el trigger del servidor
      }});
    }catch(e){}
  }
  // UNA FILA = UN PUSH: insertar el aviso dispara el push del servidor (trigger
  // sobre notifications). NO se manda además un push directo — eso duplicaba la
  // notificación (la deduplicación por etiqueta no es fiable en iOS). El push
  // directo (backupPush) queda SOLO como último recurso si la fila falla.
  async function notify(recipientId, type, taskTitle, photoUrl, refKey){
    if(!enabled() || !await init() || !client || recipientId===uid) return;
    const actorName=(Store.get().profile.name||"Atleta");
    try{ const { error }=await client.from('notifications').insert({ recipient_id:recipientId, actor_id:uid, actor_name:actorName, type, task_title:taskTitle||"", photo_url:photoUrl||null, ref_key:refKey||null }); if(error) throw error; }
    catch(e){ console.warn("notify:", e && e.message); backupPush(recipientId, type, refKey, photoUrl); }
  }
  // Respaldo del aviso "completó una tarea" COMO FILA (no solo push): si el
  // trigger del servidor no avisó (p. ej. la amistad en la nube está rota o
  // desactualizada), este dispositivo crea el aviso in-app del amigo. Se
  // comprueba antes si el trigger ya lo insertó, para no duplicar.
  async function backupDoneNotify(recipientId, entry, photoUrl){
    try{
      if(!client || !recipientId || recipientId===uid) return;
      const ref = entry.sharedId || entry.id;
      const { data } = await client.from('notifications').select('id')
        .eq('recipient_id',recipientId).eq('actor_id',uid).eq('type','shared_done').eq('ref_key',ref).limit(1);
      if(data && data.length) return;   // el trigger ya avisó (fila + push): no duplicar
      const actorName=(Store.get().profile.name||"Atleta");
      const { error } = await client.from('notifications').insert({ recipient_id:recipientId, actor_id:uid, actor_name:actorName,
        type:'shared_done', task_title:entry.title||"", photo_url:photoUrl||null, ref_key:ref,
        task_time:entry.time||null, task_category:entry.category||null, task_points:entry.points||null });
      if(error) throw error;            // la fila insertada dispara SU push (trigger)
    }catch(e){ backupPush(recipientId, 'shared_done', entry.sharedId||entry.id, photoUrl); } // último recurso
  }
  // Crea una notificación PARA MÍ MISMO (cuando detecto que un amigo completó una
  // tarea compartida). Así el aviso in-app es fiable aunque su app sea vieja.

  /* ---------- Amistades (solicitudes + amigos) ---------- */
  // Envía una solicitud de amistad: crea la relación 'pending' + notificación + push.
  // Busca un perfil por su ID EXACTO (nombre + avatar) mediante la función
  // segura del servidor: la tabla de perfiles ya NO es legible en abierto, así
  // que esta es la vía para agregar a alguien que todavía no es tu amigo.
  async function lookupProfile(id){
    try{
      if(!enabled() || !await init() || !client || !id) return null;
      const { data, error }=await client.rpc('lookup_profile', { target:id });
      if(error) throw error;
      const r=Array.isArray(data)?data[0]:data;
      return r ? { cloudId:r.id, name:r.name||"Amigo", avatar:r.avatar_url||null } : null;
    }catch(e){ console.warn("lookupProfile:", e && e.message); return null; }
  }
  // Busca por CORREO exacto. Devuelve solo nombre y avatar: el correo nunca
  // vuelve del servidor, solo se usa para comparar.
  async function lookupProfileEmail(email){
    try{
      if(!enabled() || !await init() || !client || !email) return null;
      const { data, error }=await client.rpc('lookup_profile_email', { target_email:String(email).trim() });
      if(error) throw error;
      const r=Array.isArray(data)?data[0]:data;
      return r ? { cloudId:r.id, name:r.name||"Amigo", avatar:r.avatar_url||null } : null;
    }catch(e){ console.warn("lookupProfileEmail:", e && e.message); return null; }

  // Acepta el correo del amigo. Antes recibía un UUID que había que copiar y
  // pegar; ahora ese identificador solo vive por dentro.
  async function sendFriendRequestByEmail(email){
    if(!enabled() || !await init() || !client) return { ok:false, error:"sin conexión" };
    const prof = await lookupProfileEmail(email);
    if(!prof) return { ok:false, error:"No hay ninguna cuenta con ese correo" };
    if(prof.cloudId===uid) return { ok:false, error:"Ese es tu propio correo" };
    return await sendFriendRequest(prof.cloudId, prof);
  }
  async function sendFriendRequest(targetId, known){
    if(!enabled() || !await init() || !client) return { ok:false, error:"sin conexión" };
    if(targetId===uid) return { ok:false, error:"Esa es tu propia cuenta" };
    // ¿existe el usuario? (lookup seguro: aún no sois amigos, no se puede leer
    // su perfil directamente)
    const prof = known || await lookupProfile(targetId);
    if(!prof) return { ok:false, error:"No se encontró esa cuenta" };
    // ¿ya hay relación?
    try{
      const { data:exist }=await client.from('friendships').select('requester,addressee,status')
        .or(`and(requester.eq.${uid},addressee.eq.${targetId}),and(requester.eq.${targetId},addressee.eq.${uid})`);
      if(exist && exist.length){
        const r=exist[0];
        if(r.status==='accepted') return { ok:false, error:"Ya son amigos" };
        if(r.requester===uid) return { ok:false, error:"Ya enviaste la solicitud" };
        // me la enviaron a mí: aceptarla en vez de duplicar
        await acceptFriend(targetId); return { ok:true, accepted:true, name:prof.name };
      }
      const { error }=await client.from('friendships').insert({ requester:uid, addressee:targetId, status:'pending' });
      if(error) throw error;
    }catch(e){ console.warn("sendFriendRequest:", e && e.message); return { ok:false, error:"No se pudo enviar" }; }
    // notificación + push para el destinatario
    await notify(targetId, 'friend_request', "");
    return { ok:true, name:prof.name };
  }

  /* ---------- Comentarios en tareas completadas ---------- */
  // Devuelve los comentarios con la foto/racha/nombre ACTUALES del autor (se leen

  async function fetchComments(key){
    if(!enabled() || !await init() || !client || !key) return [];
    try{
      const { data }=await client.from('comments').select('*').eq('completion_key', key).order('created_at',{ascending:true});
      const comments=data||[]; if(!comments.length) return [];
      const ids=[...new Set(comments.map(c=>c.author_id).filter(Boolean))];
      let pm={};
      if(ids.length){ const { data:profs }=await client.from('profiles').select('id,name,avatar_url,streak_current').in('id', ids); (profs||[]).forEach(p=>pm[p.id]=p); }

  // El aviso in-app Y el push (vía trigger del servidor) los crea
  // trg_notify_comment al insertarse el comentario. ADEMÁS, este dispositivo
  // manda un push de RESPALDO directo a TODOS los dueños de la completada (los
  // consulta en la nube: cubre tareas compartidas con varios implicados, no solo
  // el dueño que conoce el visor). Mismo tag que el trigger del servidor
  // ('comment-<completion_key>') → si llegan los dos caminos, se funden en uno.
  async function addComment(key, text, ownerId){
    if(!enabled() || !await init() || !client || !key || !text) return false;
    const name=(Store.get().profile.name||"Atleta");
    try{ const { error }=await client.from('comments').insert({ completion_key:key, author_id:uid, author_name:name, text:text }); if(error) throw error; }
    catch(e){ console.warn("addComment:", e && e.message); return false; }
    // Respaldo de FILA (no push directo): si el trigger del comentario no creó
    // el aviso para algún dueño, lo crea este dispositivo — y esa inserción
    // dispara su propio push. Sin doble envío (duplicaba la notificación).
    try{
      const owners=new Set(); if(ownerId) owners.add(ownerId);
      const { data:rows }=await client.from('completions').select('user_id,title').or(`id.eq.${key},shared_id.eq.${key}`);
      let ttl=""; (rows||[]).forEach(r=>{ if(r.user_id) owners.add(r.user_id); if(r.title) ttl=r.title; });
      for(const o of owners){
        if(!o || o===uid) continue;
        try{
          const { data:ex }=await client.from('notifications').select('id')
            .eq('recipient_id',o).eq('actor_id',uid).eq('type','comment').eq('ref_key',key)
            .gt('created_at', new Date(Date.now()-120000).toISOString()).limit(1);
          if(ex && ex.length) continue;   // el trigger ya avisó de ESTE comentario
          const { error }=await client.from('notifications').insert({ recipient_id:o, actor_id:uid, actor_name:name,
            type:'comment', task_title:ttl, ref_key:key });
          if(error) throw error;
        }catch(e){ backupPush(o, 'comment', key, null); } // último recurso
      }
    }catch(e){ if(ownerId && ownerId!==uid) backupPush(ownerId, 'comment', key, null); }
    return true;
  }

  /* ---------- Push en segundo plano ---------- */
  function urlB64ToUint8(base64){
    const pad="=".repeat((4-base64.length%4)%4); const b=(base64+pad).replace(/-/g,"+").replace(/_/g,"/");
    const raw=atob(b); const out=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i); return out;
  }
  async function ensurePush(){
    try{
      // Respeta el interruptor de Ajustes: si el usuario apagó las notificaciones,
      // no re-suscribimos por nuestra cuenta (aunque el permiso siga concedido).
      if(localStorage.getItem("rachas_notif")==="off") return false;
      if(!enabled() || !await init() || !client) return false;
      if(!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
      if(Notification.permission==="denied") return false;
      if(Notification.permission!=="granted"){ const p=await Notification.requestPermission(); if(p!=="granted") return false; }
      const reg=await navigator.serviceWorker.ready;
      const wantKey=urlB64ToUint8(VAPID_PUBLIC);
      let sub=await reg.pushManager.getSubscription();
      // Si la suscripción existente se creó con OTRA clave pública (p. ej. la de
      // ejemplo inicial), el envío fallará por desajuste VAPID. La rehacemos.
      if(sub && sub.options && sub.options.applicationServerKey){
        const cur=new Uint8Array(sub.options.applicationServerKey);
        let same=cur.length===wantKey.length;
        if(same){ for(let i=0;i<cur.length;i++){ if(cur[i]!==wantKey[i]){ same=false; break; } } }
        if(!same){
          const oldEp=sub.endpoint;
          try{ await sub.unsubscribe(); }catch(_){}
          try{ await client.from('push_subscriptions').delete().eq('endpoint', oldEp); }catch(_){}
          sub=null;
        }
      }
      if(!sub){ sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:wantKey }); }
      else{
        // La suscripción local puede seguir "viva" para el navegador aunque el
        // servidor de push ya la haya invalidado (p. ej. tras un 410 que borró
        // su fila). Si no encontramos su fila en Supabase, no la resucitamos
        // tal cual: forzamos una nueva de verdad, o quedaría reintentando para
        // siempre un endpoint muerto cada vez que se abre la app.
        const { data: existing } = await client.from('push_subscriptions').select('endpoint').eq('endpoint', sub.endpoint).maybeSingle();
        if(!existing){
          try{ await sub.unsubscribe(); }catch(_){}
          sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:wantKey });
        }
      }
      const json=sub.toJSON();
      await client.from('push_subscriptions').upsert({ user_id:uid, endpoint:sub.endpoint, subscription:json, updated_at:new Date().toISOString() });
      // Limpia OTRAS suscripciones de este mismo usuario (de una reinstalación
      // anterior de la PWA: el navegador emite un endpoint nuevo y la fila vieja
      // se queda huérfana, sin fallar nunca con 404 porque sigue siendo válida
      // para el servicio de push). Si no se limpian, cada aviso se manda a
      // todas → notificaciones duplicadas y más lentas de entregar.
      try{ await client.from('push_subscriptions').delete().eq('user_id', uid).neq('endpoint', sub.endpoint); }catch(_){}
      return true;
    }catch(e){ console.warn("ensurePush:", e && e.message); return false; }
  }
  // Apaga las notificaciones push de ESTE dispositivo: cancela la suscripción del
  // navegador y borra su fila en Supabase, para que dejen de llegar avisos.
  async function disablePush(){
    try{
      if(!("serviceWorker" in navigator)) return;
      const reg=await navigator.serviceWorker.ready;
      const sub=await reg.pushManager.getSubscription();
      if(sub){ const ep=sub.endpoint;
        try{ await sub.unsubscribe(); }catch(_){}
        try{ if(client) await client.from('push_subscriptions').delete().eq('endpoint', ep); }catch(_){}
      }
    }catch(e){ console.warn("disablePush:", e && e.message); }
  }
  // Guarda/actualiza el recordatorio de una tarea en la nube (tabla `reminders`)
  // para que el push programado del servidor lo mande aunque la app esté cerrada.
  // Si la tarea no tiene recordatorio, borra su fila.
  async function syncReminder(t){
    try{
      if(!enabled() || !await init() || !client || !t) return;
      if(!t.reminder || !t.reminder.time){ await client.from('reminders').delete().eq('user_id',uid).eq('task_id',String(t.id)); return; }
      const p=String(t.reminder.time).split(":"); const hh=+p[0]||0, mm=+p[1]||0;
      const r=t.recurrence||{type:'once'};
      let kind='daily', dow=[], dom=[], on_date=null;
      // Con DÍAS MARCADOS el servidor puede repetir solo. La app usa 0=Lunes;
      // Postgres extract(dow) usa 0=Domingo → se convierte.
      if((r.type==='weekly'||r.type==='custom') && (r.days||[]).length){
        kind='weekly'; dow=(r.days||[]).map(d=>(d+1)%7);
      } else if(r.type==='monthly' && (r.dates||[]).length){
        kind='monthly'; dom=(r.dates||[]).slice();
      } else {
        /* Sin días marcados el ritmo es un INTERVALO ("cada 3 días", "cada 2
           semanas"), y la tabla de la nube no sabe expresarlo: registrarlo
           como 'daily' hacía que el aviso sonara TODOS los días aunque la
           tarea venciera cada tres. Se registra como una fecha concreta —la
           del vencimiento en curso— y se vuelve a registrar cada vez que la
           tarea abre ciclo nuevo. */
        kind='date'; on_date=dateKey(new Date(taskDueAt(t)));
      }
      await client.from('reminders').upsert({ user_id:uid, task_id:String(t.id), title:t.title, hh, mm,
        kind, dow, dom, on_date, tz_offset:new Date().getTimezoneOffset(), active:true, updated_at:new Date().toISOString() });
    }catch(e){ console.warn("syncReminder:", e && e.message); }
  }
  async function deleteReminder(taskId){

    catch(e){ console.warn("deleteReminder:", e && e.message); }
  }
