/* =====================================================================
   GAMIFY — puntos, rango (con animación), racha (con animación)
   ===================================================================== */
const Gamify = (() => {
  function awardCompletion(entry){
    const s = Store.get();
    const before = rankFor(s.points).index;

    let streakUp = 0; // fuera del entry: no debe persistirse en el historial
    Store.update(st=>{
      st.points += entry.points;
      st.history.unshift(entry);
      // racha
      const today = dateKey();
      const last = st.streak.lastDate;
      if (last !== today){
        if (last === yesterdayKey()) st.streak.current += 1;
        else st.streak.current = 1;
        st.streak.lastDate = today;
        if (st.streak.current > st.streak.best) st.streak.best = st.streak.current;
        streakUp = st.streak.current;
      }
    });

    // Sin puntos (tarea vencida) no hay nada que anunciar: el "+0" flotando
    // en mitad de la pantalla solo subrayaría lo que ya dice el anillo rojo.
    if(entry.points > 0) UI.pointsPop("+"+entry.points);
    const after = rankFor(Store.get().points).index;

    // racha primero (banner), luego rango si subió
    if (streakUp){ setTimeout(()=>UI.streakBanner(streakUp), 500); }
    if (after > before){ setTimeout(()=>UI.rankUp(RANKS[after]), streakUp?1500:700); }
  }
  return { awardCompletion };
})();

/* =====================================================================
   SHEETS — bottom sheets (crear tarea, completar/foto, galería)
   ===================================================================== */
const Sheets = (() => {
  const scrim = $("#scrim"), host = $("#sheet");
  let onClose = null;
  // Al enfocar un campo dentro de la hoja, el teclado la eleva; centramos el
  // campo enfocado en el área visible para que quede JUSTO encima del teclado
  // (esperamos a que el teclado termine de abrir y la hoja se reubique).
  host.addEventListener("focusin", (e)=>{
    const t=e.target;
    if(!t || !/^(INPUT|TEXTAREA)$/.test(t.tagName)) return;
    // Solo si el campo enfocado queda TAPADO por el teclado, desplazamos el cuerpo
    // de la hoja lo justo para subirlo por encima (no movemos la hoja entera).
    setTimeout(()=>{ try{
      const vv=window.visualViewport; if(!vv) return;
      const kbTop=vv.offsetTop+vv.height;              // borde superior del teclado
      const r=t.getBoundingClientRect();
      const overlap=Math.round(r.bottom-(kbTop-16));
      const bodyEl=host.querySelector(".sheet-body");
      if(overlap>0 && bodyEl) bodyEl.scrollBy({top:overlap, behavior:"smooth"});
    }catch(_){}}, 320);
  });
  function open(html, cls){
    delete host.dataset.closing;
    host.style.transition="";           // restaura la transición de ENTRADA del CSS
    host.className = "sheet" + (cls?(" "+cls):"");
    host.innerHTML = html;               // opciones ya vienen en el HTML (sin reflow)
    try{ fitSheet(); }catch(e){}         // fija alto ANTES de mostrar, ya con contenido
    scrim.classList.add("show");
    requestAnimationFrame(()=> host.classList.add("show"));
    haptic();
    scrim.onclick = close;
    return host;
  }
  // Cambia el contenido de un sheet YA ABIERTO (p.ej. navegar de un perfil a
  // uno de sus días y volver) sin reiniciar la animación de entrada: si se
  // usara open() ahí, quitaría y volvería a poner "show" y la hoja completa
  // se vería "temblar" (baja y vuelve a subir) en cada navegación.
  function swap(html, cls){
    delete host.dataset.closing;
    host.className = "sheet show" + (cls?(" "+cls):"");
    host.innerHTML = html;
    scrim.classList.add("show");
    haptic();
    scrim.onclick = close;
    return host;
  }
  function close(){
    // marca "cerrando" para que fitSheet no reubique la hoja mientras sale, y
    // cierra el teclado (blur) para que su desaparición no la empuje.
    host.dataset.closing = "1";
    const a=document.activeElement; if(a && a.blur) a.blur();
    // Salida rápida y directa (ease-IN corto): antes la curva de entrada dejaba
    // una cola lenta y parecía que la hoja "se quedaba" abajo un segundo.
    host.style.transition = "transform .26s cubic-bezier(0.4,0,1,1)";
    host.classList.remove("show");
    scrim.classList.remove("show");
    if (onClose){ const f=onClose; onClose=null; setTimeout(f,280); }
    setTimeout(()=>{ delete host.dataset.closing; host.style.bottom=""; host.style.maxHeight=""; host.style.transition=""; }, 300);
  }
  // Abre si está cerrado; si ya hay una hoja abierta, solo cambia el contenido
  // (swap). Así, navegar dentro de una hoja (aceptar un aviso, pasar de las
  // acciones de una tarea a completarla, etc.) no re-anima la hoja entera
  // desde abajo ("temblor"), igual que en las hojas nativas de iOS.
  function show(html, cls){
    return (scrim.classList.contains("show") ? swap : open)(html, cls);
  }
  function setOnClose(f){ onClose=f; }
  return { open, swap, show, close, setOnClose, host };
})();

/* =====================================================================
   TASKS — crear, listar, completar (con foto), borrar
   ===================================================================== */
const Tasks = (() => {
  let filter = "pending";
  let doneDate = dateKey(); // fecha mostrada en "Completadas" (por defecto, hoy)
  let sharedBackfilled = false; // re-sube una vez por sesión las compartidas (para rellenar "con quién")

  const RECUR = [
    {k:"once",  l:"Solo hoy"},
    {k:"date",  l:"Fecha"},
    {k:"daily", l:"Cada día"},
    {k:"weekly",l:"Cada semana"},
    {k:"monthly",l:"Cada mes"}
  ];
  const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  // "2026-08-14" -> "14 de agosto" (o "14 ago 2026" si es otro año)
  function dateLabel(key){
    if(!key) return "Fecha";
    const [y,m,d]=key.split("-").map(Number);
    const base=`${d} de ${MESES[m-1]}`;
    return y===new Date().getFullYear() ? base : `${base} ${y}`;
  }
  const DAYS = ["Lu","Ma","Mi","Ju","Vi","Sá","Do"]; // 0=Lunes (etiquetas del selector)
  const DAYNAMES = ["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
  // Convierte un conjunto de días (0=lunes) en un texto natural
  function daysLabel(daysArr){
    const ds = [...new Set(daysArr)].sort((a,b)=>a-b);
    if(!ds.length) return "Personalizado";
    const key = ds.join(",");
    if(key==="0,1,2,3,4") return "Entre semana";
    if(key==="5,6") return "Fin de semana";
    if(ds.length===7) return "Todos los días";
    const consec = ds.every((d,i)=> i===0 || d===ds[i-1]+1);
    let txt;
    if(consec && ds.length>=3) txt = `de ${DAYNAMES[ds[0]]} a ${DAYNAMES[ds[ds.length-1]]}`;
    else {
      const names = ds.map(i=>DAYNAMES[i]);
      txt = names.length===1 ? names[0] : names.slice(0,-1).join(", ") + " y " + names[names.length-1];
    }
    return txt.charAt(0).toUpperCase()+txt.slice(1);
  }
  // "Día 14 de cada mes" / "Días 1, 14, 28"
  function datesLabel(dates){
    const ds=[...new Set(dates)].sort((a,b)=>a-b);
    if(!ds.length) return "Cada mes";
    if(ds.length===1) return `Día ${ds[0]} de cada mes`;
    return `Días ${ds.join(", ")}`;
  }
  // utilidades de fecha (clave "YYYY-MM-DD")
  const weekdayOf = (key)=>{ const [y,m,d]=key.split("-").map(Number); return (new Date(y,m-1,d).getDay()+6)%7; }; // 0=Lunes
  const domOf = (key)=> parseInt(key.split("-")[2],10); // día del mes
  function addDays(key,n){ const [y,m,d]=key.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dateKey(dt); }
  // ¿la tarea está PROGRAMADA (vence) en la fecha 'key'?
  function dueOn(t, key){
    const r=t.recurrence||{type:"once"};
    const created=dateKey(new Date(t.createdAt||Date.now()));
    if(key<created) return false;
    switch(r.type){
      case "once":  return key===created;
      case "date":  return r.date===key;
      case "daily": return true;
      case "weekly": case "custom": return (r.days&&r.days.length) ? r.days.includes(weekdayOf(key)) : true;
      case "monthly": return (r.dates&&r.dates.length) ? r.dates.includes(domOf(key)) : (domOf(key)===domOf(created));
      default: return false;
    }
  }
  const isScheduledToday = (t)=> dueOn(t, dateKey());
  const completedOn = (t,key)=> Store.get().history.some(h=> h.taskId===t.id && h.date===key);

  /* =====================================================================
     EL RELOJ DE LA TAREA
     Cada tarea tiene una VENTANA: desde que quedó pendiente hasta que vence.
     El anillo dibuja esa ventana. Mientras queda tiempo el arco es verde y se
     vacía; cuando se agota, se vuelve rojo y se llena otra vez, midiendo
     ahora el retraso (una ventana entera de retraso = anillo rojo completo).

     La ventana NO necesita un campo nuevo: sale de la repetición que ya
     eliges al crear la tarea. "Cada día" son 24 h, "Lunes y viernes" es el
     hueco entre esos dos días, "Solo hoy" es lo que queda de hoy. Así las
     tareas que ya existen tienen su anillo desde el primer momento, sin
     migrar nada.
     ===================================================================== */
  const RING_R = 44;
  const RING_C = 2 * Math.PI * RING_R;          // circunferencia del arco
  const endOfDay = (key)=>{ const [y,m,d]=key.split("-").map(Number);
    return new Date(y, m-1, d, 23, 59, 59, 999).getTime(); };

  /* La ventana se ancla en la ÚLTIMA VEZ QUE LA HICISTE (o en su creación, si
     nunca), NO en el día de hoy. Es la diferencia entre un reloj y un
     calendario: anclada en hoy, una tarea atrasada se renovaba sola cada
     medianoche y el anillo volvía a verde entero, así que el rojo no llegaba
     a aparecer nunca. Anclada en la última vez, el vencimiento se queda fijo
     donde está y el retraso se acumula hasta que la completas. */
  /* El anillo arranca SIEMPRE lleno —al crear la tarea o al empezar su ciclo—
     y se vacía según pasa el tiempo. Al llegar a cero se vuelve rojo y se
     llena otra vez, midiendo el retraso: un intervalo entero de retraso deja
     el anillo rojo completo. */
  function ringState(t){
    const now = Date.now();
    const { start, due, period } = taskWindow(t);
    if(now <= due){
      // Antes de que empiece su ciclo el anillo se ve lleno, no vacío.
      const frac = now <= start ? 1 : (due - now) / period;
      return { over:false, frac: Math.max(0, Math.min(1, frac)), due };
    }
    // Vencida: el rojo arranca con un trocito visible, no desde la nada.
    return { over:true, frac: Math.max(0.05, Math.min(1, (now - due) / period)), due };
  }
  // Lo que suma completarla AHORA: el anillo verde, tal y como se ve.
  function pointsForNow(t){
    const st = ringState(t);
    return st.over ? 0 : Math.round(taskMaxPoints(t) * st.frac);
  }
  const ringOffset = (frac)=> (RING_C * (1 - frac)).toFixed(2);

  // "1d 23 h", "3 h 20 min", "12 min": la unidad grande manda y la pequeña
  // matiza. Con una sola unidad, "vence en 1d" no dice si son 25 h o 47 h.
  function spanLabel(ms){
    const d = Math.floor(ms/86400000);
    const h = Math.floor((ms%86400000)/3600000);
    const m = Math.floor((ms%3600000)/60000);
    if(d > 0) return h > 0 ? d+"d "+h+" h" : d+"d";
    if(h > 0) return m > 0 ? h+" h "+m+" min" : h+" h";
    return Math.max(1,m) + " min";
  }
  function dueLabel(due){
    const diff = due - Date.now();
    return diff >= 0 ? "vence en " + spanLabel(diff) : "vencida hace " + spanLabel(-diff);
  }

  function recurLabel(t){
    const r=(t&&t.recurrence)||t||{type:"once"};
    const today=dateKey();
    if(r.type==="once") return "Solo hoy";
    if(r.type==="date") return r.date===today ? "Hoy" : dateLabel(r.date);
    if(r.type==="daily") return "Cada día";
    if(r.type==="weekly"||r.type==="custom"){
      if(!r.days||!r.days.length) return "Cada semana";
      if(r.days.includes(weekdayOf(today))) return "Hoy"; // hoy es uno de sus días
      return daysLabel(r.days);
    }
    if(r.type==="monthly"){
      if(!r.dates||!r.dates.length) return "Cada mes";
      if(r.dates.includes(domOf(today))) return "Hoy";
      return datesLabel(r.dates);
    }
    return "Solo hoy";
  }
  /* Con intervalos, "hecha hoy" ya no significa nada: una tarea puede vencer
     cada 3 horas o cada 2 semanas. Al completarla se guarda hasta cuándo
     queda cubierta (doneUntil = arranque de su PRÓXIMO ciclo) y se oculta de
     la lista hasta entonces. Con "intervalo fijo" eso es justo el final del
     ciclo actual; con "última finalización", ahora mismo, y por eso reaparece
     al instante con el anillo lleno. */
  const isDoneToday = (t)=>{
    if(!t.repeats) return !!t.done;
    if(typeof t.doneUntil === "number") return Date.now() < t.doneUntil;
    return t.lastDone === dateKey();   // respaldo para datos antiguos
  };
  // ¿la tarea aparece hoy en tu lista? Solo limita si "Mostrar solo esos días" está activo.
  const scheduledToday = (t)=> Date.now() >= taskWindow(t).start;

  /* ---------- RECORDATORIOS ----------
     Programa una notificación local a la hora elegida para las tareas con
     recordatorio que tocan HOY y siguen pendientes. Nota: los timers viven
     mientras la app está abierta/en segundo plano; para un aviso garantizado con
     la app CERRADA hace falta un envío push programado en el servidor. */
  let reminderTimers=[];
  const remKey=(t)=> t.id+"@"+dateKey();               // una vez por tarea y día
  function remFired(t){ try{ return (localStorage.getItem("rachas_reminded")||"").split(",").includes(remKey(t)); }catch(e){ return false; } }
  function remMark(t){ try{ let s=(localStorage.getItem("rachas_reminded")||"").split(",").filter(Boolean);
    const k=remKey(t); if(!s.includes(k)){ s.push(k); if(s.length>60) s=s.slice(-60); localStorage.setItem("rachas_reminded", s.join(",")); } }catch(e){} }
  // UN SOLO EMISOR POR RECORDATORIO. El aviso llegaba DUPLICADO porque salían a
  // la vez el push del servidor (cron) y el aviso local de la app. La
  // deduplicación por etiqueta no es fiable en iOS, así que se decide el emisor
  // ANTES de enviar:
  //   · El recordatorio está registrado en la nube → lo envía el SERVIDOR. El
  //     local solo actúa de respaldo si el servidor NO lo mandó (se comprueba
  //     con last_sent, que el propio cron escribe al enviar).
  //   · No está en la nube (o no hay nube) → lo envía la app, como siempre.
  function scheduleReminders(){
    reminderTimers.forEach(t=>clearTimeout(t)); reminderTimers=[];
    if(!("Notification" in window) || Notification.permission!=="granted") return;
    if(localStorage.getItem("rachas_notif")==="off") return;
    const cloudOn = Cloud.enabled && Cloud.enabled();
    if(cloudOn && Cloud.listReminders){
      // qué recordatorios conoce el servidor y cuáles ya envió HOY
      Cloud.listReminders().then(rows=> planReminders(rows||[])).catch(()=> planReminders(null));
    } else planReminders(null);
  }
  // rows=null → el servidor no interviene (sin nube o sin respuesta): la app se
  // encarga de todos, como antes.
  function planReminders(rows){
    const now=new Date(), todayKey=dateKey();
    const byTask={}; (rows||[]).forEach(r=>{ if(r && r.active!==false) byTask[String(r.task_id)]=r; });
    (Store.get().tasks||[]).forEach(t=>{
      if(!t.reminder || !t.reminder.time) return;
      // Solo avisa si la tarea está VIVA hoy: su ventana abierta y sin hacer.
      if(!scheduledToday(t) || isDoneToday(t)) return;
      if(dateKey(new Date(taskWindow(t).due)) !== todayKey) return;
      if(remFired(t)) return;                            // ya avisado hoy
      const p=String(t.reminder.time).split(":"), h=+p[0], m=+p[1];
      if(isNaN(h)||isNaN(m)) return;
      const at=new Date(now); at.setHours(h,m,0,0);
      const delay=at.getTime()-now.getTime();
      if(delay>26*3600*1000) return;
      const server=rows ? byTask[String(t.id)] : null;   // ¿lo enviará el servidor?
      if(server){
        if(server.last_sent===todayKey) { remMark(t); return; }  // el servidor YA avisó hoy
        // Aún no ha salido: respaldo solo si la hora pasó hace un rato (margen
        // para que el cron actúe) y la app está delante.
        const mins=(now.getTime()-at.getTime())/60000;
        if(mins>=5 && mins<=12*60 && !document.hidden) fireReminder(t);
        return;                                          // sin temporizador local
      }
      if(delay<=0){
        // Sin respaldo del servidor: iOS suspende los temporizadores con la app
        // cerrada, así que al reabrir avisamos (hasta 12 h después).
        if(now.getTime()-at.getTime() <= 12*3600*1000 && !document.hidden) fireReminder(t);
        return;
      }
      reminderTimers.push(setTimeout(()=>fireReminder(t), delay));
    });
  }
  async function fireReminder(t){
    try{
      if(Notification.permission!=="granted" || remFired(t)) return;
      const title="🛎️ Recordatorio";
      const opts={ body:t.title, icon:"./icons/icon-192.png", badge:"./icons/icon-192.png", tag:"reminder-"+t.id };
      if("serviceWorker" in navigator){
        const reg=await navigator.serviceWorker.ready;
        // Antiduplicados: si el push del servidor ya está visible con el mismo
        // texto (aunque llegara sin tag), no añadimos un segundo aviso.
        try{ const ex=await reg.getNotifications();
          if(ex.some(n=>n.title===title && n.body===t.title)){ remMark(t); return; } }catch(_){}
        remMark(t);
        reg.showNotification(title, opts);
      }
      else { remMark(t); new Notification(title, opts); }
    }catch(e){}
  }

  /* ---------- AUTO-ELIMINACIÓN (solo de una vez) ----------
     "Solo hoy" y "Fecha" se borran al pasar su día sin completar. Las
     recurrentes NO se borran: solo penalizan los días programados sin hacer. */
  /* Una tarea se borra sola cuando su anillo rojo se completa: ahí ya te ha
     costado todo lo que podía costar y no queda nada que cobrar ni que salvar.
     Antes desaparecían "al día siguiente", una hora arbitraria; ahora el
     momento lo marca el mismo anillo que llevas viendo llenarse.

     Dos excepciones, y las dos por lo mismo —borrar no se deshace—:
     · Las que SE REPITEN no se borran. Perder "Correr" por no haber corrido dos
       días seguidos sería castigar el olvido con la pérdida del hábito. Su
       anillo se queda lleno hasta que la hagas, y ahí rueda al ciclo siguiente.
     · Las COMPARTIDAS tampoco. Borrarlas las borra para los dos, y la tarea de
       tu amigo no puede desaparecer porque tú la dejaras pudrirse. */
  function isRotten(t, now){
    if(t.repeats || t.shared) return false;
    const { due, period } = taskWindow(t);
    return now >= due + period;
  }
  /* ---------- PENALIZACIÓN por tareas vencidas ----------
     El castigo es un solo cobro, y llega cuando el anillo rojo se COMPLETA:
     ni antes ni a plazos. Mientras el rojo se está llenando no cuesta nada,
     que es lo que hace que corras a hacerla; cuando se llena del todo cuesta
     lo mismo que habría dado el verde entero, de una vez.

     El goteo proporcional que había aquí antes descontaba de tres en tres
     puntos cada vez que se abría la app. Era exacto y era invisible: veías
     "−18 pts" sin haber hecho nada y sin que ese 18 significara nada.

     `penalizedFor` guarda QUÉ vencimiento se cobró, así una pasada de más no
     cobra dos veces y al rodar el vencimiento el cobro vuelve a estar
     disponible. Se cobra ANTES de borrar: al salir de la lista la tarea deja
     de tener anillo, y con él se iría sin pagar. */
  function cleanupExpired(){
    const s=Store.get(); const now=Date.now();
    let penalty=0; const marks=[], rotten=[];
    (s.tasks||[]).forEach(t=>{
      const { due, period } = taskWindow(t);
      if(now < due + period || isDoneToday(t)) return;   // el rojo aún no está lleno
      if(t.penalizedFor !== due){ penalty += taskMaxPoints(t); marks.push({ id:t.id, due }); }
      if(isRotten(t, now)) rotten.push(t);
    });
    if(!marks.length && !rotten.length) return;
    const rotIds = new Set(rotten.map(t=>t.id));
    Store.update(st=>{
      marks.forEach(m=>{ const t=st.tasks.find(x=>x.id===m.id); if(t) t.penalizedFor=m.due; });
      if(penalty>0){
        const sum=(st.history||[]).reduce((a,h)=>a+(h.points||0),0);
        st.penalties=Math.min((st.penalties||0)+penalty, sum);   // topada en lo ganado
        st.points=Math.max(0, sum - st.penalties);
      }
      if(rotIds.size) st.tasks = st.tasks.filter(t=>!rotIds.has(t.id));
    });
    if(rotIds.size) rotten.forEach(t=>{ if(Cloud.enabled && Cloud.enabled()) Cloud.deleteReminder(t.id); });
    // Sin re-pintar desde aquí: el único que llama es render(), y lee la lista
    // DESPUÉS de esta pasada. Repintar sería volver a entrar en sí mismo.
    if(penalty>0 || rotIds.size){
      if(UI.renderProfile) UI.renderProfile();
      if(penalty>0 && Cloud.enabled()) Cloud.pushProfile();
      // Un aviso por lo que ha pasado, no dos: la tarea se llenó y eso costó.
      const one = rotten[0] || (marks.length===1 ? (s.tasks||[]).find(x=>x.id===marks[0].id) : null);
      UI.toast(one && (rotten.length + marks.length)<=2
        ? `“${one.title}” venció${penalty>0?` · −${penalty} pts`:""}`
        : `Tareas vencidas${penalty>0?` · −${penalty} pts`:""}`, "check", "var(--red)");
    }
  }

  /* ---------- TAREAS COMPARTIDAS: sincroniza con la nube ----------
     Recibe las que te comparten, refleja su estado, y si uno la completa,
     se marca hecha para ambos (con la misma foto, puntos y en el calendario). */
  async function syncShared(){
    if(!Cloud.enabled()) return;
    const myId=Cloud.myId(); if(!myId) return;
    const s0=Store.get(); const del=s0.deletedShared||[];
    let rows=await Cloud.fetchShared();
    if(rows===null) return; // la consulta falló (sin red): no tocar nada
    rows=rows.filter(r=> !del.includes(r.id)); // ignorar las que ya borraste
    const rowById={}; rows.forEach(r=>rowById[r.id]=r);
    const s=Store.get();
    let tasks=s.tasks.slice(), changed=false;
    // A) quitar las compartidas locales cuya fila ya no existe (borradas por el
    //    otro) Y limpiar su registro del historial (foto + puntos), para que la
    //    tarea borrada deje de verse en TU calendario y en el de tus amigos.
    const vanished=tasks.filter(t=> t.shared && t.sharedId && !rowById[t.sharedId]);
    const removeHistIds=new Set(); let removedPts=0;
    const goneKeys=new Set(), goneTitles=new Set(); // para purgar sus avisos in-app
    if(vanished.length){
      vanished.forEach(t=>{ if(t.sharedId) goneKeys.add(t.sharedId); if(t.title) goneTitles.add((t.title||"").trim()); });
      tasks=tasks.filter(t=> !(t.shared && t.sharedId && !rowById[t.sharedId]));
      changed=true;
    }
    // A2) limpiar registros del historial de tareas COMPARTIDAS cuya fila ya no
    //     existe (la tarea se borró), aunque ya no tengas la tarea local. Cubre
    //     tanto las que recibiste (id "sh_") como las que TÚ completaste (id
    //     normal): a estas se les localiza la fila por su sharedId o, si es un
    //     registro antiguo sin sharedId, por el título.
    const norm = x => (x||"").trim();
    (s.history||[]).forEach(h=>{
      const isSh = typeof h.id==='string' && h.id.slice(0,3)==='sh_';
      if(!h.shared && !isSh) return;
      let sid = h.sharedId || (isSh ? h.id.slice(3) : null);
      if(!sid){ const r=rows.find(r=> norm(r.title)===norm(h.title)); sid = r ? r.id : '__gone__'; }
      if(sid==='__gone__' || !rowById[sid]){ removeHistIds.add(h.id); removedPts+=(h.points||0);
        if(sid && sid!=='__gone__') goneKeys.add(sid); if(h.title) goneTitles.add((h.title||"").trim()); }
    });
    if(removeHistIds.size) changed=true;
    const prunedNotifs = goneKeys.size || goneTitles.size; if(prunedNotifs) changed=true;
    // B) añadir las que me han compartido y aún no tengo (pendientes). Las
    // "invited" son solo una invitación sin responder: no se añaden a ninguna
    // lista hasta que el destinatario la acepte (ver Notifs: Aceptar/Rechazar).
    rows.forEach(r=>{
      if(r.status==='done' || r.status==='invited') return;
      if(tasks.some(t=>t.sharedId===r.id)) return;
      const amOwner=r.owner_id===myId;
      tasks.unshift(Object.assign({ id:r.id, title:r.title, desc:r.descr||"", category:r.category, minutes:r.minutes||10, people:r.people||1,
        urgent:!!r.urgent, recurrence:r.recurrence||{type:'once',days:[]}, onlyOnDays:!!r.only_on_days,
        random:false, createdAt:Date.now(), done:false, lastDone:null,
        shared:true, sharedId:r.id, ownerId:r.owner_id, partnerId:amOwner?r.partner_id:r.owner_id, partnerName:amOwner?r.partner_name:r.owner_name },
        defaultDueFields(r.recurrence)));
      changed=true;
    });
    // C) actualizar nombre/estado y procesar completadas
    const newHist=[]; let addPts=0;
    tasks.forEach(t=>{
      if(!t.shared || !t.sharedId) return;
      const r=rowById[t.sharedId]; if(!r) return;
      const amOwner=r.owner_id===myId;
      const pn=amOwner?r.partner_name:r.owner_name; if(pn && t.partnerName!==pn){ t.partnerName=pn; changed=true; }
      if(r.status==='done'){
        const rec=t.recurrence; if(rec && rec.type!=='once' && rec.type!=='date') t.lastDone=r.done_date||dateKey(); else t.done=true;
        const histId='sh_'+r.id;
        // solo el compañero (no el que la completó) añade el registro: foto + puntos + calendario
        if(r.completed_by!==myId && !s.history.some(h=>h.id===histId)){
          newHist.push({ id:histId, taskId:t.id, title:t.title, category:t.category, minutes:t.minutes,
            points:r.points||0, random:false, date:r.done_date||dateKey(), time:r.done_time||"", photoUrl:r.photo_url||null, shared:true, partnerName:t.partnerName||"", partnerId:t.partnerId||null });
          addPts+=(r.points||0); changed=true;
        }
      }
    });
    if(!changed) return;
    Store.update(st=>{
      st.tasks=tasks;
      if(removeHistIds.size){ st.history=st.history.filter(h=>!removeHistIds.has(h.id)); st.points=Math.max(0, st.points-removedPts); }
      if(newHist.length){ st.history=newHist.concat(st.history); st.points+=addPts; }
      if(removeHistIds.size || newHist.length){
        const stk=streakFromHistory(st.history);
        st.streak.current=stk.current; st.streak.best=stk.best; st.streak.lastDate=stk.lastDate;
      }
      // purga inmediata de avisos (completó/comentó) de tareas ya borradas por el
      // otro, para que no queden en el menú de notificaciones (el servidor también
      // los borra por trigger; esto es para que se vea al instante).
      if(prunedNotifs){
        st.notifs=(st.notifs||[]).filter(n=>{
          if(n.type!=='shared_done' && n.type!=='comment') return true;
          if(n.ref_key) return !goneKeys.has(n.ref_key);
          return !goneTitles.has((n.task_title||"").trim()); // avisos antiguos sin ref_key
        });
      }
    });
    if(prunedNotifs && Notifs){
      if(Notifs.updateBadge) Notifs.updateBadge();
      // si el menú de notificaciones está abierto, refréscalo al instante
      const sheetOpen = !!$("#ntList") && $("#scrim").classList.contains("show");
      if(sheetOpen && Notifs.openSheet) Notifs.openSheet();
    }
    // subir a la nube las completadas compartidas que acabo de recibir, para que
    // aparezcan en MI calendario (el que ven mis amigos) y se reflejen mis puntos,
    // y crear MI notificación in-app de que un amigo completó la tarea
    if(newHist.length && Cloud.enabled()){
      newHist.forEach(h=> Cloud.pushSharedCompletion(h));
      // la notificación in-app la crea el trigger del servidor (fiable). Solo
      // refrescamos para que aparezca enseguida.
      if(Notifs && Notifs.refresh) setTimeout(()=>Notifs.refresh(), 800);
    }
    // si quité tareas borradas, refleja en la nube (borra filas/puntos) para que
    // tus amigos dejen de verlas, y quita sus notificaciones (ya no tienen sentido)
    if((removeHistIds.size || newHist.length) && Cloud.enabled()){ Cloud.pushProfile(); Cloud.reconcile(); }
    if(vanished.length && Cloud.enabled()){
      const titles=new Set(vanished.map(t=>t.title));
      titles.forEach(t=> Cloud.clearNotifsByTitle(t));
      Store.update(st=>{ st.notifs=(st.notifs||[]).filter(n=>!titles.has(n.task_title)); });
      if(Notifs && Notifs.updateBadge) Notifs.updateBadge();
    }
    render(); if(UI.renderProfile) UI.renderProfile();
    backfillShared();
  }
  // Una sola vez por sesión: re-sube las completadas compartidas que ya tenías,
  // para rellenar en la nube las columnas "con quién" (partner_id/partner_name)
  // de registros antiguos creados antes de esta función.
  function backfillShared(){
    if(sharedBackfilled || !Cloud.enabled()) return;
    sharedBackfilled = true;
    const s=Store.get();
    (s.history||[]).forEach(h=>{
      if(!h.shared) return;
      let pid=h.partnerId, pname=h.partnerName;
      if(!pid || !pname){ const t=(s.tasks||[]).find(x=>x.id===h.taskId); if(t){ pid=pid||t.partnerId; pname=pname||t.partnerName; } }
      if(h.photoUrl && !h.photoId) Cloud.pushSharedCompletion({ ...h, partnerId:pid, partnerName:pname }); // recibida: crea/actualiza la fila
      else Cloud.updatePartner(h.id, pid, pname);                                                          // propia: solo parchea "con quién"
    });
  }

  /* ---------- LISTA ---------- */
  function render(){
    cleanupExpired();
    scheduleReminders();
    if(filter==="done"){ renderDone(); return; }
    const wrap = $("#taskListWrap");
    const s = Store.get();
    let list = s.tasks.filter(t=> !isDoneToday(t) && scheduledToday(t));
    // Urgentes primero SIEMPRE; dentro de cada grupo, el orden que hayas elegido.
    const cmp = {
      due:     (a,b)=> taskDueAt(a) - taskDueAt(b),
      name:    (a,b)=> (a.title||"").localeCompare(b.title||"","es",{sensitivity:"base"}),
      created: (a,b)=> (b.createdAt||0) - (a.createdAt||0)
    }[View.sort] || ((a,b)=> taskDueAt(a) - taskDueAt(b));
    list.sort((a,b)=>{ const ua=a.urgent?0:1, ub=b.urgent?0:1; return ua!==ub ? ua-ub : cmp(a,b); });
    // Encabezado de estado: dice de un vistazo si te queda algo o no.
    const pend = list.filter(t=>!isDoneToday(t)).length;
    const sub = $("#tasksStatus");
    if(sub) sub.textContent = pend ? (pend===1 ? "1 por hacer" : pend+" por hacer") : "Nada que hacer 🙌";

    if (!s.tasks.length){
      wrap.innerHTML = emptyState("Aún no tienes tareas","Genera una o crea la tuya con el botón +");
      // el FAB solo se muestra si la vista de tareas es la activa: render()
      // también se llama en segundo plano (sondeo/sincronización) y antes
      // hacía aparecer el botón + encima del Generador o del Perfil.
      if($("#view-tasks").classList.contains("active")) $("#fab").classList.add("show");
      return;
    }
    if (!list.length){
      wrap.innerHTML = emptyState("Nada por hacer 🙌","Has completado todo lo de hoy");
      return;
    }
    wrap.innerHTML = View.mode==="list"
      ? `<div class="tilelist">${list.map((t,i)=>rowHtml(t,i)).join("")}</div>`
      : `<div class="tilegrid">${list.map((t,i)=>cardHtml(t,i)).join("")}</div>`;
    bind(wrap);
    startRingClock();
  }
  // "Completadas": se lista por HISTORIAL (no por la lista de tareas), filtrado
  // por una fecha elegible (por defecto, hoy) — mismo formato que el calendario
  // (hora · categoría · con quién · puntos), incluida la miniatura/foto tocable.
  function renderDone(){
    const wrap = $("#taskListWrap");
    const s = Store.get();
    const items = (s.history||[]).filter(h=>h.date===doneDate).sort((a,b)=> (a.time||"")<(b.time||"")?-1:1);
    const isToday = doneDate===dateKey();
    const dateBar = `
      <div class="done-datebar">
        <input type="date" id="doneDatePick" value="${doneDate}" max="${dateKey()}"/>
        ${isToday?"":'<button class="mini-btn" id="doneDateToday">Hoy</button>'}
      </div>`;
    const listHtml = items.length
      ? `<div class="day-gallery">${items.map((h,i)=>historyItemHtml(h,i)).join("")}</div>`
      : emptyState(isToday?"Nada completado hoy todavía":"Nada completado ese día",
                    isToday?"Completa una tarea para verla aquí":"Elige otra fecha para ver esas tareas");
    wrap.innerHTML = dateBar + listHtml;
    const listEl = $(".day-gallery",wrap);
    if(listEl) bindHistoryThumbs(listEl, items);
    const dp=$("#doneDatePick",wrap); if(dp) dp.onchange=()=>{ if(dp.value){ haptic(); doneDate=dp.value; render(); } };
    const tb=$("#doneDateToday",wrap); if(tb) tb.onclick=()=>{ haptic(); doneDate=dateKey(); render(); };
  }
  function cardHtml(t,i){
    // La ficha es el ANILLO. Todo lo demás cuelga de él: el emoji va dentro,
    // el título debajo y el tiempo restante al pie.
    // Tocar el anillo = completar. El menú vive fuera, en su esquina, para que
    // tocar el anillo signifique siempre lo mismo y nada más.
    const st = ringState(t);
    return `
      <div class="tile${t.urgent?" urgent":""}${st.over?" over":""}${isDoneToday(t)?" done":""}" data-id="${t.id}" data-check="${t.id}" role="button" style="animation-delay:${Math.min(i*40,240)}ms">
        <button class="tile-menu" data-tap="${t.id}" aria-label="Opciones de la tarea">${dotsSvg()}</button>
        ${ringHtml(t,st)}
        <div class="tile-title">${esc(t.title)}</div>
        <div class="tile-due">${esc(dueLabel(st.due))}</div>
      </div>`;
  }
  function ringHtml(t,st){
    // El anillo ya no lleva su propio disparador: lo lleva la tarjeta entera.
    return `<span class="ring" data-ring="${t.id}" aria-hidden="true">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="ring-track" cx="50" cy="50" r="${RING_R}"/>
            <circle class="ring-arc" cx="50" cy="50" r="${RING_R}"
                    stroke-dasharray="${RING_C.toFixed(2)}" stroke-dashoffset="${ringOffset(st.frac)}"/>
          </svg>
          <span class="ring-ic">${taskEmoji(t)}</span>
        </span>`;
  }
  // Misma información, otra forma: en lista el anillo se reduce y el texto se
  // alinea a la izquierda, que es lo que hace que quepan más de un vistazo.
  function rowHtml(t,i){
    const st = ringState(t);
    return `
      <div class="tilerow${t.urgent?" urgent":""}${st.over?" over":""}${isDoneToday(t)?" done":""}" data-id="${t.id}" data-check="${t.id}" role="button" style="animation-delay:${Math.min(i*40,240)}ms">
        ${ringHtml(t,st)}
        <div class="rowbody">
          <div class="tile-title">${esc(t.title)}</div>
          <div class="tile-due">${esc(dueLabel(st.due))}</div>
        </div>
        <button class="tile-menu" data-tap="${t.id}" aria-label="Opciones de la tarea">${dotsSvg()}</button>
      </div>`;
  }
  /* El anillo tiene que MOVERSE, o no es un reloj. Cada 30 s se recalcula sin
     repintar la lista (repintar perdería el foco y reiniciaría animaciones):
     solo se tocan el arco, la clase de vencida y la línea del pie. */
  let ringClock = null;
  function tickRings(){
    const nodes = $$("[data-ring]");
    if(!nodes.length){ clearInterval(ringClock); ringClock=null; return; }
    const tasks = Store.get().tasks;
    nodes.forEach(el=>{
      const t = tasks.find(x=>x.id===el.getAttribute("data-ring"));
      if(!t) return;
      const st  = ringState(t);
      const arc = el.querySelector(".ring-arc");
      if(arc) arc.setAttribute("stroke-dashoffset", ringOffset(st.frac));
      const tile = el.closest(".tile, .tilerow");
      if(tile){
        tile.classList.toggle("over", st.over);
        const due = tile.querySelector(".tile-due");
        if(due) due.textContent = dueLabel(st.due);
      }
    });
  }
  function startRingClock(){
    if(ringClock) clearInterval(ringClock);
    ringClock = setInterval(tickRings, 30000);
  }
  // Al volver del segundo plano el reloj puede llevar horas parado.
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) tickRings(); });

  function bind(wrap){
    $$("[data-check]",wrap).forEach(b=> b.onclick = (e)=>{
      const id=b.getAttribute("data-check");
      const t=Store.get().tasks.find(x=>x.id===id);
      if(t) quickComplete(t);
    });
    $$("[data-tap]",wrap).forEach(b=> b.onclick = (e)=>{
      e.stopPropagation();                 // el menú NO debe abrir la cámara
      const id=b.getAttribute("data-tap");
      const t=Store.get().tasks.find(x=>x.id===id);
      if(t){ haptic(); openTaskActions(t); }
    });
  }
  function openTaskActions(task){
    const done = isDoneToday(task);
    const head = `
      <div class="grabber"></div>
      <div class="sheet-head"><span class="act cancel" id="taCancel">Cancelar</span><span class="title">Tarea</span><span class="act" style="opacity:0">•</span></div>
      <div class="sheet-body">
        <div class="ta-name">${esc(task.title)}</div>
        <div class="action-list">
          ${done?"":`<button class="action-btn" id="taDone">${checkSvg()} Completar</button>`}
          <button class="action-btn" id="taEdit">${editSvg()} Editar tarea</button>
          <button class="action-btn danger" id="taDelete">${trashSvg()} Eliminar tarea</button>
        </div>
      </div>`;
    Sheets.show(head);
    $("#taCancel").onclick = Sheets.close;
    const de=$("#taDone"); if(de) de.onclick = ()=>{ haptic(); openComplete(task); };
    $("#taEdit").onclick   = ()=>{ haptic(); openTaskForm(task); };
    $("#taDelete").onclick = ()=>{ haptic(20); confirmDelete(task); };
  }
  function confirmDelete(task){
    if(!task) return;
    const head = `
      <div class="grabber"></div>
      <div class="sheet-head"><span class="act cancel" id="cdCancel">Cancelar</span><span class="title">Eliminar</span><span class="act" style="opacity:0">•</span></div>
      <div class="sheet-body photo-modal">
        <div class="ico danger">${trashSvg()}</div>
        <h3>¿Eliminar esta tarea?</h3>
        <p>“${esc(task.title)}” se quitará de tu lista. Lo que ya completaste se conserva: tus puntos, tu racha y las fotos de tu calendario no cambian.</p>
        <button class="btn danger" id="cdConfirm">Eliminar tarea</button>
      </div>`;
    Sheets.show(head);
    $("#cdCancel").onclick = Sheets.close;
    $("#cdConfirm").onclick = ()=>{
      // RESPONDER PRIMERO: cerrar al instante; el guardado y los re-pintados van
      // después, con la animación de cierre ya en marcha.
      haptic(20);
      Sheets.close();
      setTimeout(()=>{
        // Eliminar una tarea NO toca lo ya ganado: los puntos solo se pierden con
        // la penalización de fin de día (tareas programadas sin completar). El
        // historial, las fotos y la racha se conservan tal cual.
        Store.update(s=>{
          s.tasks = s.tasks.filter(x=>x.id!==task.id);
          // si es compartida, recordar que la borraste para que el sondeo no la
          // vuelva a añadir (la fila se borra para ambos)
          if(task.shared && task.sharedId && !s.deletedShared.includes(task.sharedId)) s.deletedShared.push(task.sharedId);
        });
        if(Cloud.enabled && Cloud.enabled()) Cloud.deleteReminder(task.id); // quita su recordatorio en la nube
        render();
        if (UI.renderProfile) UI.renderProfile();
        if (task.shared && task.sharedId && Cloud.enabled()) Cloud.deleteShared(task.sharedId); // se borra para ambos
        UI.toast("Tarea eliminada", "check", "var(--red)");
      }, 60);
    };
  }
  function emptyState(title,sub){
    return `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg>
      <p>${title}</p><div class="sub">${sub}</div></div>`;
  }

  /* ---------- CREAR / EDITAR ---------- */
  function openCreate(){ openTaskForm(null); }
  function openTaskForm(existing){
    const editing = !!existing;
    // Las tareas nuevas ya no se clasifican: el emoji es su identidad. El campo
    // sigue existiendo para no borrarle la categoría a las que ya la tienen
    // (las de antes y las del generador, que sí sigue clasificando).
    let cat   = editing ? (existing.category || "") : "";
    let ppl   = editing ? (existing.people||1) : 1;
    let urgent= editing ? !!existing.urgent : false;
    let emoji = editing ? (existing.emoji || Icons.raw(existing.category)) : "";
    let days  = editing && existing.recurrence && existing.recurrence.days ? existing.recurrence.days.slice() : [];
    let monthDays = editing && existing.recurrence && existing.recurrence.dates ? existing.recurrence.dates.slice() : [];
    // "Solo ciertos días" está activo si la tarea ya tiene días marcados.
    let byDays = editing ? !!(days.length || monthDays.length) : false;
    // --- intervalo de vencimiento ---
    let mode       = editing && existing.endMode ? "enddate" : "interval";
    let dueN       = editing && existing.dueN ? existing.dueN : 1;
    let dueUnit    = editing && existing.dueUnit ? existing.dueUnit : "day";
    let repeats    = editing ? !!existing.repeats : true;
    const repeatFrom = editing && existing.repeatFrom ? existing.repeatFrom : "fixed";
    // "hasta que acabe el día": el fin lo pone la propia jornada, no tú.
    let eod = editing ? !!existing.eodMode : false;
    // Por defecto empieza AHORA (redondeado al minuto) y vence en un día.
    let startMs    = editing && existing.startAt ? existing.startAt : Date.now();
    let endMs      = editing && existing.endMode ? (existing.dueAt || startMs + 86400000) : startMs + 86400000;
    const pad2 = (n)=> String(n).padStart(2,"0");
    const dPart = (ms)=>{ const d=new Date(ms); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); };
    const tPart = (ms)=>{ const d=new Date(ms); return pad2(d.getHours())+":"+pad2(d.getMinutes()); };
    const joinDT = (dStr,tStr,fallback)=>{
      if(!dStr) return fallback;
      const [y,m,d]=dStr.split("-").map(Number);
      const [hh,mm]=(tStr||"00:00").split(":").map(Number);
      const ms = new Date(y,m-1,d,hh||0,mm||0,0,0).getTime();
      return isNaN(ms) ? fallback : ms;
    };
    let startDate = dPart(startMs), startTime = tPart(startMs);
    let endDate   = dPart(endMs),   endTime   = tPart(endMs);
    let remind = editing && existing.reminder && existing.reminder.time ? true : false;
    let remindTime = editing && existing.reminder && existing.reminder.time ? existing.reminder.time : "09:00";
    let partner = null; // amigo con quien se comparte (solo al crear)

    const body = `
      <div class="pv" id="ctPv">
        <div class="pv-ring">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="ring-track" cx="50" cy="50" r="44"/>
            <circle class="ring-arc" id="ctPvArc" cx="50" cy="50" r="44"
                    stroke-dasharray="${(2*Math.PI*44).toFixed(2)}" stroke-dashoffset="0"/>
          </svg>
          <div class="dash"></div>
          <!-- El emoji se escribe con el teclado: tocar el centro del anillo
               abre el teclado y el último carácter que pongas es el icono de la
               tarea. Una rejilla de emojis fijos siempre se queda corta. -->
          <input class="ring-emj" id="ctEmoji" value="${esc(emoji)}"
                 placeholder="+" maxlength="8" aria-label="Emoji de la tarea" autocomplete="off"/>
        </div>
        <input class="pv-title" id="ctTitle" placeholder="Nueva tarea" maxlength="120"
               value="${editing?esc(existing.title):""}"/>
        <div class="pv-due" id="ctPvDue"></div>
        <div class="pv-need" id="ctNeedEmj">Toca el <b>+</b> y escribe un emoji para la tarea.</div>
      </div>

      <div class="segmented" id="ctMode">
        <div class="seg${mode==="interval"?" sel":""}" data-m="interval">Intervalo</div>
        <div class="seg${mode==="enddate"?" sel":""}" data-m="enddate">Fecha de finalización</div>
      </div>

      <div class="frow">
        <span class="fl">Empieza</span>
        <span class="fval">
          <input type="date" class="chipv" id="ctStartDate" value="${esc(startDate)}"/>
          <input type="time" class="chipv" id="ctStartTime" value="${esc(startTime)}"/>
        </span>
      </div>
      <div class="frow" id="ctIntervalRow" style="display:${(mode==="interval"&&!byDays)?"flex":"none"}">
        <span class="fl">Vence después de</span>
        <span class="fval">
          <span class="fsel"><select class="chipv" id="ctDueN" aria-label="Cantidad">
            ${Array.from({length:60},(_,i)=>i+1).map(n=>`<option value="${n}"${n===dueN?" selected":""}>${n}</option>`).join("")}
          </select><span class="dd-chev">▾</span></span>
          <span class="fsel"><select class="chipv" id="ctDueUnit" aria-label="Unidad">
            ${UNITS.map(u=>`<option value="${u[0]}"${u[0]===dueUnit?" selected":""}>${esc(unitLabel(u[0],dueN))}</option>`).join("")}
          </select><span class="dd-chev">▾</span></span>
        </span>
      </div>
      <!-- Lo más habitual dentro de "fecha de finalización" es "hoy hasta que
           se acabe el día". Con el interruptor no hay que elegir fecha ni hora:
           el anillo dura desde que la creas hasta las 23:59 de ese mismo día,
           y la fila de "Termina" desaparece porque ya no decide nada. -->
      <div class="frow" id="ctEodRow" style="display:${mode==="enddate"?"flex":"none"}">
        <span class="fl">Hasta que acabe el día</span>
        <div class="switch${eod?" on":""}" id="ctEod"><div class="knob"></div></div>
      </div>
      <div class="frow" id="ctEndRow" style="display:${(mode==="enddate"&&!eod)?"flex":"none"}">
        <span class="fl">Termina</span>
        <span class="fval">
          <input type="date" class="chipv" id="ctEndDate" value="${esc(endDate)}"/>
          <input type="time" class="chipv" id="ctEndTime" value="${esc(endTime)}"/>
        </span>
      </div>
      <div class="frow" id="ctRepeatRow" style="display:${mode==="interval"?"flex":"none"}">
        <span class="fl">Se repite</span>
        <div class="switch${repeats?" on":""}" id="ctRepeats"><div class="knob"></div></div>
      </div>
      <!-- Días marcados: un ritmo ALTERNATIVO al intervalo. Con ellos activos
           la tarea nace a las 00:00 del día marcado y vence a las 23:59 del
           mismo día, así que el intervalo deja de tener sentido y se oculta. -->
      <div class="frow" id="ctByDaysRow" style="display:${(mode==="interval"&&repeats)?"flex":"none"}">
        <span class="fl">Solo ciertos días</span>
        <div class="switch${byDays?" on":""}" id="ctByDays"><div class="knob"></div></div>
      </div>
      <div id="ctDaysPick" style="display:${(mode==="interval"&&repeats&&byDays)?"block":"none"};padding:2px 2px 14px;">
        <div class="daypicker" id="ctDays"></div>
        <div class="hint">Aparecerá esos días a las 00:00 y vencerá a las 23:59 del mismo día.</div>
      </div>
      <div class="frow">
        <span class="fl">Urgente</span>
        <div class="switch${urgent?" on":""}" id="ctUrgent"><div class="knob"></div></div>
      </div>
      <div class="frow">
        <span class="fl">Recordatorio</span>
        <div class="switch${remind?" on":""}" id="ctRemind"><div class="knob"></div></div>
      </div>
      <div id="ctRemindWrap" style="display:${remind?"block":"none"};padding:0 2px 12px;">
        <input type="time" class="chipv" id="ctRemindTime" value="${esc(remindTime)}"/>
        <div class="hint">Recibirás una notificación a esa hora los días en que toque la tarea.</div>
      </div>

      ${(!editing && Cloud.configured())?`<div id="ctShareWrap"><div class="lbl-sm">Compartir con un amigo</div><div class="chips" id="ctShare"></div><div class="hint" id="ctShareHint" style="display:none">Si tú o tu amigo la completáis o la borráis, se hace para los dos.</div></div>`:""}
      <button class="btn" id="ctSave" style="margin-top:24px;">Guardar</button>
      ${editing?`<button class="btn danger ghost" id="ctDelete" style="margin-top:12px;">${trashSvg()} Eliminar tarea</button>`:""}
    `;
    const head = `
      <div class="grabber"></div>
      <div class="sheet-head"><span class="act cancel" id="ctCancel">Cancelar</span><span class="title">${editing?"Editar tarea":"Nueva tarea"}</span><span class="act" style="opacity:0">•</span></div>
      <div class="sheet-body">${body}</div>`;
    const sheet = Sheets.show(head);

    const RC = 2*Math.PI*44;

    // La vista previa se repinta con CADA cambio: es la única forma de que el
    // intervalo se entienda sin leer una explicación.
    /* La vista previa NO recalcula por su cuenta: arma la tarea tal y como se
       guardaría y pregunta a las mismas funciones que usa la lista. Cuando
       tenía su propia fórmula, decía "vence en 23 h 59 min" mientras la tarea
       ya guardada decía otra cosa. */
    function previewFields(){
      const useDays = (mode!=="enddate" && repeats && byDays);
      return {
        repeats: mode==="enddate" ? false : repeats,
        dueN, dueUnit, repeatFrom,
        recurrence: { type: useDays ? (days.length?"weekly":"monthly") : (repeats?"daily":"once"),
                      days: useDays ? days.slice() : [],
                      dates: useDays ? monthDays.slice() : [] }
      };
    }
    // 23:59:59.999 del día en que empieza la tarea.
    function endOfStartDay(){ return endOfDayMs(dateKey(new Date(startMs))); }
    function dueNow(){
      if(mode==="enddate") return eod ? endOfStartDay() : endMs;
      return computeDueFrom(previewFields(), startMs, false);
    }
    function periodNow(){
      if(mode==="enddate") return Math.max(60000, dueNow() - startMs);
      const f=previewFields(), due=dueNow();
      return Math.max(60000, due - computeStartFor(f, due));
    }
    function paintPreview(){
      // El campo no se rellena solo: vacío enseña el "+", y vacío es
      // exactamente lo que impide guardar. Un emoji puesto por la app no sería
      // una elección, sería un relleno con el que todas acabarían iguales.
      const need=$("#ctNeedEmj",sheet);
      if(need) need.style.display = emoji.trim() ? "none" : "block";
      const pv=$("#ctPv",sheet), arc=$("#ctPvArc",sheet);
      const due=dueNow(), period=periodNow(), now=Date.now();
      const start=due-period;
      const over = now>due;
      const frac = over ? Math.max(0.05,Math.min(1,(now-due)/period))
                        : (now<=start ? 1 : Math.max(0,Math.min(1,(due-now)/period)));
      if(arc) arc.setAttribute("stroke-dashoffset", (RC*(1-frac)).toFixed(2));
      if(pv) pv.classList.toggle("over", over);
      const d=$("#ctPvDue",sheet);
      if(d) d.textContent = (over?"vencida hace ":"vence en ")
                          + (()=>{ const ms=Math.abs(due-now), dd=Math.floor(ms/86400000),
                                   hh=Math.floor((ms%86400000)/3600000), mm=Math.floor((ms%3600000)/60000);
                                   if(dd>0) return hh>0?dd+"d "+hh+" h":dd+"d";
                                   if(hh>0) return mm>0?hh+" h "+mm+" min":hh+" h";
                                   return Math.max(1,mm)+" min"; })();
    }

    const emjInput=$("#ctEmoji",sheet);
    if(emjInput){
      const lastGlyph = (str)=>{ const arr=Array.from(str||""); return arr.length?arr[arr.length-1]:""; };
      emjInput.addEventListener("input", ()=>{
        // Un emoji con modificador (tono de piel, variantes) ocupa varios
        // caracteres: si el texto es corto se respeta entero; si no, se queda
        // el último, que es el que acabas de escribir.
        const v = emjInput.value;
        emoji = Array.from(v).length<=3 ? v : lastGlyph(v);
        emjInput.value = emoji;
        validate(); paintPreview();
      });
      emjInput.addEventListener("focus", ()=> emjInput.select());
      emjInput.addEventListener("blur", ()=>{
        // Dejarlo vacío es una respuesta válida del campo, pero no de la tarea:
        // se queda el "+" a la vista y "Guardar" sigue apagado.
        if(!emjInput.value.trim()){ emoji=""; emjInput.value=""; }
        validate(); paintPreview();
      });
    }

    // ---- modo: intervalo / fecha de finalización ----
    const modeWrap=$("#ctMode",sheet);
    function syncRows(){
      $("#ctIntervalRow",sheet).style.display   = mode==="interval"?"flex":"none";
      $("#ctEndRow",sheet).style.display        = mode==="enddate"?"flex":"none";
      $("#ctRepeatRow",sheet).style.display     = mode==="interval"?"flex":"none";
      const on = (mode==="interval"&&repeats);
      $("#ctIntervalRow",sheet).style.display   = (mode==="interval"&&!byDays)?"flex":"none";
      $("#ctByDaysRow",sheet).style.display     = on?"flex":"none";
      $("#ctDaysPick",sheet).style.display      = (on&&byDays)?"block":"none";
      $("#ctEodRow",sheet).style.display        = (mode==="enddate")?"flex":"none";
      $("#ctEndRow",sheet).style.display        = (mode==="enddate"&&!eod)?"flex":"none";
    }
    $$(".seg",modeWrap).forEach(el=> el.onclick=()=>{
      mode=el.getAttribute("data-m"); haptic();
      $$(".seg",modeWrap).forEach(x=>x.classList.toggle("sel",x===el));
      syncRows(); paintPreview(); validate();
    });

    const sD=$("#ctStartDate",sheet), sT=$("#ctStartTime",sheet);
    const eD=$("#ctEndDate",sheet),   eT=$("#ctEndTime",sheet);
    const readStart=()=>{ startMs = joinDT(sD.value, sT.value, startMs); };
    const readEnd  =()=>{ endMs   = joinDT(eD.value, eT.value, endMs); };
    [sD,sT].forEach(i=> i.onchange=()=>{ readStart(); paintPreview(); validate(); });
    [eD,eT].forEach(i=> i.onchange=()=>{ readEnd();   paintPreview(); validate(); });

    const nSel=$("#ctDueN",sheet), uSel=$("#ctDueUnit",sheet);
    const repaintUnits=()=>{ // "1 Día" / "3 Días": el plural depende del número
      Array.from(uSel.options).forEach(o=> o.textContent = unitLabel(o.value, dueN));
      fitSelectWidth(uSel);
    };
    nSel.onchange=()=>{ dueN=+nSel.value; haptic(); fitSelectWidth(nSel); repaintUnits(); paintPreview(); };
    uSel.onchange=()=>{ dueUnit=uSel.value; haptic(); fitSelectWidth(uSel); syncRows(); paintPreview(); validate(); };
    [nSel,uSel].forEach(fitSelectWidth); repaintUnits();

    const swRep=$("#ctRepeats",sheet);
    swRep.onclick=()=>{ repeats=!repeats; swRep.classList.toggle("on",repeats); haptic(); syncRows(); validate(); };
    const swEod=$("#ctEod",sheet);
    if(swEod) swEod.onclick=()=>{ eod=!eod; swEod.classList.toggle("on",eod); haptic();
      syncRows(); paintPreview(); validate(); };
    syncRows();
    const renderDays = ()=>{ const w=$("#ctDays",sheet); if(!w) return; w.innerHTML="";
      DAYS.forEach((d,i)=>{ const cell=el("div","day"+(days.includes(i)?" sel":""),d);
        cell.onclick=()=>{ haptic(); if(days.includes(i)) days=days.filter(x=>x!==i); else days.push(i); renderDays(); validate(); };
        w.appendChild(cell); }); };
    const renderMonthDays = ()=>{ const w=$("#ctMonthDays",sheet); if(!w) return; w.innerHTML="";
      for(let i=1;i<=31;i++){ const cell=el("div","day"+(monthDays.includes(i)?" sel":""),String(i));
        cell.onclick=()=>{ haptic(); if(monthDays.includes(i)) monthDays=monthDays.filter(x=>x!==i); else monthDays.push(i); renderMonthDays(); validate(); };
        w.appendChild(cell); } };
    const renderShare = ()=>{ const w=$("#ctShare",sheet); if(!w) return; w.innerHTML="";
      const friends=Store.get().friends.filter(f=>f.cloudId);
      if(!friends.length){ w.innerHTML=`<span class="hint" style="margin:0">Añade amigos (Perfil → icono de amigos) para compartir tareas.</span>`; return; }
      friends.forEach(f=>{ const chip=el("button","chip"+(partner&&partner.cloudId===f.cloudId?" sel":""));
        chip.style.setProperty("--accent","#5E5CE6");
        chip.innerHTML=`<span class="friend-av" style="width:22px;height:22px;font-size:11px">${f.avatar?`<img src="${esc(f.avatar)}">`:esc((f.name||"A").charAt(0).toUpperCase())}</span>${esc(f.name)}`;
        chip.onclick=()=>{ partner = (partner&&partner.cloudId===f.cloudId)?null:{cloudId:f.cloudId,name:f.name}; haptic(); renderShare(); const h=$("#ctShareHint",sheet); if(h) h.style.display=partner?"block":"none"; };
        w.appendChild(chip); }); };
    renderDays(); renderMonthDays(); renderShare();

    const sw = $("#ctUrgent",sheet);
    sw.onclick = ()=>{ urgent=!urgent; sw.classList.toggle("on",urgent); haptic(); };
    const swR = $("#ctRemind",sheet), rWrap=$("#ctRemindWrap",sheet), rTime=$("#ctRemindTime",sheet);
    swR.onclick = ()=>{ remind=!remind; swR.classList.toggle("on",remind); haptic();
      rWrap.style.display = remind?"block":"none"; };
    rTime.onchange = ()=>{ remindTime = rTime.value || "09:00"; };
    const swByDays = $("#ctByDays",sheet);
    if(swByDays) swByDays.onclick = ()=>{
      byDays=!byDays; swByDays.classList.toggle("on",byDays); haptic();
      // Activar sin elegir nada no sirve de nada: se marca el día de hoy.
      if(byDays && !days.length && !monthDays.length){ days=[weekdayOf(dateKey())]; renderDays(); }
      syncRows(); paintPreview(); validate();
    };

    const titleInput = $("#ctTitle",sheet);
    const saveBtn = $("#ctSave",sheet);
    // La fecha de finalización tiene que ir DESPUÉS del inicio; si no, el
    // intervalo sería negativo y el anillo no significaría nada.
    function validate(){
      saveBtn.disabled = !titleInput.value.trim()
                      || !emoji.trim()
                      || (mode==="enddate" && !eod && endMs<=startMs);
    }
    titleInput.addEventListener("input", ()=>{ validate(); paintPreview(); });
    validate(); paintPreview();

    $("#ctCancel",sheet).onclick = Sheets.close;
    saveBtn.onclick = ()=>{
      const title = titleInput.value.trim();
      if(!title || !emoji.trim()) return;   // el botón ya está apagado; esto es el cinturón
      const desc = editing ? (existing.desc||"") : "";
      // RESPONDER PRIMERO: cerrar el menú al instante; el guardado (localStorage),
      // el re-pintado y la nube van después, con la animación ya en marcha.
      haptic(15);
      Sheets.close();
      saveBtn.disabled = true;
      // El campo `recurrence` sigue existiendo porque de él dependen los
      // recordatorios (qué días toca), el calendario y las tareas compartidas.
      // Ahora se DEDUCE del intervalo en vez de elegirse a mano.
      const endMode = (mode==="enddate");
      const eodMode = endMode && eod;
      const endTarget = eodMode ? endOfDayMs(dateKey(new Date(startMs))) : endMs;
      const periodMs = endMode ? Math.max(60000, endTarget - startMs)
                               : Math.max(60000, dueN * (UNIT_MS[dueUnit]||UNIT_MS.day));
      const willRepeat = endMode ? false : repeats;
      // Los días marcados solo cuentan si el interruptor está activo y la
      // tarea se repite: si no, se guardan vacíos para que nada quede a medias.
      const useDays  = (!endMode && willRepeat && byDays);
      const outDays  = useDays ? days.slice() : [];
      const outDates = useDays ? monthDays.slice() : [];
      const recType = !willRepeat ? "once"
                    : outDays.length  ? "weekly"
                    : outDates.length ? "monthly"
                    : "daily";
      const rec = {type:recType, days:outDays, dates:outDates};
      const dueFields = {
        emoji: emoji.trim(),
        startAt:startMs, repeats:willRepeat, repeatFrom, endMode, eodMode, dueVer:3,
        dueN: endMode ? Math.max(1,Math.round(periodMs/60000)) : dueN,
        dueUnit: endMode ? "minute" : dueUnit,
        recurrence: rec
      };
      // Con días marcados manda el próximo día marcado (00:00 → 23:59), no la
      // suma del intervalo; y el arranque se ajusta a esa misma ventana.
      dueFields.dueAt   = endMode ? endTarget : computeDueFrom(dueFields, startMs, false);
      dueFields.startAt = endMode ? startMs : computeStartFor(dueFields, dueFields.dueAt);
      const reminder = remind ? { time: (remindTime||"09:00") } : null;
      const newId = uid();
      setTimeout(()=>{
      // Con compañero: es solo una INVITACIÓN (como una solicitud de amistad). No
      // se añade a tu lista todavía; se añadirá a ambas listas cuando la acepte.
      if(editing || !partner){
        Store.update(s=>{
          if(editing){
            const t = s.tasks.find(x=>x.id===existing.id);
            if(t){ t.title=title; t.desc=desc; t.category=cat; t.people=ppl; t.urgent=urgent;
                   t.recurrence=rec; t.onlyOnDays=useDays; t.reminder=reminder;
                   Object.assign(t, dueFields);
                   // vencimiento nuevo = castigo nuevo: se olvida el ya cobrado
                   if(t.penalizedFor !== t.dueAt){ delete t.penalizedFor; delete t.penalizedPts; }
                   delete t.doneUntil; }
          } else {
            s.tasks.unshift(Object.assign({ id:newId, title, desc, category:cat, minutes:0, people:ppl, urgent,
              recurrence:rec, onlyOnDays:useDays, reminder, random:false, createdAt:Date.now(), done:false, lastDone:null },
              dueFields));
          }
        });
      }
      if(typeof scheduleReminders==="function") scheduleReminders();
      // recordatorio en la nube (push programado con la app cerrada)
      if((editing||!partner) && Cloud.enabled && Cloud.enabled()){
        const savedTask = editing ? Store.get().tasks.find(x=>x.id===existing.id) : Store.get().tasks.find(x=>x.id===newId);
        if(savedTask) Cloud.syncReminder(savedTask);
      }
      // compartir en la nube
      if(!editing && partner){
        const meName=Store.get().profile.name||"Atleta";
        Cloud.createShared({ id:newId, owner_id:Cloud.myId(), owner_name:meName, partner_id:partner.cloudId, partner_name:partner.name,
          title, descr:desc, category:cat, minutes:0, people:ppl, urgent, recurrence:rec, only_on_days:useDays });
      }
      render();
      UI.toast(editing?"Cambios guardados":(partner?`Invitación enviada a ${esc(partner.name)}`:"Tarea creada"),"check","var(--green)");
      }, 60);
    };
    if(editing){ const delBtn=$("#ctDelete",sheet); if(delBtn) delBtn.onclick=()=>{ haptic(); confirmDelete(existing); }; }
    // preventScroll: enfocar un campo dentro de la hoja hacía que el navegador
    // arrastrase el contenedor scrollable de detrás (la vista) hasta el final.
    if(!editing) setTimeout(()=>{ try{ titleInput.focus({preventScroll:true}); }
                                  catch(_){ titleInput.focus(); } },350);
  }

  /* ---------- COMPLETAR + FOTO ---------- */
  function openComplete(task){
    let photoData = null;
    // Fuera de plazo la tarea sigue pudiendo hacerse —y hay que hacerla— pero
    // ya no suma: mientras estuvo vencida el anillo rojo fue cobrando. Hacerla
    // ahora no devuelve lo perdido; lo que hace es parar la sangría.
    const late = ringState(task).over;
    const pts  = pointsForNow(task);
    const risk = taskMaxPoints(task);
    const head = `
      <div class="grabber"></div>
      <div class="sheet-head"><span class="act cancel" id="pcCancel">Cancelar</span><span class="title">Completar</span><span class="act" style="opacity:0">•</span></div>
      <div class="sheet-body photo-modal">
        <div class="ico">${checkSvg()}</div>
        <h3>${esc(task.title)}</h3>
        <p>${late
          ? `Esta tarea está <b style="color:var(--red)">vencida</b>: ya no suma. Si el anillo rojo se llena te costará <b style="color:var(--red)">${risk} pts</b>; hacerla ahora lo evita.`
          : `Sube una foto como evidencia para completar la tarea y ganar <b style="color:var(--yellow)">${pts} pts</b>.`}</p>
        <div class="photo-preview" id="pcPreview"><img id="pcImg" alt="evidencia"/><div class="retake" id="pcRetake">Cambiar foto</div></div>
        <div class="photo-btns">
          <button class="btn secondary" id="pcCam">${camSvg()} Cámara</button>
          <button class="btn secondary" id="pcLib">${imgSvg()} Galería</button>
        </div>
        <button class="btn" id="pcConfirm" disabled>Marcar como completada</button>
      </div>`;
    Sheets.show(head);
    const preview=$("#pcPreview"), img=$("#pcImg"), confirm=$("#pcConfirm");
    const fileCam=$("#fileCam"), fileLib=$("#fileLib");

    function handleFile(file){
      if(!file) return;
      compressImage(file, (dataUrl)=>{
        photoData = dataUrl; img.src=dataUrl; preview.classList.add("show"); confirm.disabled=false; haptic();
      });
    }
    fileCam.onchange = e=>{ handleFile(e.target.files[0]); e.target.value=""; };
    fileLib.onchange = e=>{ handleFile(e.target.files[0]); e.target.value=""; };
    $("#pcCam").onclick = ()=> fileCam.click();
    $("#pcLib").onclick = ()=> fileLib.click();
    $("#pcRetake").onclick = ()=> fileLib.click();
    $("#pcCancel").onclick = Sheets.close;

    confirm.onclick = ()=>{
      haptic(15);
      Sheets.close();
      confirm.disabled = true; // evita doble clic mientras cierra
      commitCompletion(task, photoData, pts);
    };
  }

  /* Completar de un toque: tocar la tarjeta abre la cámara y, en cuanto hay
     foto, la tarea queda hecha. El menú intermedio sobraba —siempre acababas
     pulsando "Cámara"— y con él sobraban dos toques por tarea. */
  function quickComplete(task){
    if(isDoneToday(task)){ UI.toast("Ya completada","check","var(--green)"); return; }
    const fileCam=$("#fileCam");
    fileCam.onchange = (e)=>{
      const f = e.target.files && e.target.files[0];
      e.target.value = "";
      if(!f) return;                       // cancelaste la cámara: no pasa nada
      compressImage(f,(dataUrl)=>{
        const pts = pointsForNow(task);
        commitCompletion(task, dataUrl, pts);
      });
    };
    haptic(12);
    fileCam.click();
  }

  /* RESPONDER PRIMERO, trabajar después: el trabajo pesado (IndexedDB,
     localStorage, re-pintados, red) se hace con la animación ya en marcha.
     Antes el clic esperaba a guardar la foto (varios MB) antes de cerrar. */
  function commitCompletion(task, photoData, pts){
      const photoId = uid();
      const now = new Date();
      const entry = {
        id:uid(), taskId:task.id, title:task.title, category:task.category,
        minutes:task.minutes, points:pts, random:task.random,
        date:dateKey(now), time:timeLabel(now), photoId: photoData?photoId:null,
        shared: !!task.shared, partnerName: task.shared?(task.partnerName||""):undefined,
        partnerId: task.shared?(task.partnerId||null):undefined,
        sharedId: task.shared?(task.sharedId||null):undefined
      };
      setTimeout(()=>{
        if (photoData) DB.put(photoId, photoData); // sin await: IndexedDB en segundo plano
        // marcar la tarea
        Store.update(s=>{
          const t=s.tasks.find(x=>x.id===task.id);
          if(!t) return;
          const at = now.getTime();
          t.lastDone   = dateKey(now);
          t.lastDoneAt = at;
          if(t.repeats){
            // Se abre el siguiente ciclo y la tarea se oculta hasta que ese
            // ciclo ARRANQUE (con intervalo fijo, al acabar el actual; con
            // "última finalización", ahora mismo).
            const next = nextDueAfter(t, at);
            t.dueAt     = next;
            t.startAt   = computeStartFor(t, next);
            t.doneUntil = t.startAt;
          } else {
            t.done = true;
          }
        });
        Gamify.awardCompletion(entry);
        render(); UI.renderProfile();
        // sincronizar con la nube (si está activada). El aviso a mis amigos (con
        // push) lo crea el trigger del servidor al insertarse la completada; y
        // justNow=true manda además un push de respaldo directo (mismo tag → si
        // llegan los dos caminos se funden en uno; si uno falla, llega el otro).
        if (Cloud.enabled()){
          Cloud.pushCompletion(entry, photoData, true); Cloud.pushProfile();
          // Ciclo nuevo = fecha de aviso nueva (ver syncReminder).
          const upd = Store.get().tasks.find(x=>x.id===task.id);
          if(upd && upd.reminder && upd.reminder.time) Cloud.syncReminder(upd);
        }
        // tarea compartida: subir la foto y marcar la fila como hecha (para ambos)
        if (task.shared && task.sharedId && Cloud.enabled() && photoData){
          (async ()=>{
            let url=null;
            try{ url = await uploadSharedPhoto(task.sharedId, photoData); }catch(e){}
            try{ await Cloud.completeShared(task.sharedId, { status:'done', completed_by:Cloud.myId(), photo_url:url, points:pts, done_date:entry.date, done_time:entry.time }); }catch(e){}
          })();
        }
      }, 60); // deja arrancar la animación de cierre antes del trabajo pesado
  }
  // sube la foto de una tarea compartida al Storage y devuelve su URL pública
  async function uploadSharedPhoto(sharedId, dataUrl){
    try{ return await Cloud.uploadShared(sharedId, dataUrl); }catch(e){ return null; }
  }

  function setFilter(f){
    if(f==="done" && filter!=="done") doneDate=dateKey(); // al entrar a "Completadas", parte de hoy
    filter=f; render();
  }
  function init(){
    $("#fab").onclick = openCreate;
    $$("#taskFilter .seg").forEach(seg=> seg.onclick=()=>{
      $$("#taskFilter .seg").forEach(x=>x.classList.remove("sel")); seg.classList.add("sel");
      haptic(); setFilter(seg.getAttribute("data-f"));
    });
  }
  return { init, render, openCreate, syncShared, scheduleReminders };
})();

/* Comprime/redimensiona la foto para no agotar el almacenamiento */
function compressImage(file, cb){
  const reader = new FileReader();
  reader.onload = () => {
    const im = new Image();
    im.onload = () => {
      const max=1280; let {width:w,height:h}=im;
      if(w>h && w>max){ h=h*max/w; w=max; } else if(h>max){ w=w*max/h; h=max; }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(im,0,0,w,h);
      try{ cb(c.toDataURL("image/jpeg",0.82)); }catch(e){ cb(reader.result); }
    };
    im.onerror = ()=> cb(reader.result);
    im.src = reader.result;
  };
  reader.readAsDataURL(file);
}
// Reescala un dataURL a una miniatura (para compartir perfil con amigos)
function downscaleDataUrl(dataUrl, max, q){
  return new Promise(res=>{
    if(!dataUrl) return res(null);
    const im=new Image();
    im.onload=()=>{ let {width:w,height:h}=im;
      if(w>h && w>max){ h=h*max/w; w=max; } else if(h>max){ w=w*max/h; h=max; }
      const c=document.createElement("canvas"); c.width=Math.round(w); c.height=Math.round(h);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      try{ res(c.toDataURL("image/jpeg",q)); }catch(e){ res(dataUrl); } };
    im.onerror=()=>res(dataUrl); im.src=dataUrl;
  });
}

/* =====================================================================
   PROFILE — dashboard, rango, racha, calendario, galería, lightbox
   ===================================================================== */
const Profile = (() => {
  let calDate = new Date();

  function render(){
    const s = Store.get();
    const {rank,next,index:idx} = rankFor(s.points);

    // cabecera
    $("#avatarInitial").textContent = (s.profile.name||"A").trim().charAt(0).toUpperCase() || "A";
    const av = $("#avatar"); const existing = av.querySelector("img");
    if (s.profile.avatar){
      if(existing) existing.src=s.profile.avatar;
      else { const im=new Image(); im.src=s.profile.avatar; av.insertBefore(im,av.firstChild); }
      $("#avatarInitial").style.display="none";
    } else { if(existing) existing.remove(); $("#avatarInitial").style.display="block"; }

    $("#profileName").innerHTML = `${esc(s.profile.name||"Atleta")} <svg class="pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18l-1 3 3-1L19 8l-2-2zM15 5l2 2"/></svg>`;
    const rb=$("#rankBadge");
    rb.innerHTML = `${gemSvg(idx)} ${rank.name}`;
    rb.style.color = gemFor(idx).hi;   // el rótulo toma el color del mineral

    // tarjeta de rango
    $("#rankNow").textContent = rank.name;
    if (next){
      const span = next.min - rank.min;
      const prog = Math.max(0,Math.min(1,(s.points - rank.min)/span));
      $("#rankBar").style.width = (prog*100)+"%";
      $("#rankBar").style.background = gemFor(idx).color;
      $("#rankNext").textContent = "Siguiente: "+next.name;
      $("#rankPts").textContent = s.points+" pts";
      $("#rankRemain").textContent = (next.min - s.points)+" pts para subir";
    } else {
      $("#rankBar").style.width="100%";
      $("#rankBar").style.background = gemFor(idx).color;
      $("#rankNext").textContent = "Rango máximo";
      $("#rankPts").textContent = s.points+" pts";
      $("#rankRemain").textContent = "¡Eres una leyenda!";
    }

    // racha y puntos: ahora viven junto al nombre
    const total=s.history.length;
    const rnd=s.history.filter(h=>h.random).length;
    // data-count deja el valor final donde animateCounters pueda encontrarlo;
    // el texto se pone igualmente para que al repintar (sondeo de la nube) la
    // cifra sea correcta aunque no haya animación.
    const setNum=(sel,val)=>{ const e=$(sel); if(!e) return;
      e.setAttribute("data-count", val); e.textContent = val; };
    const st=$("#phStreak"); if(st){ st.removeAttribute("data-count"); st.textContent = s.streak.current; }
    setNum("#phPoints", s.points);
    setNum("#stTotal",  total);
    setNum("#stRandom", rnd);
    setNum("#stNormal", total-rnd);

    // resumen de la semana (lunes-domingo, última ya terminada): un botón que
    // solo aparece durante las 48 h de disponibilidad; se abre en su propia hoja.
    const ws = weeklySummaryFor(s.history);
    const wrap = $("#weekCardWrap");
    wrap.innerHTML = ws.available ? `<button class="btn secondary week-btn" id="weekSummaryBtn">Ver resumen semanal</button>` : "";
    if(ws.available){ $("#weekSummaryBtn").onclick=()=>{ haptic(); openWeekSummarySheet(ws, {mine:true}); }; }

    renderCalendar();
  }

  // Al abrir el perfil las cifras suben desde cero: es un resumen de lo que
  // llevas hecho, y verlo contar le da el peso que tiene.
  function animate(){ animateCounters($("#view-profile"), 700); }

  function renderCalendar(dir){
    const s = Store.get();
    const grid = $("#calGrid");
    const y=calDate.getFullYear(), m=calDate.getMonth();
    const months=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    $("#calMonth").textContent = months[m].charAt(0).toUpperCase()+months[m].slice(1)+" "+y;

    // conteo por día del mes
    const counts={};
    s.history.forEach(h=>{ if(h.date && h.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)) counts[h.date]=(counts[h.date]||0)+1; });

    const dows=["Lu","Ma","Mi","Ju","Vi","Sá","Do"];
    $("#calDow").innerHTML = dows.map(d=>`<div class="cal-dow">${d}</div>`).join("");

    const first=new Date(y,m,1);
    const lead=(first.getDay()+6)%7; // lunes=0
    const days=new Date(y,m+1,0).getDate();
    const todayK=dateKey();

    // un único grid: el día 1 arranca en su columna (lead) y el resto fluye solo;
    // sin celdas de relleno, así todas las filas quedan a la misma altura
    const cells=[];
    for(let d=1;d<=days;d++){
      const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const c=counts[key]||0;
      const cls=["cal-day"]; if(key===todayK)cls.push("today"); if(c)cls.push("has");
      const style = d===1 && lead>0 ? ` style="grid-column-start:${lead+1}"` : "";
      cells.push(`<div class="${cls.join(' ')}"${style} ${c?`data-day="${key}"`:""}>${d}</div>`);
    }
    grid.innerHTML=cells.join("");

    // animación suave al cambiar de mes
    const anim = dir>0 ? "calNext" : dir<0 ? "calPrev" : "calFade";
    grid.style.animation="none"; void grid.offsetWidth;
    grid.style.animation = `${anim} .32s var(--ease-out)`;

    $$("[data-day]",grid).forEach(cell=> cell.onclick=()=> openDay(cell.getAttribute("data-day")) );
  }

  function openDay(key){
    haptic();
    const s=Store.get();
    const items=s.history.filter(h=>h.date===key).sort((a,b)=>a.time<b.time?-1:1);
    const [y,mo,d]=key.split("-");
    const months=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    const title=`${parseInt(d)} de ${months[parseInt(mo)-1]}`;
    const head=`
      <div class="grabber"></div>
      <div class="sheet-head"><span class="act cancel" style="opacity:0">•</span><span class="title">${title}</span><span class="act" id="dgClose">Listo</span></div>
      <div class="sheet-body"><div class="day-gallery" id="dgList"></div></div>`;
    Sheets.show(head);
    $("#dgClose").onclick=Sheets.close;
    const listEl=$("#dgList");
    listEl.innerHTML = items.length ? items.map(h=>historyItemHtml(h)).join("") : `<div class="card friends-empty">Sin tareas registradas este día.</div>`;
    bindHistoryThumbs(listEl, items);
  }

  function changeMonth(delta){ calDate.setMonth(calDate.getMonth()+delta); haptic(); renderCalendar(delta); }

  function editName(){
    const s=Store.get();
    const cur=s.profile.name||"";
    const head=`
      <div class="grabber"></div>
      <div class="sheet-head"><span class="act cancel" id="pnCancel">Cancelar</span><span class="title">Tu nombre</span><span class="act" id="pnSave">Guardar</span></div>
      <div class="sheet-body"><div class="form-group" style="margin-top:6px;"><div class="field-block"><input class="field" id="pnInput" maxlength="24" value="${esc(cur)}" placeholder="Tu nombre"/></div></div></div>`;
    Sheets.show(head);
    const input=$("#pnInput");
    $("#pnCancel").onclick=Sheets.close;
    $("#pnSave").onclick=()=>{ const v=input.value.trim()||"Atleta"; Store.update(s=>{s.profile.name=v;}); Sheets.close(); render(); if(Cloud.enabled()) Cloud.pushProfile(); };
    setTimeout(()=>input.focus(),350);
  }

  function init(){
    $("#calPrev").onclick=()=>changeMonth(-1);
    $("#calNext").onclick=()=>changeMonth(1);
    const gb=$("#settingsBtn"); if(gb) gb.onclick=()=>{ haptic(); openSettingsSheet(); };
    $("#profileName").onclick=editName;
    $("#avatar").onclick=()=> $("#fileAvatar").click();
    $("#fileAvatar").onchange=e=>{ const f=e.target.files[0]; if(!f)return;
      compressImage(f,(data)=>{ Store.update(s=>{s.profile.avatar=data;}); render(); if(Cloud.enabled()) Cloud.pushProfile(); }); e.target.value=""; };
  }
  return { init, render, renderCalendar, animate };
})();
