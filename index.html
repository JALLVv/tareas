  // Envía una notificación de PRUEBA a tus propios dispositivos. Sirve para
  // diagnosticar el push: si llega, toda la cadena (Edge Function + claves +
  // suscripción) funciona. Devuelve {ok, error, sent}.
  async function testPush(){
    try{
      if(!enabled() || !await init() || !client) return { ok:false, error:"sin conexión" };
      const reg = ("serviceWorker" in navigator) ? await navigator.serviceWorker.ready : null;
      const sub = reg ? await reg.pushManager.getSubscription() : null;
      if(!sub) return { ok:false, error:"no estás suscrito (pulsa Activar)" };
      const { data, error } = await client.functions.invoke('send-push',
        { body:{ recipientId:uid, title:"Tareas", body:"Notificación de prueba ✅" } });
      if(error){
        // intentar leer el motivo real que devolvió la función (cuerpo JSON)
        let detail="";
        try{ if(error.context && error.context.json) { const b=await error.context.json(); detail=(b&&b.error)||""; } }catch(_){}
        if(!detail){ try{ if(error.context && error.context.text) detail=await error.context.text(); }catch(_){} }
        return { ok:false, error:(detail||error.message||"la función send-push falló") };
      }
      const sent=(data&&data.sent)||0;
      if(!sent){
        let why=(data&&data.note)||"";
        if(!why && data && data.errors && data.errors.length) why="el servicio de push rechazó el envío ("+String(data.errors[0]).slice(0,80)+")";
        return { ok:false, error:why||"se envió a 0 dispositivos (activa el push en este teléfono)" };
      }
      return { ok:true, sent };
    }catch(e){ return { ok:false, error:(e&&e.message)||"error" }; }
  }

  /* ---------- Transferencia de cuenta (cambiar de instalación) ----------
     iOS aísla el almacenamiento por ícono instalado: al borrar el ícono se
     pierde la sesión anónima (tu identidad en la nube). Estas dos funciones
     permiten exportar la sesión como tokens y restaurarla en la instalación
     nueva, recuperando la MISMA cuenta (puntos, historial, amigos, fotos). */
  async function exportSession(){
    if(!enabled() || !await init() || !client) return null;
    try{
      const { data:{ session } } = await client.auth.getSession();
      if(!session) return null;
      return { access_token:session.access_token, refresh_token:session.refresh_token };
    }catch(e){ return null; }
  }
  async function restoreSession(tokens){
    if(!configured() || !tokens || !tokens.refresh_token) return false;
    try{
      if(!client) client = sdk().createClient(SUPABASE_URL, SUPABASE_ANON, { auth:{ persistSession:true, autoRefreshToken:true } });
      // refreshSession canjea el refresh token por una sesión nueva: funciona
      // aunque el access token que viajó en el código ya haya caducado.
      const { data, error } = await client.auth.refreshSession({ refresh_token:tokens.refresh_token });
      if(error || !data || !data.session){ console.warn("restoreSession:", error && error.message); return false; }
      uid = data.session.user.id; ready = true; superseded = false;
      rememberUid(uid); // recuerda la cuenta restaurada (para no crear una nueva por error)
      // ESTA instalación pasa a ser la dueña de la cuenta: la instalación vieja
      // (si sigue instalada) se retirará sola al ver la marca cambiada, en vez
      // de quedarse renovando el mismo token y matando la sesión de ambas.
      await claimEpoch();
      return true;
    }catch(e){ console.warn("restoreSession:", e && e.message); return false; }
  }

  return { configured, enabled, init, myId, state, reconnect, reclaimHere, startFresh, guessPhotoUrl, pushProfile, pushCompletion, pushSharedCompletion, syncBacklog, reconcile, forceResync, relinkPhotos, pullFriend,
    createShared, fetchShared, fetchSharedOne, acceptShared, rejectShared, completeShared, deleteShared, uploadShared, notify, notifySelf, maybeNotifyWeeklySummary, fetchNotifs, markNotifsRead, clearNotif, clearNotifs, clearAllNotifs, clearNotifsByTitle, ensurePush, disablePush, syncReminder, deleteReminder, syncAllReminders, listReminders, testPush, updatePartner,
    sendFriendRequest, fetchFriendships, acceptFriend, rejectFriend, removeFriendCloud, linkFriend,
    fetchComments, addComment, deleteComment, lookupProfile, lookupProfileEmail, sendFriendRequestByEmail,
    exportSession, restoreSession,
    raw:()=>client, ensure:init, session:()=>client&&client.auth };
})();

/* =====================================================================
   ACCOUNT — cuenta con correo
   Hasta ahora cada instalación creaba una cuenta ANÓNIMA: los datos vivían
   en la nube pero atados a ese teléfono, así que cambiar de móvil obligaba a
   transferir un código a mano. Con un correo la cuenta deja de ser del
   aparato y pasa a ser tuya.

   Registrarse desde una instalación que ya tiene cuenta anónima NO crea una
   cuenta nueva: le PONE el correo a la que ya existe (updateUser). Así no se
   pierden amigos, historial ni fotos, que es justo lo que pasaría creando
   una cuenta limpia y abandonando la vieja.
   ===================================================================== */
const Account = (() => {
  function client(){ return Cloud.raw(); }
  async function user(){
    try{ await Cloud.ensure(); const c=client(); if(!c) return null;
      const { data } = await c.auth.getUser(); return (data && data.user) || null;
    }catch(e){ return null; }
  }
  // Una cuenta anónima de Supabase no tiene correo; esa es la señal.
  async function info(){
    const u = await user();
    if(!u) return { signed:false, email:null, anon:true };
    return { signed: !!u.email, email: u.email || null, anon: !u.email };
  }
  function niceError(e){
    const m = String((e && (e.message||e.error_description)) || e || "");
    if(/already registered|already been registered|User already registered/i.test(m))
      return "Ese correo ya tiene cuenta. Usa “Iniciar sesión”.";
    if(/Invalid login credentials/i.test(m)) return "Correo o contraseña incorrectos.";
    if(/Password should be at least/i.test(m))  return "La contraseña debe tener al menos 6 caracteres.";
    if(/Email not confirmed/i.test(m))          return "Confirma el correo que te enviamos y vuelve a entrar.";
    if(/rate limit|too many/i.test(m))          return "Demasiados intentos. Prueba en un minuto.";
    if(/Unable to validate email|invalid format/i.test(m)) return "Ese correo no parece válido.";
    return m || "No se pudo completar.";
  }
  // Registrarse = ponerle correo a la cuenta que ya usas en este teléfono.
  async function signUp(email, password){
    await Cloud.ensure(); const c=client();
    if(!c) return { ok:false, msg:"Sin conexión con la nube." };
    const u = await user();
    try{
      if(u && !u.email){
        const { error } = await c.auth.updateUser({ email, password });
        if(error) throw error;
        await Sync.push();                       // deja tus datos ya subidos
        return { ok:true, msg:"Cuenta creada. Tus datos ya están en ella.", linked:true };
      }
      const { error } = await c.auth.signUp({ email, password });
      if(error) throw error;
      await Sync.push();
      return { ok:true, msg:"Cuenta creada." };
    }catch(e){ return { ok:false, msg:niceError(e) }; }
  }
  // Entrar en otro dispositivo: la cuenta cambia, así que el estado local se
  // descarta y se trae el de la nube. Antes de irnos se sube lo que hubiera
  // en la cuenta anterior, para no dejarlo a medias.
  async function signIn(email, password){
    await Cloud.ensure(); const c=client();
    if(!c) return { ok:false, msg:"Sin conexión con la nube." };
    try{
      try{ await Sync.flush(); }catch(_){}
      const { error } = await c.auth.signInWithPassword({ email, password });
      if(error) throw error;
      Sync.reset();
      try{ localStorage.setItem("rachas_uid", (await user() || {}).id || ""); }catch(_){}
      const got = await Sync.pull();
      await Sync.start();
      return { ok:true, msg: got ? "Sesión iniciada. Datos restaurados."
                                 : "Sesión iniciada." };
    }catch(e){ return { ok:false, msg:niceError(e) }; }
  }
  // Cerrar sesión sube lo pendiente ANTES de salir: si no, lo último que
  // hiciste se quedaría solo en un teléfono del que estás saliendo.
  async function signOut(){
    try{ await Sync.flush(); }catch(_){}
    try{ const c=client(); if(c) await c.auth.signOut(); }catch(e){}
    Sync.reset();
    try{ localStorage.removeItem("rachas_uid"); localStorage.removeItem("rachas_epoch"); }catch(_){}
    return { ok:true };
  }
  async function reset(email){
    await Cloud.ensure(); const c=client();
    if(!c) return { ok:false, msg:"Sin conexión con la nube." };
    try{
      const { error } = await c.auth.resetPasswordForEmail(email);
      if(error) throw error;
      return { ok:true, msg:"Te hemos enviado un correo para cambiar la contraseña." };
    }catch(e){ return { ok:false, msg:niceError(e) }; }
  }
  return { info, signUp, signIn, signOut, reset };
})();

/* =====================================================================
   SYNC — el estado completo, siempre en la nube
   Una sola fila por cuenta (tabla app_state) con TODO: tareas, historial,
   puntos, racha, amigos. Cada guardado local programa una subida; cada
   cambio hecho en otro dispositivo llega por Realtime y se funde aquí.
   No hay botón de sincronizar: un botón significaría que la app puede
   quedarse desincronizada, y entonces la cuenta no serviría para nada.

   FUSIÓN: el historial NUNCA se sobrescribe, se UNE por id. Es el único
   dato irrecuperable (una tarea completada, con su foto y sus puntos); lo
   demás —tareas, ajustes— es reproducible, así que ahí manda la versión más
   reciente. Puntos y racha no se funden: Store.load() los recalcula a partir
   del historial ya unido, así que salen bien solos.
   ===================================================================== */
const Sync = (() => {
  const REV_KEY = "rachas_sync_rev";
  let timer=null, busy=false, pending=false, channel=null, lastRev=0, started=false;
  try{ lastRev = parseInt(localStorage.getItem(REV_KEY)||"0",10)||0; }catch(e){}
  const setRev = (r)=>{ lastRev=r||0; try{ localStorage.setItem(REV_KEY,String(lastRev)); }catch(e){} };

  // Lo que viaja. Se excluyen las marcas propias del dispositivo (qué avisos
  // ya se enseñaron aquí), que no significan nada en otro teléfono.
  function snapshot(){
    const s = Store.get();
    return { profile:s.profile, tasks:s.tasks, history:s.history,
             friends:s.friends, penalties:s.penalties,
             deletedShared:s.deletedShared, cloud:{ avatarUrl:(s.cloud||{}).avatarUrl||null } };
  }
  function mergeInto(remote){
    if(!remote || typeof remote!=="object") return false;
    let changed=false;
    Store.update(s=>{
      // --- historial: unión por id, nunca se pierde una completada ---
      const seen = new Set((s.history||[]).map(h=>h.id));
      (remote.history||[]).forEach(h=>{ if(h && h.id && !seen.has(h.id)){ s.history.push(h); seen.add(h.id); changed=true; } });
      s.history.sort((a,b)=> (b.date+(b.time||"")).localeCompare(a.date+(a.time||"")));
      // --- tareas y ajustes: manda lo remoto (viene de una revisión mayor) ---
      if(Array.isArray(remote.tasks)) { s.tasks = remote.tasks; changed=true; }
      if(Array.isArray(remote.friends)) s.friends = remote.friends;
      if(Array.isArray(remote.deletedShared)) s.deletedShared = remote.deletedShared;
      if(remote.profile && remote.profile.name) s.profile.name = remote.profile.name;
      if(remote.profile && remote.profile.avatar) s.profile.avatar = remote.profile.avatar;
      if(remote.cloud && remote.cloud.avatarUrl) s.cloud.avatarUrl = remote.cloud.avatarUrl;
      if(typeof remote.penalties === "number") s.penalties = remote.penalties;
    });
    Store.load();                 // recalcula puntos y racha desde el historial
    return changed;
  }
  async function pull(){
    try{
      const uid = await Cloud.ensure(); const c = Cloud.raw();
      if(!uid || !c) return false;
      const { data, error } = await c.from('app_state').select('data,rev').eq('user_id',uid).maybeSingle();
      if(error || !data) return false;
      if((data.rev||0) <= lastRev) return false;   // ya lo tenemos
      mergeInto(data.data);
      setRev(data.rev||0);
      if(typeof Tasks!=="undefined" && Tasks.render) Tasks.render();
      if(typeof UI!=="undefined" && UI.renderProfile) UI.renderProfile();
      return true;
    }catch(e){ return false; }
  }
  async function push(){
    if(busy){ pending=true; return; }
    busy=true;
    try{
      const uid = await Cloud.ensure(); const c = Cloud.raw();
      if(!uid || !c) return;
      // Antes de escribir se lee: si otro dispositivo subió algo mientras
      // tanto, se funde primero. Así dos teléfonos convergen en vez de
      // pisarse el uno al otro.
      const { data } = await c.from('app_state').select('data,rev').eq('user_id',uid).maybeSingle();
      const cloudRev = (data && data.rev) || 0;
      if(data && cloudRev > lastRev){ mergeInto(data.data); setRev(cloudRev); }
      const rev = Math.max(cloudRev, lastRev) + 1;
      const { error } = await c.from('app_state').upsert({
        user_id:uid, data:snapshot(), rev, updated_at:new Date().toISOString() });
      if(!error) setRev(rev);
    }catch(e){}
    finally{ busy=false; if(pending){ pending=false; schedule(); } }
  }
  // Agrupa ráfagas: completar una tarea toca el estado varias veces seguidas.
  function schedule(){ if(timer) clearTimeout(timer); timer=setTimeout(()=>{ timer=null; push(); }, 1500); }
  function flush(){ if(timer){ clearTimeout(timer); timer=null; } push(); }

  async function watch(){
    try{
      const uid = await Cloud.ensure(); const c = Cloud.raw();
      if(!uid || !c) return;
      if(channel){ try{ c.removeChannel(channel); }catch(e){} channel=null; }
      channel = c.channel('app_state_'+uid)
        .on('postgres_changes', { event:'*', schema:'public', table:'app_state', filter:'user_id=eq.'+uid },
            ()=> pull())
        .subscribe();
    }catch(e){}
  }
  async function start(){
    if(started) return; started=true;
    await pull();       // lo primero al abrir: traerse lo que haya
    watch();
    // Redes que se caen, apps que vuelven del segundo plano: al reaparecer se
    // comprueba si hay algo nuevo y se vuelca lo que quedara pendiente.
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ pull(); schedule(); } });
    window.addEventListener("online", ()=>{ pull(); schedule(); });
    window.addEventListener("pagehide", ()=>{ try{ flush(); }catch(e){} });
  }
  // Al cambiar de cuenta el contador de revisión no vale: empieza de cero.
  function reset(){ setRev(0); started=false; if(channel){ try{ Cloud.raw().removeChannel(channel); }catch(e){} channel=null; } }
  return { schedule, flush, pull, push, start, reset, snapshot, mergeInto };
})();
window.Sync = Sync;

/* =====================================================================
   FRIENDS — amigos en la nube (Supabase). Se añaden por ID; el perfil se
   actualiza automáticamente al abrirlo (sin botón). Fotos y avatar en
   máxima calidad desde Storage. (El antiguo sistema de códigos se eliminó.)
   ===================================================================== */
const Friends = (() => {
  const MONTHS=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  let gen=0;          // token: invalida refrescos en segundo plano si el usuario navega
  let pollTimer=null; // sondeo en vivo del perfil de un amigo abierto
  function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

  const initial = (n)=> esc((n||"A").trim().charAt(0).toUpperCase()||"A");
  const avHtml = (f, cls)=> f.avatar ? `<div class="${cls}"><img src="${esc(f.avatar)}" alt=""></div>` : `<div class="${cls}">${initial(f.name)}</div>`;
  // ¿cambió algo relevante del amigo? (para no re-renderizar sin necesidad).
  // Incluye las fotos del historial y el "con quién": si cambia, se re-pinta.
  const fsig = (f)=> JSON.stringify([f.name,f.avatar,f.points,f.streak&&f.streak.current,f.streak&&f.streak.best,(f.history||[]).map(h=>[h.date,h.title,h.photoUrl||"",h.partnerName||"",h.partnerId||""])]);

  // Cache de MIS tareas compartidas, para anotar "Contigo" en el calendario de
  // un amigo SIN depender de que él haya sincronizado (se calcula desde aquí).
  let myShared = [];
  let mySharedLoaded = false; // true solo tras una carga EXITOSA (para ocultar con seguridad)
  const removedFriends = new Set(); // ids recién eliminados: que el sondeo no los re-añada
  async function loadMyShared(){ if(!Cloud.enabled()) return; const r=await Cloud.fetchShared(); if(r!==null){ myShared=r; mySharedLoaded=true; } }
  // Conjuntos para reconocer rápido las tareas que comparto con ESTE amigo.
  function sharedWith(friendCloudId){
    const my = Cloud.myId && Cloud.myId();
    const rows=(myShared||[]).filter(r=> (r.owner_id===my&&r.partner_id===friendCloudId) || (r.partner_id===my&&r.owner_id===friendCloudId));
    const ids=new Set(rows.map(r=>'sh_'+r.id));                                  // si el amigo la recibió de mí (id sh_)
    const dt =new Set(rows.map(r=>(r.done_date||'')+'|'+shortTitle(r.title||''))); // si el amigo fue quien la completó
    return { ids, dt };
  }

  /* ---------- Sheet principal (lista de amigos) ---------- */
  function openSheet(){
    stopPoll();
    loadMyShared(); // precarga mis tareas compartidas (para anotar "Contigo")
    const myGen=++gen;
    const avail = Cloud.configured();
    Sheets.show(`
      <div class="grabber"></div>
      <div class="sheet-head"><span class="act" style="opacity:0">•</span><span class="title">Amigos</span><span class="act" id="frClose">Cerrar</span></div>
      <div class="sheet-body">
        ${avail?'':'<div class="card friends-empty">Necesitas conexión a internet para usar los amigos.</div>'}
        <div class="friends-sheet-head">
          <button class="mini-btn accent" id="friendAdd">Añadir amigo</button>
        </div>
        <div id="friendsList"></div>
      </div>`);
    $("#frClose").onclick=Sheets.close;
    $("#friendAdd").onclick=()=>{ haptic(); addSheet(); };
    renderList();
    refreshAll(myGen); // actualiza la lista en segundo plano
    // sondeo EN VIVO de la lista mientras está abierta (puntos/racha/altas/bajas)
    stopPoll();
    pollTimer=setInterval(()=>{
      if(myGen!==gen || !$("#friendsList")){ stopPoll(); return; }
      refreshAll(myGen);
    }, 8000);
  }
  function renderList(){
    const wrap=$("#friendsList"); if(!wrap) return;
    const s=Store.get();
    if(!s.friends.length){
      wrap.innerHTML=`<div class="card friends-empty">Aún no tienes amigos.<br>Pulsa <b>Añadir amigo por correo</b> y escribe el correo con el que se registró.</div>`;
      return;
    }
    wrap.innerHTML=s.friends.map(f=>`<div class="card friend-card" data-fid="${f.id}">
        ${avHtml(f,"friend-av")}
        <div class="friend-info">
          <div class="fn">${esc(f.name)}</div>
          <div class="fm">${esc(rankFor(f.points).rank.name)} · ${f.points} pts · <span class="fire">🔥 ${f.streak.current}</span></div>
        </div>
        <span class="friend-chev">${chevronSvg()}</span>
      </div>`).join("");
    $$("[data-fid]",wrap).forEach(c=> c.onclick=()=>{ haptic(); const f=Store.get().friends.find(x=>x.id===c.getAttribute("data-fid")); if(f) openProfile(f); });
  }
  // Reconcilia la lista de amigos con la tabla de amistades de la nube y refresca
  // sus perfiles. La eliminación mutua y las solicitudes aceptadas se reflejan aquí.
  async function syncFriends(){
    if(!Cloud.configured()) return false;
    const myId=Cloud.myId(); if(!myId) return false;
    const rows=await Cloud.fetchFriendships();
    let changed=false;
    if(rows!==null){ // null = fallo de red: no tocar la lista
      const accepted=new Set(), known=new Set();
      rows.forEach(r=>{ const o=r.requester===myId? r.addressee : r.requester; known.add(o); if(r.status==='accepted') accepted.add(o); });
      // si la eliminación ya se confirmó en la nube (sin fila), libera el bloqueo
      removedFriends.forEach(id=>{ if(!known.has(id)) removedFriends.delete(id); });
      const toMigrate=[];
      // 1) reconciliar: mantener aceptados; quitar los ya confirmados que el otro
      //    eliminó (linked y sin amistad); migrar amigos antiguos (solo locales).
      Store.update(st=>{
        const keep=[];
        (st.friends||[]).forEach(f=>{
          if(!f.cloudId){ keep.push(f); return; }
          if(removedFriends.has(f.cloudId)){ changed=true; return; }   // recién eliminado: fuera
          if(accepted.has(f.cloudId)){ f.linked=true; keep.push(f); }
          else if(f.linked){ changed=true; /* eliminado por el otro → fuera de la lista */ }
          else { keep.push(f); toMigrate.push(f.cloudId); }
        });
        st.friends=keep;
      });
      toMigrate.forEach(oid=> Cloud.linkFriend(oid)); // antiguos → amistad aceptada (se confirma luego)
      // 2) añadir los amigos aceptados que aún no tengo en la lista
      for(const oid of accepted){
        if(removedFriends.has(oid)) continue; // no re-añadir lo que acabo de eliminar
        if(!Store.get().friends.some(f=>f.cloudId===oid)){
          const fr=await Cloud.pullFriend(oid);
          if(fr){ Store.update(st=>{ if(!st.friends.some(f=>f.cloudId===oid)) st.friends.unshift({ id:uid(), ...fr, linked:true, addedAt:Date.now() }); }); changed=true; }
        }
      }
    }
    // 3) refrescar el perfil de cada amigo
    const list=Store.get().friends.filter(f=>f.cloudId);
    await Promise.all(list.map(async f=>{
      const d=await Cloud.pullFriend(f.cloudId);
      if(d){ Store.update(st=>{ const i=st.friends.findIndex(x=>x.id===f.id); if(i>=0) st.friends[i]={...st.friends[i],...d}; }); changed=true; }
    }));
    return changed;
  }
  // igual, pero re-pinta la lista si seguimos en el mismo sheet
  async function refreshAll(token){
    const changed=await syncFriends();
    if(changed && token===gen) renderList();
  }

  function addSheet(){
    if(!Cloud.configured()){ UI.toast("Necesitas conexión","check","var(--red)"); return; }
    Sheets.show(`
      <div class="grabber"></div>
      <div class="sheet-head"><span class="act cancel" id="faCancel">Cancelar</span><span class="title">Añadir amigo</span><span class="act" id="faSend">Enviar</span></div>
      <div class="sheet-body">
        <p style="color:var(--label-2);font-size:14px;margin:6px 0 14px;line-height:1.5;">
          Escribe el <b>correo</b> con el que tu amigo creó su cuenta. Le llegará una
          solicitud y, al aceptarla, veréis vuestros perfiles en vivo.</p>
        <div class="form-group">
          <div class="field-block"><input class="field" id="faEmail" type="email" inputmode="email"
               autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="correo@ejemplo.com"/></div>
        </div>
        <div class="hint">Tiene que ser el correo exacto: no se puede buscar por partes.</div>
      </div>`);
    const input=$("#faEmail"), send=$("#faSend");
    $("#faCancel").onclick=openSheet;
    send.onclick=async ()=>{
      const email=(input.value||"").trim();
      if(!/^\S+@\S+\.\S+$/.test(email)){ UI.toast("Escribe un correo válido","check","var(--red)"); return; }
      send.textContent="Enviando…";
      const r=await Cloud.sendFriendRequestByEmail(email);
      send.textContent="Enviar";
      if(!r.ok){ UI.toast(r.error||"No se pudo enviar","check","var(--red)"); return; }
      if(r.accepted){ haptic(15); UI.toast(`Ahora eres amigo de ${esc(r.name||"")}`,"check","var(--green)"); syncFriends().then(()=>renderList()); openSheet(); return; }
      haptic(15); UI.toast(`Solicitud enviada a ${esc(r.name||"")}`,"check","var(--green)"); openSheet();
    };
    setTimeout(()=>{ try{ input.focus({preventScroll:true}); }catch(_){ input.focus(); } },350);
  }

  function confirmRemoveFriend(f){
    Sheets.show(`
      <div class="grabber"></div>
      <div class="sheet-head"><span class="act cancel" id="rfCancel">Cancelar</span><span class="title">Eliminar amigo</span><span class="act" style="opacity:0">•</span></div>
      <div class="sheet-body photo-modal">
        <div class="ico danger">${trashSvg()}</div>
        <h3>¿Eliminar a ${esc(f.name)}?</h3>
        <p>Dejaréis de ver vuestros perfiles y la amistad se borra <b>para los dos</b>. No se puede deshacer.</p>
        <button class="btn danger" id="rfGo">Sí, eliminar</button>
        <button class="btn ghost" id="rfNo" style="margin-top:10px">Cancelar</button>
      </div>`);
    const back=()=>openProfile(f);
    $("#rfCancel").onclick=back;
    $("#rfNo").onclick=back;
    $("#rfGo").onclick=async ()=>{
      haptic(20); stopPoll();
      if(f.cloudId) removedFriends.add(f.cloudId);                 // bloquea re-añadir hasta confirmar
      Store.update(s=>{ s.friends=s.friends.filter(x=>x.id!==f.id); });
      UI.toast("Amigo eliminado","check","var(--red)"); openSheet(); // instantáneo, sin el amigo
      if(f.cloudId) await Cloud.removeFriendCloud(f.cloudId);       // borra la amistad para ambos
    };
  }

  function openProfile(f, fetched, restoreScrollTop, initialMonth){
    const myGen = fetched ? gen : ++gen; // vista nueva salvo que sea el re-pintado tras refrescar
    loadMyShared(); // refresca mis tareas compartidas para anotar "Contigo"
    // Los datos de la nube ya vienen bien (el trigger limpia al borrar), pero un
    // amigo guardado por una versión antigua puede traer la racha a medias, y
    // entonces el perfil enseñaba "undefined" en vez de un número.
    const fv = Object.assign({}, f, {
      points: f.points||0,
      streak: Object.assign({current:0,best:0,lastDate:null}, f.streak||{}),
      history: Array.isArray(f.history)?f.history:[],
      dates: Array.isArray(f.dates)?f.dates:[]
    });
    let cal = initialMonth ? new Date(initialMonth.y, initialMonth.m, 1) : new Date();
    const dateSet=new Set(fv.dates||[]);
    const fpWs = weeklySummaryFor(fv.history); // resumen de la semana (botón, si está disponible)
    // Si el sheet YA estaba abierto (volviendo de ver un día, o el re-pintado
    // del sondeo en vivo) se usa swap(): mismo contenido, sin re-animar toda la
    // hoja (evita el "temblor"). Solo al abrir de cero (desde la lista) se anima.
    // Sheets.show ya decide solo: si la hoja está abierta (viniendo de la
    // lista de amigos, de un día, o un re-pintado en vivo) cambia el contenido
    // sin re-animar; solo anima la entrada si estaba cerrada.
    Sheets.show(`
      <div class="grabber"></div>
      <div class="sheet-head"><span class="act" id="fpBack">‹ Atrás</span><span class="title">Amigo</span><span class="act" id="fpClose">Cerrar</span></div>
      <div class="sheet-body">
        <div class="profile-head">
          ${avHtml(f,"avatar")}
          <div class="ph-id">
            <div class="ph-name-row">
              <div class="profile-name">${esc(f.name)}</div>
            </div>
            <span class="rank-badge" style="color:${gemFor(rankFor(fv.points).index).hi}">${gemSvg(rankFor(fv.points).index)} ${esc(rankFor(fv.points).rank.name)}</span>
            <div class="ph-chips">
              <span class="phc fire"><span class="emoji">🔥</span><b>${fv.streak.current}</b></span>
              <span class="phc pts"><b data-count="${fv.points}">0</b> pts</span>
            </div>
          </div>
        </div>
        <div class="stat-grid">
          <div class="card stat"><div class="v" data-count="${(fv.history||[]).length}">0</div><div class="l">Completadas</div></div>
          <div class="card stat"><div class="v pur" data-count="${(fv.history||[]).filter(h=>h.random).length}">0</div><div class="l">Aleatorias</div></div>
          <div class="card stat"><div class="v grn" data-count="${(fv.history||[]).length-(fv.history||[]).filter(h=>h.random).length}">0</div><div class="l">Normales</div></div>
        </div>
        ${fpWs.available?'<button class="btn secondary week-btn" id="fpWeekBtn">Ver resumen semanal</button>':''}
        <div class="card cal-card">
          <div class="cal-head"><span class="m" id="fpMonth">—</span>
            <div class="cal-nav">
              <button id="fpPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 5l-7 7 7 7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
              <button id="fpNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5l7 7-7 7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
          </div>
          <div class="cal-dow-row" id="fpDow"></div>
          <div class="cal-weeks" id="fpGrid"></div>
        </div>
        <!-- Al final del todo: hay que recorrer el perfil entero para llegar
             hasta aquí, que es lo que corresponde a algo que no se deshace. -->
        <button class="btn danger ghost" id="fpDel" style="margin-top:18px">${trashSvg()} Eliminar amigo</button>
      </div>`);
    // Solo al ABRIR de verdad, no en los repintados del sondeo en vivo: ver
    // los números reiniciarse cada 8 segundos sería un tic, no una animación.
    if(!fetched) animateCounters($("#sheet"), 700);
    $("#fpBack").onclick=openSheet;
    $("#fpClose").onclick=()=>{ stopPoll(); Sheets.close(); };
    // Eliminar a un amigo lo borra para LOS DOS y no se puede deshacer: se
    // pregunta siempre, y el botón que confirma no es el que estabas tocando.
    $("#fpDel").onclick=()=>{ haptic(); confirmRemoveFriend(f); };
    if(fpWs.available){ const wb=$("#fpWeekBtn"); if(wb) wb.onclick=()=>{ haptic(); openWeekSummarySheet(fpWs, {mine:false}); }; }
    function draw(){
      const y=cal.getFullYear(), m=cal.getMonth();
      $("#fpMonth").textContent = MONTHS[m].charAt(0).toUpperCase()+MONTHS[m].slice(1)+" "+y;
      $("#fpDow").innerHTML = ["Lu","Ma","Mi","Ju","Vi","Sá","Do"].map(d=>`<div class="cal-dow">${d}</div>`).join("");
      const lead=(new Date(y,m,1).getDay()+6)%7, days=new Date(y,m+1,0).getDate(), todayK=dateKey();
      const cells=[];
      for(let d=1;d<=days;d++){
        const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const has=dateSet.has(key);
        const cls=["cal-day"]; if(key===todayK)cls.push("today"); if(has)cls.push("has");
        const st = d===1 && lead>0 ? ` style="grid-column-start:${lead+1}"` : "";
        cells.push(`<div class="${cls.join(' ')}"${st} ${has?`data-fday="${key}"`:""}>${d}</div>`);
      }
      const grid=$("#fpGrid"); grid.innerHTML=cells.join("");
      $$("[data-fday]",grid).forEach(c=> c.onclick=()=> openFriendDay(f, c.getAttribute("data-fday")) );
    }
    $("#fpPrev").onclick=()=>{ cal.setMonth(cal.getMonth()-1); haptic(); draw(); };
    $("#fpNext").onclick=()=>{ cal.setMonth(cal.getMonth()+1); haptic(); draw(); };
    draw();
    // al volver de ver un día con "Atrás", queda donde estabas (no salta al inicio).
    // En iOS, fijar el scroll mientras el desplazamiento con inercia del gesto
    // anterior aún "corre" produce un pequeño rebote visual (sube y vuelve a
    // bajar): se corta esa inercia apagando el scroll táctil un instante antes.
    const sheetBodyEl = $(".sheet-body");
    if(restoreScrollTop!=null && sheetBodyEl){
      sheetBodyEl.style.webkitOverflowScrolling="auto";
      sheetBodyEl.scrollTop=restoreScrollTop;
      requestAnimationFrame(()=>{ sheetBodyEl.style.webkitOverflowScrolling="touch"; });
    }
    // sigue el scroll y el mes en vivo, para que un re-pintado (sondeo en vivo)
    // conserve dónde estabas en vez de reiniciar la vista por defecto: la
    // estructura solo se reinicia al VOLVER A ABRIR el perfil desde la lista.
    let liveScroll = restoreScrollTop||0;
    if(sheetBodyEl) sheetBodyEl.addEventListener("scroll", ()=>{ liveScroll=sheetBodyEl.scrollTop; }, {passive:true});
    // aplica datos frescos: guarda en el store y re-pinta si sigues en esta vista
    const applyFresh = (fr)=>{
      if(!fr) return;
      const updated={ ...f, ...fr };
      Store.update(s=>{ const i=s.friends.findIndex(x=>x.id===f.id); if(i>=0) s.friends[i]=updated; });
      const open = $("#scrim").classList.contains("show") && $("#fpGrid"); // sheet aún abierto en este perfil
      if(gen!==myGen || !open || fsig(updated)===fsig(f)) return; // navegó/cerró o nada cambió
      stopPoll(); openProfile(updated, true, liveScroll, {y:cal.getFullYear(), m:cal.getMonth()});
    };
    // Auto-actualización inmediata al abrir
    if(!fetched && f.cloudId){ Cloud.pullFriend(f.cloudId).then(applyFresh); }
    // Sondeo EN VIVO mientras el perfil está abierto (sin reabrir)
    stopPoll();
    if(f.cloudId){
      pollTimer=setInterval(()=>{
        if(gen!==myGen || !$("#scrim").classList.contains("show") || !$("#fpGrid")){ stopPoll(); return; }
        Cloud.pullFriend(f.cloudId).then(fr=>{ if(gen===myGen) applyFresh(fr); });
      }, 5000);
    }
  }

  // Galería del día de un amigo: fotos (URL) + títulos
  function openFriendDay(f, key){
    stopPoll(); gen++; haptic();
    // recordar el scroll del perfil para restaurarlo al volver con "Atrás"
    const profileScrollTop = ($(".sheet-body")||{}).scrollTop || 0;
    loadMyShared(); // refresca mis compartidas en segundo plano (ya suele estar cargado)
    f = Store.get().friends.find(x=>x.id===f.id) || f; // usar los datos más frescos del store
    const myCloudId=Cloud.myId&&Cloud.myId();
    const sw=sharedWith(f.cloudId); // tareas que comparto con este amigo (para "Contigo")
    const items=(f.history||[]).filter(h=>h.date===key).sort((a,b)=> (a.time||"")<(b.time||"")?-1:1);
    const [y,mo,d]=key.split("-");
    const title=`${parseInt(d)} de ${MONTHS[parseInt(mo)-1]}`;
    // siempre se entra aquí desde el perfil ya abierto: swap() evita el "temblor"
    // de reanimar toda la hoja al navegar.
    Sheets.swap(`
      <div class="grabber"></div>
      <div class="sheet-head"><span class="act" id="fdBack">‹ Atrás</span><span class="title">${title}</span><span class="act" id="fdClose">Listo</span></div>
      <div class="sheet-body"><div class="day-gallery" id="fdList"></div></div>`);
    $("#fdBack").onclick=()=>openProfile(f, undefined, profileScrollTop, {y:parseInt(y), m:parseInt(mo)-1});
    $("#fdClose").onclick=Sheets.close;
    const listEl=$("#fdList");
    const myName=((Store.get().profile.name||"").trim().toLowerCase());
    const withWhom=(h)=>{
      // ¿la hicimos entre los dos? Varias señales para que sea estable:
      const withMe = (myCloudId && h.partnerId===myCloudId)
        || (h.id && sw.ids.has(h.id))
        || sw.dt.has((h.date||'')+'|'+shortTitle(h.title||''))
        || (myName && (h.partnerName||"").trim().toLowerCase()===myName);
      let txt="";
      if(withMe) txt="Contigo";
      else if(h.partnerName) txt="con "+esc(h.partnerName);
      if(!txt) return "";
      return ` · <span class="pts" style="color:var(--indigo)">${txt}</span>`;
    };
    listEl.innerHTML = items.length ? items.map(h=>`
      <div class="card gal-item">
        <div class="gal-thumb"></div>
        <div class="gal-info">
          <div class="t">${esc(shortTitle(h.title||"Tarea"))}</div>
          <div class="m">${esc(h.time||"")}${h.category?" · "+esc(h.category):""}${h.points?` · <span class="pts">${h.points} pts</span>`:""}${withWhom(h)}</div>
        </div>
      </div>`).join("") : `<div class="card friends-empty">Sin tareas registradas este día.</div>`;
    items.forEach((h,idx)=>{
      const thumb=listEl.querySelectorAll(".gal-thumb")[idx]; if(!thumb) return;
      if(h.photoUrl){
        const im=new Image(); im.onerror=()=>{ thumb.innerHTML=noPhotoThumb(); }; im.src=h.photoUrl; thumb.appendChild(im);
        thumb.parentElement.classList.add("tappable");
        thumb.parentElement.onclick=()=>Lightbox.show(h.photoUrl,{...h, ownerId:f.cloudId}); // el dueño es el amigo (para avisarle)
      } else thumb.innerHTML=noPhotoThumb();
    });
  }

  function init(){ const b=$("#friendsBtn"); if(b) b.onclick=()=>{ haptic(); openSheet(); }; }
  return { init, openSheet, openProfile, syncFriends };
})();

/* =====================================================================
   NOTIFS — sección de notificaciones (un amigo te añadió/completó una
   tarea). Aviso del sistema en primer plano + push en segundo plano.
   ===================================================================== */
const Notifs = (() => {
  function timeAgo(iso){
    try{ const d=(Date.now()-new Date(iso).getTime())/1000;
      if(d<60) return "ahora"; if(d<3600) return `hace ${Math.floor(d/60)} min`;
      if(d<86400) return `hace ${Math.floor(d/3600)} h`; return `hace ${Math.floor(d/86400)} d`;
    }catch(e){ return ""; }
  }
  // Los avisos viven 72 h (antes 24 h: tras una racha de avisos parecía que
  // "desaparecían" de un día para otro). Solicitudes e invitaciones no caducan
  // hasta que se responden.
  const fresh = (n)=> n.type==='friend_request' || n.type==='shared_invite' || (Date.now()-new Date(n.created_at).getTime()) < 259200000;
  function updateBadge(){
    const list=(Store.get().notifs||[]).filter(fresh);
    const n=list.filter(x=>!x.read).length;
    const b=$("#notifBadge"); if(b){ b.style.display=n?"grid":"none"; b.textContent=n>9?"9+":String(n); }
  }
  const notifSig = (list)=> JSON.stringify((list||[]).map(n=>n.id));
  async function refresh(){
    if(!Cloud.enabled()) return;
    let list=await Cloud.fetchNotifs();
    if(list===null) return; // fallo de red: conservar la lista local tal cual
    // Vencen a las 24 h (excepto las solicitudes de amistad): se borran y no se muestran.
    const old=list.filter(n=> !fresh(n));
    list=list.filter(fresh);
    if(old.length) Cloud.clearNotifs(old.map(n=>n.id));
    const prevSig = notifSig(listNow());
    Store.update(s=>{ s.notifs=list; s.notifSeen=list.map(n=>n.id); });
    updateBadge();
    // Si el menú de notificaciones está abierto, refréscalo solo (sin que el
    // usuario tenga que cerrarlo y volver a abrirlo): p.ej. cuando un amigo borra
    // una tarea o un comentario, su aviso desaparece al instante de tu lista.
    const sheetOpen = !!$("#ntList") && $("#scrim").classList.contains("show");
    if(sheetOpen && notifSig(listNow())!==prevSig) openSheet();
    // Nota: el aviso del SISTEMA lo muestra el push (service worker), así que aquí
    // NO creamos otro con new Notification() para no duplicar la notificación.
  }
  function notifHtml(n){
    if(n.type==='friend_request'){
      return `<div class="card gal-item notif-item notif-req">
        <div class="notif-ic add">${peopleSvg()}</div>
        <div class="gal-info">
          <div class="t"><b>${esc(n.actor_name||"Alguien")}</b> te ha enviado una solicitud de amistad</div>
          <div class="m">${timeAgo(n.created_at)}</div>
          <div class="req-actions">
            <button class="mini-btn accent" data-accept="${esc(n.id)}" data-actor="${esc(n.actor_id||'')}">Aceptar</button>
            <button class="mini-btn" data-reject="${esc(n.id)}" data-actor="${esc(n.actor_id||'')}">Rechazar</button>
          </div>
        </div>
      </div>`;
    }
    if(n.type==='shared_invite'){
      // Exactamente el mismo formato que la solicitud de amistad, pero para
      // unirte a una tarea compartida (Aceptar la añade a ambas listas al
      // instante; Rechazar solo borra el aviso, sin afectar a nadie más).
      return `<div class="card gal-item notif-item notif-req">
        <div class="notif-ic add">${plusSvg()}</div>
        <div class="gal-info">
          <div class="t"><b>${esc(n.actor_name||"Alguien")}</b> quiere agregarte a una tarea</div>
          <div class="m">${esc(n.task_title||'')}${n.task_title?' · ':''}${timeAgo(n.created_at)}</div>
          <div class="req-actions">
            <button class="mini-btn accent" data-accept-shared="${esc(n.id)}" data-shared-id="${esc(n.ref_key||'')}">Aceptar</button>
            <button class="mini-btn" data-reject-shared="${esc(n.id)}" data-shared-id="${esc(n.ref_key||'')}">Rechazar</button>
          </div>
        </div>
      </div>`;
    }
    if(n.type==='weekly_summary'){
      return `<div class="card gal-item notif-item tappable" data-open-week-summary="1">
        <div class="notif-ic done" style="font-size:19px;">📊</div>
        <div class="gal-info"><div class="t">Ya está disponible tu resumen de la semana</div><div class="m">${timeAgo(n.created_at)}</div></div>
        <button class="notif-del" data-del="${esc(n.id)}" aria-label="Eliminar">✕</button>
      </div>`;
    }
    const done=n.type==='shared_done', comment=n.type==='comment';
    const text = comment ? `<b>${esc(n.actor_name||"Alguien")}</b> te comentó`
      : done ? `<b>${esc(n.actor_name||"Un amigo")}</b> completó una tarea`
      : `<b>${esc(n.actor_name||"Un amigo")}</b> te añadió a una tarea`;
    const withPhoto=(done||comment) && n.photo_url;
    const thumb = withPhoto ? `<div class="gal-thumb"><img src="${esc(n.photo_url)}"></div>` : `<div class="notif-ic ${done||comment?'done':'add'}">${comment?commentSvg():done?checkSvg():plusSvg()}</div>`;
    // abrir la tarea con sus comentarios desde el aviso (misma mecánica del calendario).
    // Incluye hora/categoría/puntos del propio aviso: el destinatario puede no
    // tener esa completada en su historial (p.ej. tarea de un amigo no compartida).
    const openAttrs = (withPhoto && n.ref_key) ? `data-photo="${esc(n.photo_url)}" data-title="${esc(n.task_title||'')}" data-key="${esc(n.ref_key)}" data-owner="${comment?'':esc(n.actor_id||'')}" data-time="${esc(n.task_time||'')}" data-category="${esc(n.task_category||'')}" data-points="${n.task_points!=null?n.task_points:''}"` : (withPhoto?`data-photo="${esc(n.photo_url)}" data-title="${esc(n.task_title||'')}"`:'');
    return `<div class="card gal-item notif-item${withPhoto?' tappable':''}" ${openAttrs}>
      ${thumb}
      <div class="gal-info"><div class="t">${text}</div><div class="m">${esc(n.task_title||'')}${n.task_title?' · ':''}${timeAgo(n.created_at)}</div></div>
      <button class="notif-del" data-del="${esc(n.id)}" aria-label="Eliminar">✕</button>
    </div>`;
  }
  function listNow(){ return (Store.get().notifs||[]).filter(fresh); }
  function openSheet(){
    haptic();
    // El permiso se pide solo al abrir la app; aquí solo avisamos si está bloqueado.
    const blocked=("Notification" in window && Notification.permission==='denied');
    const list=listNow();
    Sheets.show(`
      <div class="grabber"></div>
      <div class="sheet-head"><span class="act" style="opacity:0">•</span><span class="title">Notificaciones</span><span class="act" id="ntClose">Cerrar</span></div>
      <div class="sheet-body">
        ${blocked?'<div class="card friends-empty" style="margin-bottom:12px">Las notificaciones están bloqueadas. Actívalas en Ajustes del iPhone → esta app → Notificaciones.</div>':''}
        ${list.length?'<button class="notif-clear-all" id="ntClearAll">Borrar todas</button>':''}
        <div class="day-gallery" id="ntList">${list.length?list.map(notifHtml).join(""):'<div class="card friends-empty">Sin notificaciones todavía.<br>Aquí verás cuando alguien te invite a una tarea, te comente, o complete una.<br>Las notificaciones se borran solas a las 24 horas.</div>'}</div>
      </div>`);
    $("#ntClose").onclick=Sheets.close;
    // borrar una notificación
    $$("#ntList .notif-del").forEach(b=> b.onclick=(e)=>{ e.stopPropagation(); haptic(); const id=b.getAttribute("data-del");
      Cloud.clearNotif(id); Store.update(s=>{ s.notifs=(s.notifs||[]).filter(n=>n.id!==id); }); updateBadge(); openSheet(); });
    // borrar todas
    const ca=$("#ntClearAll"); if(ca) ca.onclick=()=>{ haptic(); Cloud.clearAllNotifs(); Store.update(s=>{ s.notifs=[]; }); updateBadge(); openSheet(); };
    // aceptar solicitud de amistad
    $$("#ntList [data-accept]").forEach(b=> b.onclick=async (e)=>{ e.stopPropagation(); haptic(15);
      const nid=b.getAttribute("data-accept"), actor=b.getAttribute("data-actor");
      b.textContent="Aceptando…"; b.disabled=true;
      const ok=await Cloud.acceptFriend(actor);
      if(ok){ Cloud.clearNotif(nid); Store.update(s=>{ s.notifs=(s.notifs||[]).filter(n=>n.id!==nid); }); updateBadge();
        Friends.syncFriends(); UI.toast("Solicitud aceptada","check","var(--green)"); openSheet(); }
      else { b.textContent="Aceptar"; b.disabled=false; UI.toast("No se pudo aceptar","bell","var(--red)"); }
    });
    // rechazar solicitud de amistad
    $$("#ntList [data-reject]").forEach(b=> b.onclick=async (e)=>{ e.stopPropagation(); haptic();
      const nid=b.getAttribute("data-reject"), actor=b.getAttribute("data-actor");
      await Cloud.rejectFriend(actor); Cloud.clearNotif(nid);
      Store.update(s=>{ s.notifs=(s.notifs||[]).filter(n=>n.id!==nid); }); updateBadge();
      UI.toast("Solicitud rechazada","check","var(--label-2)"); openSheet();
    });
    // aceptar invitación a una tarea compartida: se añade a tu lista al instante
    // (y a la del que te invitó, en cuanto sincronice); igual que aceptar amistad.
    $$("#ntList [data-accept-shared]").forEach(b=> b.onclick=async (e)=>{ e.stopPropagation(); haptic(15);
      const nid=b.getAttribute("data-accept-shared"), sid=b.getAttribute("data-shared-id");
      b.textContent="Aceptando…"; b.disabled=true;
      const row = sid ? await Cloud.fetchSharedOne(sid) : null;
      const ok = row && await Cloud.acceptShared(sid);
      if(ok){
        const myId=Cloud.myId(), amOwner=row.owner_id===myId;
        Store.update(s=>{
          if(!s.tasks.some(t=>t.sharedId===sid)){
            s.tasks.unshift(Object.assign({ id:sid, title:row.title, desc:row.descr||"", category:row.category, minutes:row.minutes||10, people:row.people||1,
              urgent:!!row.urgent, recurrence:row.recurrence||{type:'once',days:[]}, onlyOnDays:!!row.only_on_days,
              random:false, createdAt:Date.now(), done:false, lastDone:null,
              shared:true, sharedId:sid, ownerId:row.owner_id, partnerId:amOwner?row.partner_id:row.owner_id, partnerName:amOwner?row.partner_name:row.owner_name },
              defaultDueFields(row.recurrence)));
          }
          s.notifs=(s.notifs||[]).filter(n=>n.id!==nid);
        });
        Cloud.clearNotif(nid); updateBadge();
        UI.toast("Tarea añadida a tu lista","check","var(--green)"); if(UI.renderTasks) UI.renderTasks(); openSheet();
      } else { b.textContent="Aceptar"; b.disabled=false; UI.toast("No se pudo aceptar","bell","var(--red)"); }
    });
    // rechazar invitación a una tarea compartida: solo borra el aviso, sin
    // afectar a ninguna lista (ni la tuya ni la del que te invitó).
    $$("#ntList [data-reject-shared]").forEach(b=> b.onclick=async (e)=>{ e.stopPropagation(); haptic();
      const nid=b.getAttribute("data-reject-shared"), sid=b.getAttribute("data-shared-id");
      if(sid) await Cloud.rejectShared(sid);
      Cloud.clearNotif(nid); Store.update(s=>{ s.notifs=(s.notifs||[]).filter(n=>n.id!==nid); }); updateBadge();
      UI.toast("Invitación rechazada","check","var(--label-2)"); openSheet();
    });
    // abrir la tarea (foto + comentarios) desde el aviso, sin disparar al pulsar la ✕.
    // Se abre EXACTAMENTE igual que desde el calendario: el propio aviso ya trae
    // la línea de detalle (hora · categoría · puntos), así que se ve igual aunque
    // el destinatario no tenga esa completada en su historial (p.ej. la tarea de
    // un amigo no compartida contigo). Si el aviso es antiguo y no la trae (antes
    // de esta versión), se busca como respaldo en el historial local.
    $$("#ntList [data-photo]").forEach(c=> c.onclick=(e)=>{ if(e.target.closest(".notif-del")) return;
      const key=c.getAttribute("data-key")||null;
      const time=c.getAttribute("data-time")||"", category=c.getAttribute("data-category")||"", ptsAttr=c.getAttribute("data-points");
      let meta = (time||category||ptsAttr) ? { time, category, points: ptsAttr!==""?Number(ptsAttr):null } : {};
      let title = c.getAttribute("data-title");
      if(!time && !category && ptsAttr===""){
        const h=key ? (Store.get().history||[]).find(x=> String(x.sharedId||x.id)===String(key)) : null;
        if(h){ meta={ time:h.time, category:h.category, points:h.points }; title=h.title||title; }
      }
      Lightbox.show(c.getAttribute("data-photo"), { title, key, ownerId:c.getAttribute("data-owner")||null, ...meta }); });
    // abrir el resumen de la semana directamente desde el aviso
    $$("#ntList [data-open-week-summary]").forEach(c=> c.onclick=(e)=>{ if(e.target.closest(".notif-del")) return;
      openWeekSummarySheet(weeklySummaryFor(Store.get().history), {mine:true}); });
    // marcar como leídas
    Cloud.markNotifsRead(); Store.update(s=>{ (s.notifs||[]).forEach(n=>n.read=true); }); updateBadge();
  }
  function init(){ const b=$("#notifBtn"); if(b) b.onclick=openSheet; updateBadge(); }
  return { init, refresh, openSheet, updateBadge };
})();
/* ---------------------------------------------------------------------
   GEMAS DE LIGA
   Cada rango es un mineral distinto. El reparto de trabajo entre forma y
   color es deliberado: a 14 px las facetas interiores desaparecen, así que
   quien distingue la liga de un vistazo es el COLOR; a tamaño grande son las
   facetas las que cuentan la progresión (piedra sin tallar → tallada → con
   destello). Si lo fiara todo a la forma, el icono pequeño sería ilegible;
   si lo fiara todo al color, el grande no diría nada.
   --------------------------------------------------------------------- */
const GEMS = [
  {name:"Piedra",    color:"#7C838E", hi:"#A7AEB9"},
  {name:"Bronce",    color:"#C07A38", hi:"#E8A868"},
  {name:"Plata",     color:"#AFB9C7", hi:"#E8EFF7"},
  {name:"Oro",       color:"#DFAE35", hi:"#FBE083"},
  {name:"Esmeralda", color:"#2FB177", hi:"#7BE8B6"},
  {name:"Rubí",      color:"#D8425D", hi:"#FF8598"},
  {name:"Diamante",  color:"#57C9E2", hi:"#C2F2FB"}
];
const gemFor = (i)=> GEMS[Math.max(0, Math.min(GEMS.length-1, i|0))];
function gemSvg(i){
  const g = gemFor(i), n = Math.max(0, Math.min(GEMS.length-1, i|0));
  // Sin tallar: un pedrusco. Es el único asimétrico, y esa silueta irregular
  // es lo que lo separa de las gemas incluso a 14 px, donde no se ve otra cosa.
  if(n===0) return `<svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M7.6 4.4 14.2 3.5 20.4 7.9 18.4 15.4 11.4 20.3 4 15.1 2.9 8.9Z"
          fill="${g.color}" stroke="${g.hi}" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
  // Tallada. Cuantas más facetas, más alta la liga.
  const f = [];
  if(n>=1) f.push("M2.4 9.4H21.6");                    // mesa
  if(n>=3) f.push("M8 9.4 12 20.8","M16 9.4 12 20.8"); // pabellón
  if(n>=5) f.push("M5.4 4 8 9.4","M18.6 4 16 9.4");    // corona
  const spark = n>=6
    ? `<path d="M19.7 1.6l.62 1.72 1.72.62-1.72.62-.62 1.72-.62-1.72-1.72-.62 1.72-.62z" fill="#fff" opacity=".92"/>`
    : "";
  return `<svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M5.4 4H18.6L21.6 9.4L12 20.8L2.4 9.4Z"
          fill="${g.color}" stroke="${g.hi}" stroke-width="1.2" stroke-linejoin="round"/>
    ${f.length?`<g stroke="${g.hi}" stroke-width="1" stroke-linecap="round" fill="none" opacity=".7"><path d="${f.join(" ")}"/></g>`:""}
    ${spark}</svg>`;
}

/* =====================================================================
   TRANSFERENCIA — mover la cuenta y los datos a otra instalación.
   iOS aísla el almacenamiento por ícono: al borrar el ícono de la pantalla
   de inicio se pierden la sesión anónima y los datos locales. El código de
   transferencia lleva la sesión (tokens) + el estado local (tareas,
   historial sin fotos); al restaurarlo en la instalación nueva se recupera
   la MISMA cuenta y las fotos se re-enlazan desde la nube (Storage).
   ===================================================================== */
async function makeTransferCode(){
  // Si la sesión de nube está muerta (p. ej. instalación vieja tras una
  // transferencia), el código se crea igual SOLO CON LOS DATOS: al restaurarlo
  // en otra instalación, se fusiona con la cuenta de allí (rescate del
  // historial sin sesión).
  const t=await Cloud.exportSession();
  let luid=Cloud.myId(); if(!luid){ try{ luid=localStorage.getItem("rachas_uid"); }catch(e){} }
  const s=Store.get();
  const payload={ v:1, uid:luid||null, at:t?t.access_token:null, rt:t?t.refresh_token:null,
    st:{ name:s.profile.name, tasks:s.tasks, penalties:s.penalties||0, deletedShared:s.deletedShared||[],
         // La lista de amigos viaja en el código (además de re-bajarse de la
         // nube al restaurar): así no se pierde aunque la sincronización falle.
         friends:s.friends||[],
         // sin photoId: las fotos locales no viajan en el código; se re-enlazan
         // desde la nube (photo_url) al restaurar.
         history:(s.history||[]).map(h=>{ const {photoId, ...rest}=h; return rest; }) } };
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(payload)))); }catch(e){ return null; }
}
async function restoreFromCode(code){
  let p=null;
  try{ p=JSON.parse(decodeURIComponent(escape(atob((code||"").trim())))); }catch(e){}
  if(!p || p.v!==1 || !p.st) return { ok:false, error:"Código no válido" };
  // ---- Código SOLO DE DATOS (sin sesión): fusiona el historial/tareas/amigos
  // con la cuenta de ESTA instalación y re-sube todo a su nube. Es el rescate
  // para cuando la instalación vieja perdió la sesión pero conserva los datos.
  if(!p.rt){
    const st=p.st||{};
    Store.update(s=>{
      const have=new Set((s.history||[]).map(h=>h.id));
      (Array.isArray(st.history)?st.history:[]).forEach(h=>{ if(h && h.id && !have.has(h.id)){ const {photoId, ...rest}=h; s.history.push(rest); } });
      s.history.sort((a,b)=> ((a.date||"")+(a.time||"")) > ((b.date||"")+(b.time||"")) ? -1 : 1);
      const haveT=new Set((s.tasks||[]).map(t=>t.id));
      (Array.isArray(st.tasks)?st.tasks:[]).forEach(t=>{ if(t && t.id && !haveT.has(t.id)) s.tasks.push(t); });
      const haveF=new Set((s.friends||[]).map(f=>f.cloudId||f.id));
      (Array.isArray(st.friends)?st.friends:[]).forEach(f=>{ if(f && !haveF.has(f.cloudId||f.id)) s.friends.push(f); });
    });
    Store.load();          // recalcula puntos y racha con el historial fusionado
    Tasks.render(); Profile.render();
    if(Cloud.enabled()){ Cloud.forceResync(); Friends.syncFriends(); } // sube TODO a la cuenta actual
    return { ok:true };
  }
  if(!p.uid) return { ok:false, error:"Código no válido" };
  if(!await Cloud.init()) return { ok:false, error:"Necesitas conexión a internet" };
  // 1) cambiar PRIMERO la sesión de esta instalación a la cuenta antigua: sus
  //    datos ya no son legibles desde fuera (las políticas exigen ser el dueño
  //    o su amigo), así que hay que "ser" esa cuenta para poder leerlos.
  const ok=await Cloud.restoreSession({ access_token:p.at, refresh_token:p.rt });
  if(!ok) return { ok:false, error:"El código expiró o ya se usó. Genera uno nuevo en la instalación vieja justo antes de transferir." };
  // 2) ya con su sesión, leer sus datos en la nube (perfil + completadas)
  const prof=await Cloud.pullFriend(p.uid);
  // 3) reconstruir el estado local: base = lo que viajó en el código; las fotos
  //    y las completadas que falten se completan desde la nube.
  const st=p.st||{};
  Store.update(s=>{
    s.profile.name = st.name || (prof&&prof.name) || s.profile.name;
    s.tasks = Array.isArray(st.tasks)? st.tasks : [];
    const hist = Array.isArray(st.history)? st.history.slice() : [];
    const byId={}; hist.forEach(h=>{ if(h&&h.id) byId[h.id]=h; });
    ((prof&&prof.history)||[]).forEach(c=>{
      if(byId[c.id]){ if(c.photoUrl){ byId[c.id].photoUrl=c.photoUrl; delete byId[c.id].photoId; } }
      else hist.push({ id:c.id, taskId:null, title:c.title, category:c.category, minutes:0, points:c.points||0,
        random:!!c.random, date:c.date, time:c.time||"", photoUrl:c.photoUrl||null,
        shared:!!c.partnerId, partnerName:c.partnerName||"", partnerId:c.partnerId||null, sharedId:c.sharedId||null });
    });
    hist.sort((a,b)=> ((a.date||"")+(a.time||"")) > ((b.date||"")+(b.time||"")) ? -1 : 1); // recientes primero
    s.history = hist;
    s.penalties = st.penalties||0;
    s.deletedShared = Array.isArray(st.deletedShared)? st.deletedShared : [];
    const cloudIds=new Set(((prof&&prof.history)||[]).map(c=>c.id));
    s.cloud = { syncedCompletions: hist.filter(h=>cloudIds.has(h.id)).map(h=>h.id),
      avatarUrl:(prof&&prof.avatar)||null, avatarSrc:null };
    // amigos: se restauran del código (si lo trae) y luego syncFriends los
    // refresca/reconcilia desde la nube; así no desaparecen si la sync falla.
    s.friends = Array.isArray(st.friends) ? st.friends : [];
    s.notifs=[]; s.notifSeen=[]; // los avisos se re-descargan de la cuenta
  });
  // avatar: re-descargarlo de la nube para verlo también sin conexión
  if(prof && prof.avatar){
    try{
      const blob=await (await fetch(prof.avatar)).blob();
      const du=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.onerror=()=>r(null); fr.readAsDataURL(blob); });
      if(du) Store.update(s=>{ s.profile.avatar=du; s.cloud.avatarSrc=du; });
    }catch(e){}
  }
  Store.load();          // recalcula puntos y racha desde el historial restaurado
  Tasks.render(); Profile.render();
  Friends.syncFriends(); Tasks.syncShared(); Notifs.refresh();
  Cloud.ensurePush(); // suscripción push de ESTE dispositivo
  // Sube TODO automáticamente a la nube (perfil + historial completo) para que
  // tus amigos vean el calendario entero — sin que el usuario haga nada.
  Cloud.forceResync();
  return { ok:true };
}
/* La hoja se abre AL INSTANTE y luego se rellena. Esperar a la nube antes de
   dibujar nada hacía que, con mala cobertura, tocar "Cuenta" no hiciera
   aparentemente nada: el botón parecía roto. */
function openAccountSheet(){
  renderAccountSheet({ signed:false, email:null, checking:true });
  // Si la nube no contesta en 6 s se asume "sin sesión" y se ofrece entrar:
  // dejar la hoja en "Comprobando…" para siempre no ayuda a nadie.
  Promise.race([ Account.info(), new Promise(r=>setTimeout(()=>r({signed:false,email:null}),6000)) ])
    .then(a=>{ if($("#acSheetMark")) renderAccountSheet(a); })
    .catch(()=>{});
}
function renderAccountSheet(a){

    <div class="sheet-body"><span id="acSheetMark" hidden></span>`;

    Sheets.show(head + `

      <div class="hint" style="text-align:center;margin-bottom:18px">

      </div>
      <div class="hint">Al cerrar sesión, este móvil deja de recibir cambios. Tus datos siguen en la cuenta.</div>

    $("#acOut").onclick = async ()=>{ haptic(); await Account.signOut();
      Sheets.close(); UI.toast("Sesión cerrada","check","var(--label-2)"); };
  } else {
    Sheets.show(head + `
      <div class="segmented" id="acMode" style="margin-bottom:18px">
        <div class="seg sel" data-m="up">Crear cuenta</div>
        <div class="seg" data-m="in">Iniciar sesión</div>
      </div>
      <div class="form-group">
        <div class="field-block"><input class="field" id="acEmail" type="email" inputmode="email"
             autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="Correo electrónico"/></div>
        <div class="field-block"><input class="field" id="acPass" type="password"
             autocomplete="current-password" placeholder="Contraseña (mínimo 6)"/></div>
      </div>
      <div class="hint" id="acHint">${a.checking?"Comprobando si ya has iniciado sesión…":"Tus datos de este móvil pasarán a esta cuenta; no se pierde nada."}</div>
      <button class="btn" id="acGo" style="margin-top:18px" disabled>Crear cuenta</button>
      <button class="btn ghost" id="acForgot" style="margin-top:8px">He olvidado la contraseña</button>
    </div>`);
    let mode="up";
    const em=$("#acEmail"), pw=$("#acPass"), go=$("#acGo"), hint=$("#acHint");
    const validate=()=>{ go.disabled = !/^\S+@\S+\.\S+$/.test(em.value.trim()) || pw.value.length<6; };
    [em,pw].forEach(i=> i.addEventListener("input", validate));
    $$(".seg",$("#acMode")).forEach(el=> el.onclick=()=>{
      mode=el.getAttribute("data-m"); haptic();
      $$(".seg",$("#acMode")).forEach(x=>x.classList.toggle("sel",x===el));
      go.textContent = mode==="up" ? "Crear cuenta" : "Iniciar sesión";
      hint.textContent = mode==="up"
        ? "Tus datos de este móvil pasarán a esta cuenta; no se pierde nada."
        : "Se traerán los datos de esa cuenta y sustituirán a los de este móvil.";
      validate();
    });
    go.onclick = async ()=>{
      const email=em.value.trim(), pass=pw.value;
      go.disabled=true; go.textContent="Un momento…"; haptic(12);
      const r = mode==="up" ? await Account.signUp(email,pass) : await Account.signIn(email,pass);
      if(r.ok){
        Sheets.close();
        UI.toast(r.msg,"check","var(--green)");
        if(typeof Tasks!=="undefined" && Tasks.render) Tasks.render();
        if(UI.renderProfile) UI.renderProfile();
      } else {
        go.disabled=false; go.textContent = mode==="up"?"Crear cuenta":"Iniciar sesión";
        UI.toast(r.msg,"check","var(--red)");
      }
    };
    $("#acForgot").onclick = async ()=>{
      const email=em.value.trim();
      if(!/^\S+@\S+\.\S+$/.test(email)){ UI.toast("Escribe primero tu correo","check","var(--red)"); return; }
      haptic(); const r=await Account.reset(email);
      UI.toast(r.msg,"check", r.ok?"var(--green)":"var(--red)");
    };
    setTimeout(()=>{ try{ em.focus({preventScroll:true}); }catch(_){ em.focus(); } },350);
  }
  $("#acClose").onclick = Sheets.close;
  $("#acBack").onclick  = ()=>{ haptic(); openSettingsSheet(); };

function openSettingsSheet(){
  const hasN = ("Notification" in window);
  const denied = hasN && Notification.permission==="denied";
  const notifOn = hasN && Notification.permission==="granted" && localStorage.getItem("rachas_notif")!=="off";
  const cs = Cloud.state ? Cloud.state() : { connected:true };
  const cloudSub = cs.connected ? 'Conectada · tus amigos ven tus avances'
                 : (cs.superseded ? 'Cuenta transferida a otra instalación · toca para usarla AQUÍ'
                 : (cs.disconnected ? 'SIN CONEXIÓN · tus amigos no ven tus avances' : 'Conectando…'));
  Sheets.show(`
    <div class="grabber"></div>
    <div class="sheet-head"><span class="act" style="opacity:0">•</span><span class="title">Ajustes</span><span class="act" id="setClose">Cerrar</span></div>
    <div class="sheet-body">
      <div class="settings-list">
        <button class="settings-row tappable" id="setAccount">
          <span class="sr-ic emoji">👤</span>
          <div class="sr-info"><div class="sr-t">Cuenta</div><div class="sr-s" id="setAccountSub">Comprobando…</div></div>
          <span class="sr-chev">›</span>
        </button>
        <div class="settings-row">
          <span class="sr-ic emoji">🔔</span>
          <div class="sr-info"><div class="sr-t">Notificaciones</div><div class="sr-s">${denied?'Bloqueadas en iOS · actívalas en Ajustes › esta app':'Avisos de amigos y recordatorios'}</div></div>
          <div class="switch${notifOn?' on':''}" id="setNotif"><div class="knob"></div></div>
        </div>
        <button class="settings-row tappable" id="setCloud">
          <span class="sr-ic emoji">☁️</span>
          <div class="sr-info"><div class="sr-t">Nube</div><div class="sr-s" id="setCloudSub" style="${cs.disconnected?'color:var(--red);font-weight:600;':(cs.superseded?'color:var(--orange);font-weight:600;':'')}">${cloudSub}</div></div>
          <span class="sr-chev">›</span>
        </button>
        <button class="settings-row tappable" id="setTestPush">
          <span class="sr-ic emoji">🧪</span>
          <div class="sr-info"><div class="sr-t">Probar notificación</div><div class="sr-s" id="setTestSub">Comprueba la cadena completa del push</div></div>
          <span class="sr-chev">›</span>
        </button>
        <button class="settings-row tappable" id="setRem">
          <span class="sr-ic emoji">🛎️</span>
          <div class="sr-info"><div class="sr-t">Recordatorios</div><div class="sr-s" id="setRemSub">Comprobando…</div></div>
          <span class="sr-chev">›</span>
        </button>
        <button class="settings-row tappable" id="setTransfer">
          <span class="sr-ic emoji">↔️</span>
          <div class="sr-info"><div class="sr-t">Transferir datos</div><div class="sr-s">Mueve tu cuenta a otra instalación</div></div>
          <span class="sr-chev">›</span>
        </button>
      </div>
    </div>`);
  // Estado en vivo de la suscripción push de ESTE dispositivo (bajo "Probar").
  (async ()=>{ try{
    const el=$("#setTestSub"); if(!el) return;
    if(!("serviceWorker" in navigator) || !("PushManager" in window)){ el.textContent="Push no disponible en este navegador"; return; }
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    el.textContent = sub ? "Dispositivo suscrito ✅ · toca para enviarte una prueba"
                         : "⚠️ Este dispositivo NO está suscrito · activa Notificaciones arriba";
  }catch(e){} })();
  $("#setClose").onclick=Sheets.close;
  // El estado de la cuenta se pregunta a la nube, no se adivina.
  (async ()=>{ try{
    const a = await Account.info(); const el=$("#setAccountSub"); if(!el) return;
    el.textContent = a.signed ? a.email : "Sin correo · tus datos solo viven en este móvil";
    if(!a.signed) el.style.color = "var(--orange)";
  }catch(e){} })();
  $("#setAccount").onclick = ()=>{ haptic(); openAccountSheet(); };
  $("#setCloud").onclick=async ()=>{
    haptic();
    const st=Cloud.state();
    if(st.connected){
      // Conectada: el toque fuerza una RE-SUBIDA COMPLETA (perfil + historial +
      // fotos). Útil si a tus amigos les falta parte de tu calendario.
      const sub=$("#setCloudSub"); if(sub) sub.textContent="Re-subiendo todo tu calendario…";
      UI.toast("Re-subiendo todo…","check","var(--blue)");
      try{ await Cloud.forceResync(); }catch(e){}
      if(sub) sub.textContent="Conectada · tus amigos ven tus avances";
      UI.toast("Calendario re-subido ✅","check","var(--green)");
      return;
    }
    const sub=$("#setCloudSub");
    if(st.superseded){
      // La cuenta se usa en otra instalación: reclamarla AQUÍ (la otra se
      // retirará sola la próxima vez que se abra).
      if(sub) sub.textContent="Reclamando cuenta…";
      const id=await Cloud.reclaimHere();
      if(id){ if(sub){ sub.textContent="Conectada · tus amigos ven tus avances"; sub.style.color=""; sub.style.fontWeight=""; }
        UI.toast("Cuenta activa en esta instalación ✅","check","var(--green)"); return; }
      if(sub) sub.textContent="No se pudo reclamar (sesión perdida)";
      openCloudRecoverySheet(); return;
    }
    if(sub) sub.textContent="Reconectando…";
    const id=await Cloud.reconnect();
    if(id){ if(sub){ sub.textContent="Conectada · tus amigos ven tus avances"; sub.style.color=""; sub.style.fontWeight=""; }
      UI.toast("Nube reconectada ✅","check","var(--green)"); return; }
    if(sub) sub.textContent="SIN CONEXIÓN · no se pudo reconectar";
    openCloudRecoverySheet();
  };
  const sw=$("#setNotif");
  sw.onclick=async ()=>{
    haptic();
    if(sw.classList.contains("on")){
      // apagar
      sw.classList.remove("on");
      localStorage.setItem("rachas_notif","off");
      await Cloud.disablePush();
    } else {
      if(denied){ UI.toast("Bloqueadas en Ajustes de iOS","bell","var(--red)"); return; }
      localStorage.setItem("rachas_notif","on");
      const ok=await Cloud.ensurePush();   // dispara el permiso push + suscribe
      if(ok){ sw.classList.add("on"); try{ Tasks.scheduleReminders(); Cloud.syncAllReminders(); }catch(e){} UI.toast("Notificaciones activadas","check","var(--green)"); }
      else { localStorage.setItem("rachas_notif","off"); UI.toast("No se pudieron activar","bell","var(--red)"); }
    }
  };
  $("#setTransfer").onclick=()=>{ haptic(); openTransferSheet(); };
  $("#setTestPush").onclick=async ()=>{
    haptic();
    const el=$("#setTestSub"); if(el) el.textContent="Enviando prueba…";
    const r=await Cloud.testPush();
    if(r && r.ok && r.sent>0){ if(el) el.textContent=`Prueba enviada a ${r.sent} dispositivo(s) · debería sonar YA`; UI.toast("Prueba enviada ✅","check","var(--green)"); }
    else if(r && r.ok){ if(el) el.textContent="⚠️ La función respondió pero no hay dispositivos suscritos"; UI.toast("Sin dispositivos suscritos","bell","var(--red)"); }
    else { if(el) el.textContent="❌ "+((r&&r.error)||"falló el envío"); UI.toast("Prueba fallida: "+((r&&r.error)||""),"bell","var(--red)"); }
  };
  // Estado de los recordatorios en la NUBE (los que envía el cron): cuántos hay
  // registrados vs cuántas tareas locales tienen recordatorio. Toque = re-subir.
  const localRem = ()=> (Store.get().tasks||[]).filter(t=>t.reminder && t.reminder.time).length;
  const refreshRemRow = async ()=>{
    const el=$("#setRemSub"); if(!el) return;
    const rows=await Cloud.listReminders();
    const loc=localRem();
    if(rows===null){ el.textContent="Sin conexión con la nube"; return; }
    if(loc===0 && rows.length===0){ el.textContent="No tienes tareas con recordatorio"; return; }
    el.textContent = rows.length>=loc
      ? `${rows.length} registrados en la nube ✅ (${loc} locales)`
      : `⚠️ ${rows.length} en la nube de ${loc} locales · toca para re-subirlos`;
  };
  refreshRemRow();
  $("#setRem").onclick=async ()=>{
    haptic();
    const el=$("#setRemSub"); if(el) el.textContent="Re-subiendo recordatorios…";
    try{ await Cloud.syncAllReminders(); }catch(e){}
    await refreshRemRow();
    UI.toast("Recordatorios re-sincronizados","check","var(--green)");
  };
}
// La sesión de nube es irrecuperable: explica las opciones y deja elegir.

  Sheets.show(`
