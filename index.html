function bellSvg(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 004 0"/></svg>';}
function commentSvg(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.5 7.2L4 20l1-4.5A8 8 0 1121 12z"/></svg>';}
function noPhotoThumb(){return '<div style="width:100%;height:100%;display:grid;place-items:center;color:var(--label-3)"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="8.5" cy="10" r="1.6"/><path d="M5 18l5-4 3 2.5"/></svg></div>';}
// Resumen del título para listas: si es muy largo (>10 palabras) deja una frase
// corta identificativa con puntos suspensivos. El título completo se conserva aparte.
function shortTitle(s, maxWords=10, keep=7){
  const words=(s||"").trim().split(/\s+/);
  if(words.length<=maxWords) return s;
  return words.slice(0,keep).join(" ")+"…";
}

/* Lightbox */
const Lightbox = (() => {
  const box=$("#lightbox"), img=$("#lbImg"), t=$("#lbTitle"), m=$("#lbMeta");
  const scroll=$("#lbScroll"), cWrap=$("#lbComments"), cList=$("#lbCList"), cInput=$("#lbCInput"), cSend=$("#lbCSend");
  let curKey=null, curGen=0, curOwner=null, curPhoto=null, pollTimer=null, lastSig="";
  function ago(iso){ try{ const d=(Date.now()-new Date(iso).getTime())/1000;
    if(d<60) return "ahora"; if(d<3600) return `hace ${Math.floor(d/60)} min`;
    if(d<86400) return `hace ${Math.floor(d/3600)} h`; return `hace ${Math.floor(d/86400)} d`; }catch(e){ return ""; } }
  function avatarHtml(c){
    if(c.avatar) return `<div class="lb-c-av"><img src="${esc(c.avatar)}" alt=""></div>`;
    return `<div class="lb-c-av">${esc((c.author_name||"A").trim().charAt(0).toUpperCase()||"A")}</div>`;
  }
  function renderComments(list){
    if(!list || !list.length){ cList.innerHTML=`<div class="lb-c-empty">Sé el primero en comentar.</div>`; return; }
    cList.innerHTML=list.map(c=>`
      <div class="lb-c-item">
        ${avatarHtml(c)}
        <div class="lb-c-body">
          <div class="lb-c-head"><span class="a">${esc(c.author_name||"Alguien")}</span><span class="lb-c-streak">🔥 ${c.streak||0}</span></div>
          <div class="x">${esc(c.text||"")}</div>
          <div class="when">${ago(c.created_at)}${c.mine?` · <span class="lb-c-del" data-cid="${esc(c.id)}">Borrar</span>`:""}</div>
        </div>
      </div>`).join("");
    $$(".lb-c-del",cList).forEach(b=> b.onclick=async ()=>{ haptic(); await Cloud.deleteComment(b.getAttribute("data-cid")); load(curKey, curGen); });
  }
  async function load(key, gen){
    if(!cList.children.length) cList.innerHTML=`<div class="lb-c-empty">Cargando…</div>`;
    const list=await Cloud.fetchComments(key);
    if(gen!==curGen) return;
    const sig=JSON.stringify(list.map(c=>[c.id,c.text,c.author_name,c.avatar,c.streak]));
    if(sig!==lastSig){ lastSig=sig; renderComments(list); } // solo re-pinta si cambió (evita parpadeo)
  }
  function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
  function show(data,h){
    h=h||{};
    img.src=data; t.textContent=h.title||"";
    m.textContent=[h.time,h.category,(h.points!=null?h.points+" pts":"")].filter(Boolean).join(" · ");
    box.classList.add("show"); haptic();
    if(scroll) scroll.scrollTop=0;
    curKey = (h.sharedId || h.id || h.key) || null; // clave de la completada
    curOwner = h.ownerId || null; curPhoto = (typeof data==="string" && data.indexOf("http")===0) ? data : (h.photoUrl||null);
    curGen++; lastSig=""; cList.innerHTML="";
    stopPoll();
    if(curKey && Cloud.enabled()){
      cWrap.style.display="block"; load(curKey, curGen);
      // actualización automática en vivo (foto/racha/nuevos comentarios al instante)
      const g=curGen; pollTimer=setInterval(()=>{ if(g!==curGen || !box.classList.contains("show")){ stopPoll(); return; } load(curKey, g); }, 5000);
    } else { cWrap.style.display="none"; }
  }
  function hide(){ box.classList.remove("show"); curKey=null; curOwner=null; curGen++; stopPoll(); if(cInput) cInput.value="";
    // limpiar la foto/comentarios anteriores para que al abrir otra tarea NO se
    // vea por un instante la que se abrió antes (evita el "arrastre" visual).
    img.removeAttribute("src"); t.textContent=""; m.textContent=""; if(cList) cList.innerHTML=""; lastSig=""; }
  $("#lbClose").onclick=hide;
  box.onclick=(e)=>{ if(e.target===box) hide(); };
  async function send(){
    const txt=(cInput.value||"").trim(); if(!txt || !curKey) return;
    cInput.value=""; cInput.blur();
    const key=curKey, gen=curGen;
    const ok=await Cloud.addComment(key, txt, curOwner);
    if(!ok){ UI.toast("No se pudo comentar","bell","var(--red)"); }
    if(gen===curGen) load(key, gen);
  }
  if(cSend) cSend.onclick=send;
  if(cInput) cInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ e.preventDefault(); send(); } });
  return { show, hide };
})();

/* =====================================================================
   ROUTER — navegación instantánea entre vistas + título compacto
   ===================================================================== */
const Router = (() => {
  let cur="tasks";
  const views={gen:"#view-gen",tasks:"#view-tasks",profile:"#view-profile"};

  function go(name){
    if(name===cur) { scrollTop(); return; }
    cur=name; haptic();
    Object.entries(views).forEach(([k,sel])=> $(sel).classList.toggle("active",k===name));
    $$(".tab").forEach(t=> t.classList.toggle("active", t.getAttribute("data-view")===name));
    $("#fab").classList.toggle("show", name==="tasks");
    updateTopbar();
    if(name==="tasks") Tasks.render();
    if(name==="profile"){ Profile.render(); Profile.animate(); }
    scrollTop();
  }
  function scrollTop(){ const v=$(views[cur]); if(v) v.scrollTop=0; updateTopbar(); }

  function updateTopbar(){
    const v=$(views[cur]);
    // nombre de la sección (aparece a la izquierda del botón al hacer scroll)
    $("#tbTitle").textContent = v.getAttribute("data-title");
    // botón de la sección: notificaciones en Tareas, amigos en Perfil, ninguno
    // en Generador. Solo se muestra el que corresponde a la sección activa.
    $("#notifBtn").style.display   = cur==="tasks"   ? "grid" : "none";
    $("#friendsBtn").style.display = cur==="profile" ? "grid" : "none";
    $("#settingsBtn").style.display= cur==="profile" ? "grid" : "none";
    $("#tbGroup").style.display    = cur==="tasks"   ? "flex" : "none";
    // el nombre aparece al hacer scroll; al cambiar de sección la vista nueva
    // empieza arriba, así que se sincroniza aquí para que no quede "pegado".
    $("#topbar").classList.toggle("scrolled", v.scrollTop>30);
  }
  function onScroll(){
    $("#topbar").classList.toggle("scrolled", $(views[cur]).scrollTop>30);
  }
  /* Menú de vista. Se construye cada vez que se abre para que las marcas
     reflejen el estado real, y se cierra al elegir o al tocar fuera. */
  function buildMenu(){
    const check = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`;
    const gridIc = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></svg>`;
    const listIc = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.1" fill="currentColor" stroke="none"/></svg>`;
    const row = (on,ic,lbl,attr,extra="") =>
      `<button class="vm-item" ${attr}><span class="vm-check">${on?check:""}</span><span class="vm-ic">${ic}</span><span class="vm-lbl">${lbl}</span>${extra}</button>`;
    return row(View.mode==="grid", gridIc, "Cuadrícula", 'data-set="mode" data-val="grid"')
         + row(View.mode==="list", listIc, "Lista",      'data-set="mode" data-val="list"')
         + `<div class="vm-sep"></div>`
         + row(false, "", "Orden: "+esc(View.sortLabel()), 'data-sort="1"', '<span class="vm-chev">›</span>');
  }
  function buildSortMenu(){
    const check = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`;
    return `<button class="vm-item" data-back="1"><span class="vm-check"></span><span class="vm-ic"><span class="vm-chev">‹</span></span><span class="vm-lbl">Orden</span></button>`
         + `<div class="vm-sep"></div>`
         + View.SORTS.map(([k,l])=>
            `<button class="vm-item" data-set="sort" data-val="${k}"><span class="vm-check">${View.sort===k?check:""}</span><span class="vm-ic"></span><span class="vm-lbl">${esc(l)}</span></button>`).join("");
  }
  function openMenu(html){
    const m=$("#vmenu"), sc=$("#vmenuScrim");
    m.innerHTML = html || buildMenu();
    sc.classList.add("show"); m.classList.add("show"); haptic();
    sc.onclick = closeMenu;
    $$(".vm-item",m).forEach(b=> b.onclick = ()=>{
      if(b.getAttribute("data-sort")){ haptic(); openMenu(buildSortMenu()); return; }
      if(b.getAttribute("data-back")){ haptic(); openMenu(buildMenu()); return; }
      const k=b.getAttribute("data-set"), t=b.getAttribute("data-toggle");
      if(k) View.set(k, b.getAttribute("data-val"));
      if(t) View.set(t, !View[t]);
      haptic(); closeMenu(); Tasks.render();
    });
  }
  function closeMenu(){ $("#vmenu").classList.remove("show"); $("#vmenuScrim").classList.remove("show"); }

  function init(){
    $$(".tab").forEach(t=> t.onclick=()=> go(t.getAttribute("data-view")) );
    $("#addBtn").onclick = ()=>{ haptic(); Tasks.openCreate(); };
    $("#viewBtn").onclick = ()=>{ openMenu(); };
    Object.values(views).forEach(sel=> $(sel).addEventListener("scroll", onScroll, {passive:true}));
    $("#fab").classList.toggle("show", cur==="tasks");
    updateTopbar();
  }
  return { init, go };
})();

/* =====================================================================
   VISTA — cómo se mira la lista (cuadrícula/lista, completadas, orden)
   Se guarda aparte del estado de las tareas: es una preferencia de quien
   mira, no un dato de lo que hay que hacer.
   ===================================================================== */
const View = (() => {
  const KEY="rachas_view_v1";
  const def={ mode:"grid", sort:"due" };
  let v;
  try{ v = Object.assign({}, def, JSON.parse(localStorage.getItem(KEY))||{}); }
  catch(e){ v = Object.assign({}, def); }
  const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(v)); }catch(e){} };
  const SORTS = [["due","Fecha de vencimiento"],["name","Nombre"],["created","Creación"]];
  return {
    get mode(){return v.mode;}, get sort(){return v.sort;},
    sortLabel(){ return (SORTS.find(x=>x[0]===v.sort)||SORTS[0])[1]; },
    SORTS,
    set(k,val){ v[k]=val; save(); }
  };
})();

   INIT
   ===================================================================== */
// Activa las notificaciones automáticamente al abrir la app. Si ya hay permiso,
// solo (re)registra la suscripción. Si aún no se decidió, iOS exige un gesto del
// usuario para mostrar el aviso, así que se pide en el PRIMER toque (instantáneo
// al empezar a usar la app). Si está bloqueado, no se insiste.
function autoEnablePush(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="granted"){ Cloud.ensurePush(); return; }
  if(Notification.permission!=="default") return; // "denied": no molestar
  const ask=()=>{
    document.removeEventListener("pointerdown",ask);
    document.removeEventListener("touchstart",ask);
    document.removeEventListener("click",ask);
    Cloud.ensurePush();
  };
  document.addEventListener("pointerdown",ask,{once:true,passive:true});
  document.addEventListener("touchstart",ask,{once:true,passive:true});
  document.addEventListener("click",ask,{once:true});
}
// Versión + diagnóstico de pantalla EN VIVO: modo real, inset inferior
// aplicado (env(safe-area-inset-bottom), en px) y cobertura del viewport
// (alto de la ventana / alto de la pantalla). En pantalla completa sana
// debería leerse "standalone · inf 34px · 844/844" (o equivalente en cada
// iPhone); si la ventana baja de la altura de la pantalla DURANTE el uso,
// algo (una recarga, una restauración del sistema) encogió el webview.
let SAFE_TOP=0;   // inset superior real (barra de estado), lo mide updateDiag
function updateDiag(){
  const av=document.getElementById("appVersion"); // si no existe, igual se aplica la corrección
  let mode="navegador";
  try{
    ["standalone","fullscreen","minimal-ui"].forEach(m=>{ if(matchMedia(`(display-mode: ${m})`).matches) mode=m; });
    if(mode==="navegador" && navigator.standalone) mode="standalone";
  }catch(e){}
  // insets reales entregados por iOS (arriba y abajo)
  let insTop=0, insBottom=0;
  try{
    const probe=document.createElement("div");
    probe.style.cssText="position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)";
    document.body.appendChild(probe);
    const cs=getComputedStyle(probe);
    insTop=Math.round(parseFloat(cs.paddingTop)||0);
    insBottom=Math.round(parseFloat(cs.paddingBottom)||0);
    SAFE_TOP=insTop;   // lo usa fitSheet para dejar hueco bajo la barra de estado
    probe.remove();
  }catch(e){}
  // Nota histórica: aquí hubo una "corrección del viewport encogido" para el
  // modo translúcido. Se eliminó tras demostrar empíricamente que la franja
  // de 47pt del viewport encogido es IMPINTABLE (iOS recorta cualquier dibujo
  // fuera del layout viewport). Con la barra de estado "black", el viewport
  // queda alineado con la ventana y no hay nada que corregir.
  // Medidas de unidades de viewport (diagnóstico): qué "ve" cada unidad CSS.
  let units="";
  try{
    const m={};
    [["vh","100vh"],["dvh","100dvh"],["lvh","100lvh"]].forEach(([k,v])=>{
      const p=document.createElement("div");
      p.style.cssText="position:fixed;visibility:hidden;height:"+v;
      document.body.appendChild(p); m[k]=Math.round(p.getBoundingClientRect().height); p.remove();
    });
    units=" · vh"+m.vh+" dvh"+m.dvh+" lvh"+m.lvh;
  }catch(e){}
  if(av) av.textContent=APP_VERSION+" · "+mode+" · sup "+insTop+" inf "+insBottom+" · "+window.innerHeight+"/"+screen.height+units;
}
// Ajusta el alto máximo de la hoja al alto REALMENTE visible (visualViewport),
// que es la medida fiable en iOS (las unidades CSS vh/dvh pueden mentir). Así
// una hoja alta nunca supera el área visible y su contenido hace scroll dentro,
// dejando el botón inferior visible. No mueve la hoja (bottom:0).
function fitSheet(){
  const host=document.getElementById("sheet"); if(!host) return;
  if(host.dataset.closing) return;
  const full=(document.body && document.body.offsetHeight) || window.innerHeight || 0;
  if(full<=260) return;
  // La hoja NO se eleva con el teclado (eso la subía demasiado). Se queda anclada
  // abajo; si un campo enfocado queda tras el teclado, se desplaza el CUERPO de la
  // hoja lo justo (ver focusin). Aquí solo fijamos el alto máximo: desde el fondo
  // real hasta un poco por debajo de la barra de estado, midiendo safe-top ahora
  // mismo (no dependemos del timing de updateDiag) para que sea consistente.
  let st=SAFE_TOP||0;
  try{ const pr=document.createElement("div"); pr.style.cssText="position:absolute;left:0;top:0;width:0;height:env(safe-area-inset-top,0px)";
    document.body.appendChild(pr); const mh=Math.round(pr.getBoundingClientRect().height); pr.remove(); if(mh>0) st=mh; }catch(e){}
  const newMax=Math.max(240, Math.round(full-(st+26)))+"px";
  if(host.style.maxHeight!==newMax) host.style.maxHeight=newMax;
  if(host.style.bottom) host.style.bottom="";   // nunca elevamos la hoja
}
function boot(){
  updateDiag();
  window.addEventListener("resize", updateDiag);
  window.addEventListener("resize", fitSheet);
  // Solo "resize" (teclado). NO "scroll": el evento scroll del visualViewport se
  // dispara al desplazar el contenido de la hoja y recalcular ahí el alto causaba
  // un "temblor" mientras la hoja se reacomodaba.
  if(window.visualViewport){ window.visualViewport.addEventListener("resize", fitSheet); }
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ setTimeout(updateDiag, 250); try{ Tasks.scheduleReminders(); }catch(e){} } });
  Store.load();
  Generator.init();
  Tasks.init();
  Profile.init();
  Friends.init();
  Notifs.init();
  Router.init();
  Tasks.render();
  Profile.render();

  // Al volver a primer plano, re-pinta la lista siempre (para que las tareas
  // "solo hoy"/fecha vencidas desaparezcan solas), sin depender de la nube.
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) Tasks.render(); });

  // El aviso del resumen semanal lo genera SOLO el cron del servidor
  // (send_weekly_summaries): cada lunes a las 12:00 hora local, una sola vez,
  // con push, y funciona con la app cerrada. Antes también lo generaba la app
  // al abrirse, a cualquier hora — se eliminó para que la hora sea exacta y
  // no haya carreras entre ambos caminos.

  // Nube (si está activada): inicia sesión y sube perfil + historial en segundo plano
  if (Cloud.enabled()){
    // Sincronización continua del estado completo: se enciende sola con la app.
    Cloud.init().then(id=>{ if(id) Sync.start(); }).catch(()=>{});
    Cloud.init().then(id=>{
      if(!id){
        // La sesión no se pudo restaurar: AVISAR (antes era silencioso y el
        // perfil quedaba congelado para los amigos sin que nadie lo supiera).
        const st=Cloud.state ? Cloud.state() : null;
        if(st && st.superseded) setTimeout(()=>UI.toast("Cuenta transferida a otra instalación · Ajustes ⚙️","bell","var(--orange)"), 1200);
        else if(st && st.disconnected) setTimeout(()=>UI.toast("Nube sin conexión · revisa Ajustes ⚙️","bell","var(--red)"), 1200);
        return;
      }
      Cloud.pushProfile();
      // recupera enlaces de foto que falten en el calendario (p.ej. tras una
      // transferencia) ANTES de re-subir, para no pisarlos con null.
      Cloud.relinkPhotos().then(ok=>{ if(ok){ Tasks.render(); Profile.render(); } })
        .then(()=>Cloud.syncBacklog(500)).then(()=>Cloud.reconcile()); // sube el calendario completo solo
      Friends.syncFriends();
      Tasks.syncShared();   // reconcilia tareas compartidas
      Notifs.refresh();     // trae notificaciones + avisa en primer plano
      autoEnablePush();     // activa el push automáticamente (pide permiso al abrir)
      Cloud.syncAllReminders(); // sube los recordatorios (para el push programado)
      // Sondeo periódico: tareas compartidas + notificaciones nuevas; y cada
      // ~minuto, reconcilia la nube (borra del servidor lo que ya eliminaste)
      let tick=0;
      setInterval(()=>{ Tasks.syncShared(); Notifs.refresh(); Friends.syncFriends(); if((++tick%5)===0) Cloud.reconcile(); }, 12000);
      // Al volver a primer plano, refresca de inmediato
      document.addEventListener("visibilitychange",()=>{
        if(document.hidden) return;
        Tasks.syncShared(); Notifs.refresh(); Friends.syncFriends(); Cloud.reconcile();
        // Revalida la suscripción push cada vez que vuelves a la app (no solo al
        // arrancar): así, si el sistema la invalidó en algún momento, se repara
        // sola sin esperar a un reinicio completo de la app.
        if(("Notification" in window) && Notification.permission==="granted") Cloud.ensurePush();
      });
    });
  }

  // efecto pulsado en cualquier botón con clase .btn (feedback háptico simulado)
  document.addEventListener("touchstart",(e)=>{ const b=e.target.closest(".btn,.chip,.seg,.tab"); if(b) haptic(6); },{passive:true});

  // Service Worker: solo cuando se sirve por http(s) (no en file://)
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
    window.addEventListener("load",async ()=>{
      try{
        const hadController = !!navigator.serviceWorker.controller;
        const reg = await navigator.serviceWorker.register("service-worker.js");
        // En iOS, la app puede tardar mucho en detectar sola una versión nueva
        // del service worker (sobre todo si nunca se cierra del todo). Forzamos
        // la comprobación al abrir y al volver de segundo plano.
        // IMPORTANTE: NUNCA recargar con location.reload() aquí — recargar una
        // PWA instalada dispara un bug de iOS que encoge el webview la altura
        // de la barra de estado (deja una franja negra permanente). El nuevo
        // service worker toma el control al instante (skipWaiting+claim) y la
        // versión nueva de la página se aplica sola en la próxima apertura.
        reg.update().catch(()=>{});
        document.addEventListener("visibilitychange",()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
        let notified=false;
        navigator.serviceWorker.addEventListener("controllerchange",()=>{
          if(!hadController || notified) return; notified=true;
          UI.toast("Actualización lista · se aplicará al reabrir la app","check","var(--blue)");
        });
        // El SW se resuscribió solo tras un "pushsubscriptionchange" (el
        // sistema invalidó/rotó la suscripción). Guardamos la nueva de
        // inmediato en Supabase, en vez de esperar a la próxima vez que se
        // abra la app.
        navigator.serviceWorker.addEventListener("message",(e)=>{
          if(e.data && e.data.type==="push-resubscribed") Cloud.ensurePush();
        });
      }catch(e){}
    });
  }
}
document.addEventListener("DOMContentLoaded", ()=>{
  try{ boot(); }
  catch(e){
    // Si algo falla al arrancar (pantalla en negro), en vez de quedarse
    // atascado se recarga una sola vez sola (evita bucles si el fallo persiste).
    console.error("boot():", e);
    if(!sessionStorage.getItem("rachas_boot_retry")){
      sessionStorage.setItem("rachas_boot_retry","1");
      location.reload();
    }
  }
});
// iOS a veces "congela" la app en segundo plano y, al reabrirla, la restaura
// con el render en negro. Se repara forzando un REPINTADO, nunca con
// location.reload(): recargar una PWA instalada dispara un bug de iOS que
// encoge el webview la altura de la barra de estado (deja una franja negra
// permanente hasta cerrar del todo la app). El repintado despierta el render
// al instante sin perder nada de lo que estabas haciendo.
function repaintNudge(){
  const b=document.body;
  b.style.display="none";
  void b.offsetHeight; // fuerza el reflow
  b.style.display="";
}
window.addEventListener("pageshow",(e)=>{ if(e.persisted) repaintNudge(); });
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) repaintNudge(); });

// exponer para depuración
window.RachasApp = { Store, Router, UI, Transfer:{ makeTransferCode, restoreFromCode }, computeDueFrom, computeStartFor, nextDueAfter, taskWindow, markedDays };
})();
</script>
