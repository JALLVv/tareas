<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<!-- height=device-height fuerza el viewport de LAYOUT al alto real de la
     pantalla (844), no al reducido (797) que iOS daba y que dejaba 47px sin
     cubrir abajo (los elementos position:fixed se recortan al viewport de
     layout, así que solo ampliando ESTE se llena la pantalla de verdad). -->
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Rachas · Tareas</title>

<!-- PWA / iOS -->
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<!-- INMERSIVO (edge-to-edge, sin franjas): "black-translucent" hace que la
     app corra a pantalla completa REAL y la barra de estado (hora/batería) sea
     translúcida encima de la app, en vez de una banda negra sólida del sistema.
     El intento anterior fallaba porque quedaba una franja de ~47pt SIN PINTAR
     (negra) en el borde opuesto. La clave ahora: se pinta TODO el lienzo de la
     pantalla con el fondo oscuro de la app (fondo en <html>, que el navegador
     propaga a toda la superficie, + el ambiente dimensionado al viewport GRANDE
     con lvh). Así cualquier resto de esos 47pt se funde de forma invisible en el
     fondo oscuro de la app en lugar de verse como una banda negra. El contenido
     usa las safe-area insets (safe-top/safe-bottom), así que baja bajo el reloj
     y sube sobre el indicador de inicio sin quedar tapado. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Rachas" />
<link rel="manifest" href="manifest.json" />
<!-- Favicon: icono de la pestaña del navegador y de la dirección https -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

<!-- Supabase: cliente alojado localmente (sin depender de un CDN, que puede
     fallar de forma intermitente). Si no carga, la app funciona offline. -->
<script src="supabase.js" onerror="window.__noSupabase=true"></script>

<style>
/* =========================================================================
   SISTEMA
   Superficie plana sobre negro. No hay relieve, no hay cristal: hay PIEZAS
   —rectángulos de gris oscuro— sobre un fondo negro real, y un único acento
   vivo (el verde) reservado para una sola cosa: el tiempo que te queda.
   Todo lo demás es gris. Esa es la regla que hace legible la pantalla.
   ========================================================================= */
:root{
  --bg:#000000;            /* negro real: en OLED el fondo desaparece */
  --card:#1C1C1E;          /* la pieza */
  --card-2:#2C2C2E;        /* pastillas, campos, botones secundarios */
  --card-3:#3A3A3C;        /* pulsado / raíles */
  --sheet:#1C1C1E;

  /* El verde solo significa "tiempo restante". El rojo, "tiempo vencido".
     Ningún otro elemento los usa como decoración. */
  --green:#30D158;
  --red:#FF453A;
  --blue:#0A84FF;
  --yellow:#FFD60A;
  --orange:#FF9F0A;
  --indigo:#5E5CE6;
  --purple:#BF5AF2;
  --pink:#FF6482;
  --teal:#40C8E0;
  --mint:#66D4CF;
  --cyan:#64D2FF;
  --brown:#AC8E68;
  --ring-track:#48484A;

  --label:#FFFFFF;
  --label-2:rgba(235,235,245,0.60);
  --label-3:rgba(235,235,245,0.32);
  --label-4:rgba(235,235,245,0.18);
  --hairline:rgba(84,84,88,0.42);

  --radius:22px; --radius-lg:28px; --radius-sm:14px; --radius-pill:999px;
  --dock-h:64px; --dock-gap:10px;
  --tabbar-h:calc(var(--dock-h) + var(--dock-gap));

  --gap-xs:8px; --gap-sm:12px; --gap:16px; --gap-lg:24px; --gap-xl:32px;
  --pad:18px;

  /* Menos interletrado: una redonda con las letras juntas se lee como una
     palabra, no como una fila de letras sueltas. */
  --track-display:-0.045em; --track-title:-0.032em; --track-body:-0.016em; --track-caption:-0.006em;
  --font:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",-apple-system,BlinkMacSystemFont,
         "Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,"Apple Color Emoji",sans-serif;

  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);

  --ease:cubic-bezier(0.32,0.72,0,1);
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --t-press:110ms; --t-fast:180ms; --t-med:240ms; --t-slow:340ms;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
/* PANTALLA COMPLETA REAL: el shell mide 100lvh (alto real, 844) y NO es fixed;
   iOS recorta los elementos position:fixed al viewport de LAYOUT (797 en modo
   translúcido) y dejaba una banda negra abajo. El cromo va con position
   ABSOLUTE dentro de este contenedor, que sí llega al fondo real. */
html{height:100vh;height:100lvh;background:var(--bg);}
html,body{margin:0;padding:0;overflow:hidden;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--label);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  letter-spacing:var(--track-body);
  font-optical-sizing:auto;
  overscroll-behavior:none;
  position:relative; width:100%; height:100vh; height:100lvh;
  user-select:none; -webkit-user-select:none;
}
input,textarea{user-select:text;-webkit-user-select:text;font-family:inherit;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img{display:block;}
/* Sobre negro no hay nada ambiental que pintar. */
.ambient,.ambient::before,.ambient::after{display:none;}

/* =========================================================================
   ESTRUCTURA
   ========================================================================= */
#app{position:relative;z-index:1;height:100%;}
.view{
  position:absolute;inset:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:0 var(--pad);
  padding-top:calc(var(--safe-top) + 66px);
  padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + var(--gap-xl));
  opacity:0;transform:translateY(8px);
  transition:opacity var(--t-slow) var(--ease-out), transform var(--t-slow) var(--ease-out);
  pointer-events:none;visibility:hidden;
}
.view.active{opacity:1;transform:none;pointer-events:auto;visibility:visible;}

.topbar{
  position:absolute;top:0;left:0;right:0;z-index:40;
  height:calc(var(--safe-top) + 58px);
  padding:var(--safe-top) var(--pad) 0;
  display:flex;align-items:center;justify-content:flex-end;gap:var(--gap-sm);
  pointer-events:none;
  background:linear-gradient(to bottom, var(--bg) 0, var(--bg) 40px, rgba(0,0,0,0) 58px);
}
.topbar::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom, var(--bg) 0, var(--bg) 50px, rgba(0,0,0,0.86) 62px, rgba(0,0,0,0) 84px);
  opacity:0;transition:opacity var(--t-med) var(--ease-out);
}
.topbar.scrolled::before{opacity:1;}
.tb-title{position:relative;font-size:24px;font-weight:800;letter-spacing:var(--track-display);
  color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-right:auto;max-width:52vw;}
/* Botón redondo gris, como el de cerrar de las capturas. */
.tb-btn{
  pointer-events:auto;flex:0 0 auto;position:relative;
  width:38px;height:38px;border-radius:50%;background:var(--card);
  display:grid;place-items:center;
  transition:transform var(--t-press) var(--ease-out), background var(--t-fast);
}
.tb-btn:active{transform:scale(0.9);background:var(--card-2);}
.tb-btn svg{width:20px;height:20px;color:var(--label);}
.tb-btn .emoji{font-size:18px;}

.large-title{display:none;}
.subtitle{color:var(--label-2);font-size:14px;line-height:1.4;
  margin:0 0 var(--gap) 2px;font-weight:500;letter-spacing:var(--track-body);}
/* En la lista de tareas el subtítulo no describe la sección: DICE CÓMO VAS.
   Por eso pesa más que un subtítulo cualquiera. */
.status-head{font-size:23px;font-weight:800;color:var(--label-2);
  letter-spacing:var(--track-title);margin-bottom:var(--gap);}
.section-title{font-size:17px;font-weight:700;letter-spacing:var(--track-title);
  color:var(--label);margin:var(--gap-lg) 2px var(--gap-sm);line-height:1.3;}
.section-title:first-of-type{margin-top:var(--gap);}
.list-head{display:flex;align-items:center;justify-content:space-between;margin:var(--gap) 2px var(--gap-sm);}
.app-version{text-align:center;font-size:11px;color:var(--label-4);font-weight:600;
  margin-top:var(--gap);letter-spacing:0.02em;}
.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  font-style:normal;font-weight:400;line-height:1;display:inline-block;
  text-shadow:none;filter:none;-webkit-text-stroke:0;}

/* =========================================================================
   DOCK
   ========================================================================= */
.tabbar{
  position:absolute;left:var(--pad);right:var(--pad);z-index:50;
  bottom:calc(var(--safe-bottom) + var(--dock-gap));
  height:var(--dock-h);padding:6px;
  display:flex;align-items:stretch;
  /* Un punto más claro que las tarjetas: compartiendo color, el calendario y
     la barra se fundían en una sola mancha al llegar al fondo de la pantalla. */
  background:var(--card-2);border-radius:var(--radius-lg);
  box-shadow:0 6px 22px rgba(0,0,0,0.55);
}
.tabbar::after{content:none;}
.tab{
  position:relative;border-radius:var(--radius);
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--label-3);font-size:9.5px;font-weight:700;letter-spacing:0.02em;
  transition:color var(--t-med) var(--ease-out), transform var(--t-press) var(--ease-out);
}
.tab{background:transparent;transition:background var(--t-med) var(--ease-out),
  color var(--t-med) var(--ease-out), transform var(--t-press) var(--ease-out);}
.tab.active{background:var(--card-3);}
.tab::before{content:none;}
.tab.active::before{content:none;}
.tab svg,.tab .tab-ic,.tab span{position:relative;}
.tab svg{width:23px;height:23px;transition:transform var(--t-med) var(--ease-out);
  transform-origin:50% 60%;}
.tab .tab-ic{font-size:20px;transition:transform var(--t-med) var(--ease-out);}
.tab.active{color:var(--label);}
/* Al activarse el icono da un saltito y se queda un punto más grande: el
   rebote confirma el toque; el tamaño final dice dónde estás. Nunca arranca
   desde scale(0) —una pieza que nace de un punto no llega, aparece—. */
.tab.active svg,.tab.active .tab-ic{animation:tabPop 420ms var(--ease-out);}
@keyframes tabPop{
  0%{transform:scale(1) translateY(0);}
  38%{transform:scale(1.28) translateY(-3px);}
  70%{transform:scale(0.98) translateY(0);}
  100%{transform:scale(1.08) translateY(-1px);}
}
.tab.active svg,.tab.active .tab-ic{transform:scale(1.08) translateY(-1px);}
.tab:active{transform:scale(0.94);}

/* Pastilla de la cabecera: dos acciones sobre la lista, juntas. */
.tb-group{pointer-events:auto;flex:0 0 auto;display:flex;align-items:stretch;
  background:var(--card);border-radius:var(--radius-pill);overflow:hidden;height:38px;}
.tb-gbtn{width:46px;display:grid;place-items:center;color:var(--label);
  transition:background var(--t-fast);}
.tb-gbtn:active{background:var(--card-2);}
.tb-gbtn svg{width:19px;height:19px;}

/* Menú de vista: se despliega bajo la pastilla, anclado a la derecha. Crece
   desde su esquina superior derecha —de donde sale— y nunca desde scale(0). */
.vmenu-scrim{position:absolute;inset:0;z-index:60;opacity:0;pointer-events:none;}
.vmenu-scrim.show{opacity:1;pointer-events:auto;}
.vmenu{position:absolute;z-index:61;right:var(--pad);top:calc(var(--safe-top) + 52px);
  min-width:236px;max-width:76vw;background:var(--card);border-radius:var(--radius);
  padding:6px;box-shadow:0 16px 44px rgba(0,0,0,0.7);
  opacity:0;transform:scale(0.9);transform-origin:100% 0;pointer-events:none;
  transition:opacity var(--t-fast) var(--ease-out), transform var(--t-fast) var(--ease-out);}
.vmenu.show{opacity:1;transform:none;pointer-events:auto;}
.vm-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:12px 12px;border-radius:var(--radius-sm);color:var(--label);
  font-size:15.5px;font-weight:500;transition:background var(--t-fast);}
.vm-item:active{background:var(--card-2);}
.vm-check{width:18px;flex:0 0 auto;display:grid;place-items:center;color:var(--label);}
.vm-check svg{width:15px;height:15px;stroke-width:3;}
.vm-ic{width:20px;flex:0 0 auto;display:grid;place-items:center;color:var(--label-2);}
.vm-ic svg{width:17px;height:17px;}
.vm-lbl{flex:1;min-width:0;}
.vm-chev{color:var(--label-3);flex:0 0 auto;font-size:17px;line-height:1;}
.vm-sep{height:1px;background:var(--hairline);margin:5px 10px;}

/* Vista LISTA: la misma información en una fila, con el anillo reducido. */
.tilelist{display:flex;flex-direction:column;gap:10px;}
.tilerow{position:relative;display:flex;align-items:center;gap:14px;
  background:var(--card);border-radius:var(--radius);padding:12px 14px;
  animation:cardIn var(--t-slow) var(--ease-out) backwards;
  transition:transform var(--t-press) var(--ease-out);}
.tilerow:active{transform:scale(0.985);}
.tilerow .ring{width:52px;height:52px;flex:0 0 auto;margin:0;}
.tilerow .ring-track,.tilerow .ring-arc{stroke-width:9;}
.tilerow .ring-ic,.tilerow .ring-ic .emoji{font-size:19px;}
.tilerow .rowbody{flex:1;min-width:0;}
.tilerow .tile-title{margin-top:0;text-align:left;font-size:16px;}
.tilerow .tile-due{margin-top:3px;text-align:left;}
.tilerow .tile-menu{position:static;flex:0 0 auto;}
.tilerow.urgent{box-shadow:inset 0 0 0 3px var(--orange);}
.tilerow.done,.tile.done{opacity:0.45;}

/* Inspiraciones: emoji en ficha, título, y el botón de añadir a la derecha. */
.insp-list{display:flex;flex-direction:column;gap:10px;}
.insp-row{display:flex;align-items:center;gap:14px;padding:10px 12px;
  background:var(--card);border-radius:var(--radius);
  animation:cardIn var(--t-slow) var(--ease-out) backwards;}
.insp-ic{width:56px;height:56px;border-radius:var(--radius-sm);flex:0 0 auto;
  background:var(--card-2);display:grid;place-items:center;font-size:26px;}
.insp-t{flex:1;min-width:0;font-size:16px;font-weight:700;letter-spacing:var(--track-title);
  line-height:1.25;}
.insp-add{flex:0 0 auto;padding:9px 18px;border-radius:var(--radius-pill);
  background:var(--card-2);color:var(--label);font-size:15px;font-weight:600;
  transition:transform var(--t-press) var(--ease-out), background var(--t-fast);}
.insp-add:active{transform:scale(0.94);background:var(--card-3);}
.insp-add.added{background:var(--green);color:#000;}

/* Selector de emoji de la hoja: fila horizontal, "Auto" primero. */

/* Botón de crear: círculo verde. Con el "+" ya en la cabecera queda oculto,
   pero se conserva porque el resto del código lo muestra y lo esconde. */
.fab{display:none !important;}
.fab-legacy{}
.fab{position:absolute;right:var(--pad);z-index:45;
  bottom:calc(var(--safe-bottom) + var(--dock-gap) + var(--dock-h) + var(--gap-sm));
  width:54px;height:54px;border-radius:50%;background:var(--green);
  display:grid;place-items:center;
  transition:transform var(--t-med) var(--ease-out), opacity var(--t-med) var(--ease-out);
  opacity:0;pointer-events:none;transform:scale(0.9);}
.fab.show{opacity:1;pointer-events:auto;transform:none;}
.fab:active{transform:scale(0.92);}
.fab svg{width:28px;height:28px;color:#000;stroke-width:2.6;}
.fab .emoji{font-size:24px;}

/* =========================================================================
   ANILLOS · el corazón de la app
   El anillo NO es decoración: es el reloj de la tarea. Verde = el tiempo que
   te QUEDA, y se vacía según pasa. Cuando llega a cero cambia a rojo y vuelve
   a llenarse, ahora midiendo lo que llevas de retraso. Por eso el verde y el
   rojo no se usan en ningún otro sitio de la interfaz: si aparecieran en un
   botón o en una etiqueta, el anillo dejaría de ser información y pasaría a
   ser adorno.
   ========================================================================= */
.tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap-sm);}
.tile{
  position:relative;background:var(--card);border-radius:var(--radius-lg);
  padding:18px 12px 16px;text-align:center;
  animation:cardIn var(--t-slow) var(--ease-out) backwards;
  transition:transform var(--t-press) var(--ease-out), background var(--t-fast);
}
.tile:active{transform:scale(0.97);}
/* El menú de la tarea vive en su esquina, fuera del anillo, para que tocar el
   anillo signifique SIEMPRE "completar" y nada más. */
.tile-menu{
  position:absolute;top:10px;right:10px;z-index:2;
  width:28px;height:28px;border-radius:50%;background:var(--card-2);
  display:grid;place-items:center;color:var(--label-2);
  transition:transform var(--t-press) var(--ease-out), background var(--t-fast);
}
.tile-menu svg{width:15px;height:15px;display:block;}
.tile-menu::after{content:"";position:absolute;inset:-8px;border-radius:50%;}
.tile-menu:active{transform:scale(0.88);background:var(--card-3);}

.ring{position:relative;width:96px;height:96px;margin:0 auto;display:block;padding:0;
  background:none;transition:transform var(--t-press) var(--ease-out);}
.ring:active{transform:scale(0.92);}
.ring svg{width:100%;height:100%;display:block;transform:rotate(-90deg);}
.ring-track{fill:none;stroke:var(--ring-track);stroke-width:7;}
.ring-arc{fill:none;stroke:var(--green);stroke-width:7;stroke-linecap:round;
  transition:stroke-dashoffset var(--t-slow) var(--ease-out), stroke var(--t-med) var(--ease-out);}
.tile.over .ring-arc,.tilerow.over .ring-arc{stroke:var(--red);}
.ring-ic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:30px;line-height:1;pointer-events:none;}
.ring-ic svg{width:30px;height:30px;color:var(--label);transform:none;}
.ring-ic .emoji{font-size:30px;}

.tile-title{margin-top:12px;font-size:14.5px;font-weight:700;color:var(--label);
  letter-spacing:var(--track-title);line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;overflow-wrap:anywhere;}
.tile-due{margin-top:4px;font-size:12px;font-weight:500;color:var(--label-2);
  letter-spacing:var(--track-caption);}
.tile.over .tile-due,.tilerow.over .tile-due{color:var(--red);font-weight:600;}
/* Urgente lleva aro ÁMBAR, no rojo: el rojo es del reloj y solo puede
   significar "vencida". Si dos cosas distintas usaran el mismo color, el
   anillo dejaría de poder leerse de un vistazo. */
.tile.urgent{box-shadow:inset 0 0 0 3px var(--orange);}
.tile.done{opacity:0.45;}
.tile.done .ring-arc{stroke:var(--green);}

/* La lista antigua (fila icono-texto-casilla) ya no se usa: el anillo la
   sustituye. Se conservan las clases por si alguna vista las reutiliza. */
.tasklist{display:flex;flex-direction:column;gap:var(--gap-sm);}
.task-card{position:relative;display:block;background:var(--card);
  border-radius:var(--radius);padding:14px 16px;
  animation:cardIn var(--t-slow) var(--ease-out) backwards;}
.task-body{min-width:0;}
.task-body[role="button"]{cursor:pointer;}
.task-title{font-size:16px;font-weight:600;letter-spacing:var(--track-body);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.task-meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;}
.task-icon svg,.task-icon .emoji{width:22px;height:22px;font-size:20px;color:#fff;}
.tc-over{display:flex;align-items:center;gap:7px;margin-bottom:8px;min-width:0;}
.tc-ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-size:13px;}
.tc-ic svg{width:13px;height:13px;color:#fff;}
.tc-ic .emoji{font-size:12px;}
.tc-cat,.tc-when,.tc-pts{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;}
.tc-when{color:var(--label-3);}
.tc-when::before{content:"·";margin-right:7px;color:var(--label-4);}
.tc-when.today{color:var(--blue);}
.tc-when.shared{color:var(--indigo);}
.tc-pts{margin-left:auto;color:var(--yellow);}
.task-card.urgent{box-shadow:inset 0 0 0 3px var(--orange);}
.task-card.urgent::before,.task-card.urgent.done::before{display:none;}
.task-card.done,.task-card.urgent.done{opacity:0.45;}
.task-card.done .task-title{color:var(--label-2);text-decoration:line-through;}
.task-card.done .tc-ic{filter:saturate(0.4) brightness(0.7);}
.task-check{position:relative;width:32px;height:32px;border-radius:50%;border:none;padding:0;
  background:var(--card-2);display:grid;place-items:center;
  transition:transform var(--t-press) var(--ease-out), background var(--t-med);}
.task-check::after{content:"";position:absolute;inset:-8px;border-radius:50%;}
.task-check svg{width:18px;height:18px;color:#000;opacity:0;transform:scale(0.5);
  transition:opacity var(--t-fast) var(--ease-out), transform var(--t-fast) var(--ease-out);}
.task-check:active{transform:scale(0.88);}
.task-card.done .task-check{background:var(--green);}
.task-card.done .task-check svg{opacity:1;transform:none;}
@keyframes cardIn{from{opacity:0;transform:translateY(10px);}}
.del-btn{width:26px;height:26px;border-radius:50%;background:var(--red);display:grid;place-items:center;
  flex:0 0 auto;animation:pop .22s var(--ease-out);}
.del-btn svg{width:14px;height:14px;color:#fff;stroke-width:3;}
/* Nunca desde scale(0): una pieza que nace de un punto no llega, aparece de la nada. */
@keyframes pop{from{transform:scale(0.92);opacity:0;}}
.tag{font-size:12.5px;font-weight:500;color:var(--label-2);}
.tag.dot::before{content:"·";margin-right:6px;color:var(--label-3);}
.tag.rnd{color:var(--purple);} .tag.shared{color:var(--indigo);}
.tag.today{color:var(--blue);font-weight:700;} .tag.ppl{color:var(--cyan);}
.tag.pts{color:var(--yellow);font-weight:600;}

/* =========================================================================
   PIEZAS BÁSICAS
   ========================================================================= */
.card,.glass{background:var(--card);border-radius:var(--radius-lg);border:none;}
/* Botón principal: verde macizo con texto negro. Es la ÚNICA pieza verde que
   no es un anillo, y solo aparece una vez por pantalla. */
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;padding:16px;border-radius:var(--radius);
  font-size:17px;font-weight:700;letter-spacing:var(--track-body);
  background:var(--green);color:#000;
  transition:transform var(--t-press) var(--ease-out), filter var(--t-fast), opacity var(--t-fast);
}
.btn:active{transform:scale(0.98);filter:brightness(0.88);}
.btn svg{width:20px;height:20px;}
.btn.secondary{background:var(--card-2);color:var(--label);}
.btn.secondary:active{background:var(--card-3);filter:none;}
.btn.ghost{background:none;color:var(--label-2);}
.btn.ghost:active{background:var(--card);filter:none;}
.btn.danger{background:var(--red);color:#fff;}
.btn.danger.ghost{background:none;color:var(--red);}
.btn.danger.ghost:active{background:rgba(255,69,58,0.12);}
.btn[disabled]{opacity:0.32;pointer-events:none;}

.chips{display:flex;gap:var(--gap-xs);overflow-x:auto;padding:4px 2px var(--gap-xs);
  scrollbar-width:none;scroll-snap-type:x proximity;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;
  padding:10px 15px;border-radius:var(--radius-pill);
  background:var(--card-2);border:none;
  font-size:14.5px;font-weight:600;color:var(--label-2);letter-spacing:var(--track-body);
  transition:transform var(--t-press) var(--ease-out), background var(--t-fast), color var(--t-fast);
  scroll-snap-align:start;white-space:nowrap;
}
.chip .ic{width:20px;height:20px;display:grid;place-items:center;}
.chip .ic svg{width:17px;height:17px;}
.chip:active{transform:scale(0.95);}
.chip.sel{background:var(--label);color:#000;font-weight:700;}
.chip.sel .ic svg{color:#000 !important;}

/* Segmentado: raíl gris oscuro con la pastilla elegida en gris claro, igual
   que "Intervalo / Fecha de finalización" de las capturas. */
.segmented{display:flex;gap:0;padding:3px;border-radius:var(--radius-pill);
  background:var(--card);overflow-x:auto;scrollbar-width:none;}
.segmented::-webkit-scrollbar{display:none;}
/* flex-basis:auto reparte solo el SOBRANTE, así que cada mitad conservaba el
   ancho de su texto y "Completadas" salía más grande que "Pendientes". Con
   basis 0 las dos parten de cero y acaban midiendo exactamente lo mismo. */
.seg{flex:1 1 0;min-width:0;text-align:center;white-space:nowrap;
  padding:10px 18px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;
  color:var(--label-2);letter-spacing:var(--track-body);
  transition:background var(--t-med) var(--ease-out), color var(--t-fast) var(--ease-out);}
.seg.sel{background:var(--card-3);color:var(--label);font-weight:700;}
.seg:active{opacity:0.7;}
#taskFilter{margin-bottom:var(--gap);}
/* En la hoja de crear, "Intervalo" y "Fecha de finalización" son de largos muy
   distintos: ahí sí se reparte a lo ancho del texto, o la larga no cabría. */
#ctMode .seg{flex:1 1 auto;}

.switch{position:relative;width:51px;height:31px;border-radius:var(--radius-pill);
  background:var(--card-3);flex:0 0 auto;transition:background var(--t-med) var(--ease-out);}
.switch.on{background:var(--green);}
.switch .knob{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.35);
  transition:transform var(--t-med) var(--ease-out);}
.switch.on .knob{transform:translateX(20px);}

/* =========================================================================
   FORMULARIOS · filas con el valor en pastilla a la derecha
   ========================================================================= */
.settings-list,.tg-list,.form-group{display:flex;flex-direction:column;
  background:var(--card);border-radius:var(--radius-lg);overflow:hidden;border:none;
  margin-top:var(--gap-xs);}
.settings-row{display:flex;align-items:center;gap:13px;padding:15px 16px;width:100%;
  text-align:left;background:transparent;transition:background var(--t-fast);}
.settings-row + .settings-row,.tg-row + .tg-row,#ctRemindWrap{border-top:1px solid var(--hairline);}
.settings-row .sr-ic{font-size:22px;width:28px;text-align:center;flex:0 0 auto;}
.sr-info{flex:1;min-width:0;}
.sr-t{font-size:16px;font-weight:600;color:var(--label);letter-spacing:var(--track-body);}
.sr-s{font-size:12.5px;color:var(--label-3);margin-top:3px;line-height:1.35;}
.sr-chev{color:var(--label-4);font-size:22px;font-weight:400;flex:0 0 auto;line-height:1;}
.settings-row.tappable:active{background:var(--card-2);}
.tg-row{display:flex;align-items:center;gap:12px;padding:13px 16px;}
.tg-ic{font-size:19px;width:24px;text-align:center;flex:0 0 auto;}
.tg-lbl{flex:1;font-size:16px;font-weight:600;}
#ctRemindWrap{padding:12px 16px 14px;}
.time-field{background:var(--card-2);border:none;border-radius:var(--radius-sm);color:var(--label);
  font-family:inherit;font-size:16px;font-weight:600;padding:9px 13px;color-scheme:dark;}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:52px;
  border-bottom:1px solid var(--hairline);}
.row:last-child,.row + .row{border-bottom:1px solid var(--hairline);}
.row:last-child{border-bottom:none;}
.row .lbl{font-size:16px;font-weight:500;flex:0 0 auto;}
.row input.field,.row textarea.field{flex:1;background:none;border:none;outline:none;color:var(--label);
  font-size:16px;text-align:right;min-width:0;}
.row textarea.field{text-align:left;resize:none;min-height:22px;}
.field-block{padding:14px 16px;border-bottom:1px solid var(--hairline);}
.field-block + .field-block{border-top:none;}
.field-block:last-child{border-bottom:none;}
.field-block input.field,.field-block textarea.field{width:100%;background:none;border:none;outline:none;
  color:var(--label);font-size:16px;text-align:left;resize:none;}
input::placeholder,textarea::placeholder{color:var(--label-3);}
input[type=file]{display:none;}
input[type=date].field{color-scheme:dark;font-size:16px;width:100%;}
.well{background:var(--card-2);border:none;border-radius:var(--radius-sm);}

.big-input{width:100%;background:transparent;border:none;outline:none;resize:none;
  color:var(--label);font-family:inherit;letter-spacing:var(--track-title);padding:4px 2px;}
.big-input::placeholder{color:var(--label-4);}
.big-title{font-size:26px;font-weight:800;line-height:1.15;margin-top:var(--gap-sm);
  letter-spacing:var(--track-display);text-align:center;}
.big-desc{font-size:16px;font-weight:500;line-height:1.35;margin-top:0;overflow:hidden;min-height:0;
  color:var(--label-2);text-align:center;}

/* Desplegables como pastilla gris (el JS calcula el ancho: texto + 37px, es
   decir 13 de padding izquierdo y 24 de hueco hasta la flecha; no tocar). */
.dd-row{display:flex;gap:var(--gap-xs);overflow-x:auto;scrollbar-width:none;
  padding:4px 2px 6px;-webkit-overflow-scrolling:touch;}
.dd-row::-webkit-scrollbar{display:none;}
.dd{position:relative;flex:0 0 auto;display:inline-flex;}
.dd select{
  appearance:none;-webkit-appearance:none;
  background:var(--card-2);color:var(--label);border:none;border-radius:var(--radius-pill);
  padding:10px 24px 10px 13px;font-size:14.5px;font-weight:600;font-family:inherit;
  white-space:nowrap;width:auto;max-width:78vw;text-overflow:ellipsis;
  transition:background var(--t-fast);}
.dd select:active{background:var(--card-3);}
.dd-chev{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;
  color:var(--label-3);font-size:10px;}
.gen-panel{background:var(--card);border-radius:var(--radius-lg);padding:6px 16px 14px;}
.gen-field{margin-top:var(--gap-sm);display:flex;align-items:center;gap:var(--gap-sm);}
.gen-field:first-child{margin-top:var(--gap-sm);}
.gen-field .gen-label{flex:1;font-size:15px;font-weight:500;color:var(--label-2);margin:0;}
.gen-field .dd{flex:0 0 auto;display:inline-flex;}

.daypicker{display:flex;gap:6px;padding:var(--gap-xs) 0 2px;}
.day{flex:1;text-align:center;padding:11px 0;border-radius:var(--radius-sm);font-size:13px;font-weight:700;
  background:var(--card-2);color:var(--label-2);
  transition:transform var(--t-press) var(--ease-out), background var(--t-fast), color var(--t-fast);}
.day.sel{background:var(--green);color:#000;}
.day:active{transform:scale(0.92);}
.monthpicker{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:var(--gap-xs) 0 2px;}
.monthpicker .day{flex:none;padding:9px 0;font-size:13px;}

.action-list{display:flex;flex-direction:column;gap:var(--gap-xs);}
.action-btn{display:flex;align-items:center;gap:13px;width:100%;padding:15px 16px;
  border-radius:var(--radius);background:var(--card-2);color:var(--label);
  font-size:16px;font-weight:600;letter-spacing:var(--track-body);border:none;
  transition:transform var(--t-press) var(--ease-out), background var(--t-fast);}
.action-btn:active{transform:scale(0.98);background:var(--card-3);}
.action-btn svg{width:20px;height:20px;color:var(--label-2);flex:0 0 auto;}
.action-btn.danger{color:var(--red);}
.action-btn.danger svg{color:var(--red);}
.mini-btn{padding:9px 16px;border-radius:var(--radius-pill);background:var(--card-2);color:var(--label);
  font-size:14px;font-weight:600;transition:transform var(--t-press) var(--ease-out), background var(--t-fast);}
.mini-btn.accent{background:var(--green);color:#000;font-weight:700;}
.mini-btn.danger{background:rgba(255,69,58,0.16);color:var(--red);}
.mini-btn:active{transform:scale(0.94);}

.ta-name{font-size:17px;font-weight:700;color:var(--label);text-align:center;
  margin:2px 4px var(--gap);line-height:1.3;letter-spacing:var(--track-title);}
.empty{padding:60px 24px;text-align:center;color:var(--label-3);
  animation:cardIn var(--t-slow) var(--ease-out) backwards;}
.empty svg{width:44px;height:44px;margin-bottom:14px;opacity:0.35;}
.empty p{font-size:17px;font-weight:700;margin:0 0 6px;color:var(--label);letter-spacing:var(--track-title);}
.empty .sub{font-size:13.5px;color:var(--label-3);line-height:1.4;max-width:26ch;margin:0 auto;}
.empty-gen{margin-top:var(--gap);padding:40px 22px;text-align:center;color:var(--label-3);}
.empty-gen svg{width:50px;height:50px;margin-bottom:14px;opacity:0.4;}
.empty-gen p{font-size:15px;font-weight:500;margin:0;line-height:1.5;}
.hint{font-size:12.5px;color:var(--label-3);margin:var(--gap-xs) 4px 0;line-height:1.45;}

/* =========================================================================
   GENERADOR
   ========================================================================= */
.gen-result{margin-top:var(--gap-sm);padding:var(--pad);text-align:left;position:relative;
  overflow:hidden;background:var(--card);border-radius:var(--radius-lg);}
.gen-result .cat-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;
  border-radius:var(--radius-pill);font-size:12px;font-weight:700;margin-bottom:var(--gap-sm);}
.gen-result .cat-badge svg{width:15px;height:15px;}
.gen-result .task-text{font-size:17px;font-weight:600;line-height:1.5;color:var(--label);}
.gen-result .meta{display:flex;justify-content:flex-start;gap:var(--gap-xs);margin-top:var(--gap);flex-wrap:wrap;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--radius-pill);
  background:var(--card-2);font-size:12.5px;font-weight:600;color:var(--label-2);}
.pill svg{width:14px;height:14px;}
.pill.pts{color:var(--yellow);}
.gen-actions{display:flex;gap:var(--gap-xs);margin-top:var(--gap-sm);}
.gen-actions .btn{flex:1;}

/* =========================================================================
   PERFIL
   ========================================================================= */
.profile-head{display:flex;flex-direction:row;align-items:center;text-align:left;
  gap:var(--gap);padding:0 2px var(--gap);}
.ph-id{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
.avatar{width:104px;height:104px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(145deg,#5E5CE6,#0A84FF);
  display:grid;place-items:center;font-size:40px;font-weight:800;color:#fff;
  overflow:hidden;position:relative;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar .edit-badge{position:absolute;bottom:1px;right:1px;width:29px;height:29px;border-radius:50%;
  background:var(--card-2);border:2px solid var(--bg);display:grid;place-items:center;}
.avatar .edit-badge svg{width:13px;height:13px;color:var(--label-2);}
.profile-name{font-size:28px;font-weight:800;letter-spacing:var(--track-title);margin:0;
  display:inline-flex;align-items:center;gap:7px;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.profile-name .pen{width:18px;height:18px;color:var(--label-3);flex:0 0 auto;}
/* El nombre y la acción sobre esa persona van juntos; las cifras, debajo.
   Mezclar "Eliminar amigo" con la racha y los puntos ponía al mismo nivel un
   dato y una acción que no se puede deshacer. */
.ph-name-row{display:flex;align-items:center;gap:10px;width:100%;min-width:0;}
.ph-name-row .profile-name{flex:0 1 auto;}
.ph-chips{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.phc{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:var(--radius-pill);
  background:var(--card);font-size:12px;font-weight:700;color:var(--label);}
.phc .emoji{font-size:13px;}
.phc.fire b{color:var(--orange);}
.phc.pts{color:var(--yellow);}
/* El rango va en su propia línea y con más cuerpo que las cifras: es la
   etiqueta que mejor resume dónde estás, y compartiendo fila con la racha y
   los puntos parecía un dato más. */
.rank-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;
  border-radius:var(--radius-pill);background:var(--card);
  font-size:13px;font-weight:800;letter-spacing:var(--track-body);}
.rank-badge svg{width:16px;height:16px;flex:0 0 auto;}

.rank-card{margin-top:0;padding:13px var(--pad) 14px;}
.rank-row{display:flex;align-items:baseline;justify-content:flex-start;margin-bottom:9px;}
.rank-row .now{display:none;}
.rank-row .next{font-size:13px;font-weight:600;color:var(--label-2);}
.progress{height:8px;border-radius:var(--radius-pill);background:var(--card-2);overflow:hidden;position:relative;}
.progress .bar{height:100%;border-radius:var(--radius-pill);background:var(--yellow);
  width:0;transition:width 1s var(--ease-out);}
.rank-foot{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;
  color:var(--label-2);font-weight:600;}

/* Tres cifras iguales, sin pieza destacada: los puntos y la racha ya viven
   junto al nombre, así que aquí no queda nada que merezca el doble de tamaño. */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
/* Radio propio, más cerrado que el de las tarjetas grandes: a este tamaño
   el radio de 28px se comía las esquinas y la ficha parecía una pastilla.
   Y el contenido va centrado, que es lo que pide una caja casi cuadrada. */
.stat{padding:15px 10px;border-radius:16px;text-align:center;}
.stat .v{font-size:23px;font-weight:800;letter-spacing:var(--track-title);line-height:1;
  font-variant-numeric:tabular-nums;}
.stat .l{font-size:10.5px;color:var(--label-2);font-weight:600;margin-top:6px;line-height:1.25;}
.stat .v.fire{color:var(--orange);} .stat .v.gold{color:var(--yellow);}
.stat .v.pur{color:var(--purple);} .stat .v.grn{color:var(--green);}

.streak-card{margin-top:10px;padding:15px var(--pad);display:flex;align-items:center;gap:var(--gap-sm);}
.streak-flame{font-size:30px;}
.streak-info{flex:1;}
.streak-info .big{font-size:21px;font-weight:800;letter-spacing:var(--track-title);}
.streak-info .small{font-size:12.5px;color:var(--label-2);font-weight:500;margin-top:2px;}
.streak-best{text-align:right;}
.streak-best .v{font-size:19px;font-weight:800;color:var(--orange);}
.streak-best .l{font-size:11px;color:var(--label-2);font-weight:500;}

.week-card{margin-top:14px;padding:var(--gap-sm) var(--pad) var(--gap);}
.week-head{display:flex;align-items:baseline;justify-content:space-between;}
.week-head .t{font-size:16px;font-weight:700;letter-spacing:var(--track-title);}
.week-head .range{font-size:12.5px;color:var(--label-2);font-weight:500;}
.week-vibe{margin-top:10px;font-size:14px;font-weight:700;color:var(--indigo);}
.week-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:var(--gap-sm);}
.wk-stat{background:var(--card-2);border-radius:var(--radius-sm);padding:13px;text-align:center;}
.wk-stat .v{font-size:21px;font-weight:800;letter-spacing:var(--track-title);font-variant-numeric:tabular-nums;}
.wk-stat .l{font-size:11.5px;color:var(--label-2);font-weight:500;margin-top:2px;}
.week-cmp{margin-top:10px;font-size:13px;color:var(--label-2);font-weight:500;line-height:1.4;}
.week-cmp.muted{font-style:italic;}
.week-top{margin-top:8px;font-size:13px;color:var(--label-2);font-weight:500;}
.week-top b{color:var(--label);}
.week-empty{margin-top:10px;font-size:13.5px;color:var(--label-2);font-weight:500;line-height:1.4;}

/* El botón de la semana queda a la MISMA distancia de las estadísticas y del
   calendario: antes tenía 14px arriba y 8 abajo y se veía descolgado. */
.week-btn{margin-top:14px;}
.cal-card{margin-top:14px;padding:var(--gap-sm) var(--gap-sm) var(--gap);overflow:hidden;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--gap-sm);padding:0 6px;}
.cal-head .m{font-size:17px;font-weight:700;letter-spacing:var(--track-title);}
.cal-nav{display:flex;gap:var(--gap-xs);}
.cal-nav button{width:32px;height:32px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;
  transition:transform var(--t-press) var(--ease-out), background var(--t-fast);}
.cal-nav button:active{transform:scale(0.9);background:var(--card-3);}
.cal-nav svg{width:15px;height:15px;color:var(--label);stroke-width:2.5;}
/* Un único grid para todo el mes: el día 1 se coloca con grid-column-start, sin
   celdas de relleno, así todas las filas las dimensionan días reales. */
.cal-weeks{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:var(--gap-xs);}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--label-3);}
.cal-day{aspect-ratio:1/1;min-width:0;min-height:0;box-sizing:border-box;
  display:grid;place-items:center;position:relative;border-radius:50%;
  font-size:14px;font-weight:600;color:var(--label-2);
  transition:transform var(--t-press) var(--ease-out), background var(--t-med);}
@keyframes calNext{from{opacity:0;transform:translateX(16px);}}
@keyframes calPrev{from{opacity:0;transform:translateX(-16px);}}
@keyframes calFade{from{opacity:0;}}
/* Verde UNIFORME en todos los días con actividad: la intensidad variable hacía
   parecer que unos días valían menos que otros. */
.cal-day.has{cursor:pointer;background:rgba(48,209,88,0.20);color:var(--green);font-weight:700;}
.cal-day.has::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;
  background:var(--green);}
.cal-day.today{color:var(--blue);font-weight:800;box-shadow:inset 0 0 0 1.6px var(--blue);}
.cal-day.today.has{color:var(--blue);box-shadow:inset 0 0 0 1.6px var(--blue);}
.cal-day.has:active{transform:scale(0.9);}

/* =========================================================================
   AMIGOS · NOTIFICACIONES
   ========================================================================= */
.notif-badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;
  border-radius:var(--radius-pill);background:var(--red);color:#fff;font-size:11px;font-weight:800;
  display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg);}
.notif-item{align-items:center;position:relative;}
.notif-ic{width:56px;height:56px;border-radius:var(--radius-sm);flex:0 0 auto;display:grid;place-items:center;
  background:var(--card-2);}
.notif-ic svg{width:24px;height:24px;}
.notif-ic.done{color:var(--green);} .notif-ic.add{color:var(--indigo);}
.notif-item .gal-info .t b{color:var(--label);}
.notif-req{align-items:flex-start;}
.notif-req .gal-info .t{white-space:normal;overflow:visible;line-height:1.35;}
.req-actions{display:flex;gap:var(--gap-xs);margin-top:10px;}
.req-actions .mini-btn{flex:0 0 auto;padding:7px 18px;}
.notif-del{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  align-self:center;color:var(--label-3);background:var(--card-2);font-size:13px;line-height:1;
  border:none;position:relative;transition:transform var(--t-press) var(--ease-out), background var(--t-fast);}
.notif-del::after{content:"";position:absolute;inset:-8px;border-radius:50%;}
.notif-del:active{transform:scale(0.9);background:var(--card-3);}
.notif-clear-all{display:block;width:100%;text-align:center;margin:0 0 var(--gap-sm);color:var(--red);
  font-weight:600;font-size:14px;background:none;border:none;padding:6px;}
.notif-activate{display:flex;align-items:center;gap:var(--gap-sm);margin-bottom:var(--gap-sm);padding:14px 16px;}
.notif-activate .na-ic{width:40px;height:40px;border-radius:var(--radius-sm);flex:0 0 auto;
  display:grid;place-items:center;background:var(--card-2);}
.notif-activate .na-ic svg{width:20px;height:20px;}
.notif-activate .na-ic.on{color:var(--green);} .notif-activate .na-ic.off{color:var(--indigo);}
.notif-activate .na-txt{flex:1;min-width:0;}
.notif-activate .na-txt .t{font-weight:700;font-size:15px;}
.notif-activate .na-txt .s{font-size:12.5px;color:var(--label-2);margin-top:2px;line-height:1.35;}

.friends-sheet-head{display:flex;align-items:center;gap:var(--gap-xs);margin:2px 0 var(--gap);}
.friends-sheet-head .mini-btn{flex:1;text-align:center;}
.friends-actions{display:flex;gap:var(--gap-xs);}
.sheet-head .act.danger{color:var(--red);font-weight:600;}
/* Dentro de la hoja el fondo YA es --card, así que una tarjeta del mismo
   color desaparecía: los amigos se leían como una lista de texto suelto. Su
   burbuja sube un escalón para volver a despegarse del fondo. */
.friend-card{display:flex;align-items:center;gap:13px;padding:12px 14px;margin-bottom:10px;cursor:pointer;
  background:var(--card-2);border-radius:var(--radius);
  transition:transform var(--t-press) var(--ease-out), background var(--t-fast);}
.friend-card:active{transform:scale(0.98);background:var(--card-3);}
.friend-av{width:46px;height:46px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  overflow:hidden;font-size:18px;font-weight:800;color:#fff;
  background:linear-gradient(145deg,#5E5CE6,#0A84FF);}
.friend-av img{width:100%;height:100%;object-fit:cover;}
.friend-info{flex:1;min-width:0;}
.friend-info .fn{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.friend-info .fm{font-size:13px;color:var(--label-2);margin-top:2px;}
.friend-info .fm .fire{color:var(--orange);}
.friend-chev{color:var(--label-3);flex:0 0 auto;}
.friend-chev svg{width:19px;height:19px;}
.friends-empty{padding:18px 14px;text-align:center;color:var(--label-2);font-size:14px;line-height:1.5;}
.code-box{width:100%;background:var(--card-2);border:none;border-radius:var(--radius-sm);
  padding:13px 15px;font-size:13px;color:var(--label-2);word-break:break-all;
  font-family:ui-monospace,monospace;max-height:120px;overflow:auto;}
/* El cuerpo de la hoja YA es --card: cualquier pieza de ese mismo color se
   volvía invisible dentro. Todo lo que deba leerse como "caja" sube un
   escalón, y lo que va dentro de esas cajas, dos. */
.sheet .card,.sheet .stat,.sheet .cal-card,.sheet .week-card,.sheet .gal-item,
.sheet .notif-activate,.sheet .form-group,
.sheet .settings-list,.sheet .tg-list,.sheet .segmented,.sheet .rank-badge,
.sheet .phc,.sheet .chip,.sheet .mini-btn,.sheet .action-btn,.sheet .btn.secondary{background:var(--card-2);}
.sheet .wk-stat,.sheet .gal-thumb,.sheet .notif-ic,.sheet .pill,.sheet .seg.sel,
.sheet .chipv,.sheet .cal-nav button,.sheet .day,.sheet .time-field,
.sheet .code-box,.sheet .dd select,.sheet .well,.sheet .switch{background:var(--card-3);}
.sheet .action-btn:active,.sheet .mini-btn:active,.sheet .settings-row.tappable:active{background:var(--card-3);}
.sheet .switch.on{background:var(--green);}
.sheet .day.sel{background:var(--green);}
.sheet .mini-btn.accent{background:var(--green);}
/* Dentro de la hoja el retrato del amigo usa la misma pieza que el tuyo. */
.sheet .avatar{background:linear-gradient(145deg,#5E5CE6,#0A84FF);}

/* =========================================================================
   HOJAS / MODALES
   ========================================================================= */
.scrim{position:absolute;inset:0;z-index:90;background:rgba(0,0,0,0.6);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease-out);}
.scrim.show{opacity:1;pointer-events:auto;}
.sheet{
  /* bottom y max-height los fija fitSheet() por JS con el rectángulo REALMENTE
     visible; estos valores son solo el respaldo inicial. dvh (no vh): en iOS
     instalado, vh ve la pantalla completa y una hoja alta se cortaba abajo. */
  position:absolute;left:0;right:0;bottom:0;z-index:100;
  max-height:min(86dvh, calc(100dvh - var(--safe-top) - var(--safe-bottom) - 12px));
  display:flex;flex-direction:column;
  background:var(--sheet);border-radius:var(--radius-lg) var(--radius-lg) 0 0;border-top:none;
  transform:translateY(100%);transition:transform .42s var(--ease);will-change:transform;
}
.sheet.show{transform:none;}
.grabber{width:36px;height:5px;border-radius:var(--radius-pill);background:var(--card-3);
  margin:9px auto 4px;flex:0 0 auto;}
/* Grid 1fr·auto·1fr: el título queda centrado de verdad aunque los botones
   laterales tengan anchos distintos. */
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--gap-xs);
  padding:8px var(--pad) var(--gap-sm);flex:0 0 auto;}
.sheet-head .title{font-size:17px;font-weight:700;letter-spacing:var(--track-title);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sheet-head .act{font-size:16px;font-weight:600;color:var(--label-2);padding:4px 2px;}
.sheet-head .act:first-child{justify-self:start;text-align:left;}
.sheet-head .act:last-child{justify-self:end;text-align:right;color:var(--green);}
.sheet-head .act.cancel{font-weight:500;}
.sheet-head .act[disabled]{color:var(--label-4);}
/* flex:1 + min-height:0 son CLAVE: sin min-height:0 este cuerpo flexible NO
   forma contenedor de scroll en Safari y un formulario largo se desborda por
   debajo de la hoja, dejando el botón de guardar cortado. */
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:4px var(--pad) calc(var(--gap-lg) + var(--safe-bottom));flex:1 1 auto;min-height:0;}
.sheet-body .lbl-sm{font-size:13px;font-weight:600;color:var(--label-2);margin:var(--gap) 4px var(--gap-xs);}
.sheet-body .lbl-sm:first-child{margin-top:6px;}

/* Vista previa de la hoja: la MISMA pieza que verás en la lista, con su
   anillo real. El aro discontinuo de dentro marca que todavía es un hueco por
   rellenar. Ver el anillo mientras lo configuras es lo que hace entendible el
   intervalo sin explicarlo. */
.pv{display:flex;flex-direction:column;align-items:center;margin:2px 0 var(--gap-lg);}
.pv-ring{position:relative;width:120px;height:120px;}
.pv-ring svg{width:100%;height:100%;display:block;transform:rotate(-90deg);}
.pv-ring .dash{position:absolute;inset:17px;border-radius:50%;
  border:2px dashed var(--label-4);pointer-events:none;}
.pv-ring .ring-ic{font-size:36px;}
.pv-ring .ring-ic .emoji{font-size:36px;}
.pv-title{margin-top:15px;font-size:20px;font-weight:800;color:var(--label);
  text-align:center;letter-spacing:var(--track-title);word-break:break-word;
  background:none;border:none;outline:none;width:100%;max-width:300px;
  font-family:inherit;padding:2px 0;}
.pv-title::placeholder{color:var(--label-4);}
/* El emoji vive DENTRO del anillo y se edita ahí mismo. */
.ring-emj{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:66px;height:52px;border:none;outline:none;background:none;
  text-align:center;font-size:36px;line-height:1;padding:0;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",inherit;
  caret-color:transparent;}
/* El "+" del hueco vacío: grande y del color del texto, no un gris de aviso.
   Es una invitación a poner algo, no un error. */
.ring-emj::placeholder{color:var(--label-2);font-family:inherit;font-weight:300;
  font-size:42px;opacity:1;}
.pv-due{margin-top:4px;font-size:14px;color:var(--label-2);}
/* Sale solo mientras falta el emoji: una pista que aparece cuando hace falta
   explica por qué "Guardar" está apagado sin ocupar sitio el resto del tiempo. */
.pv-need{margin-top:10px;font-size:13px;font-weight:600;color:var(--label-2);}
.pv-need b{color:var(--green);font-size:15px;}
.pv.over .pv-due{color:var(--red);font-weight:600;}
/* Fila de ajuste: rótulo a la izquierda, valor en pastilla a la derecha. */
.frow{display:flex;align-items:center;gap:10px;padding:13px 2px;min-height:56px;}
.frow + .frow{border-top:1px solid var(--hairline);}
.frow .fl{flex:1;min-width:0;font-size:16px;font-weight:500;color:var(--label);}
.fval{display:flex;align-items:center;gap:7px;flex:0 0 auto;}
.chipv{background:var(--card-2);border-radius:var(--radius-pill);border:none;
  padding:8px 13px;font-size:14px;font-weight:600;color:var(--label);
  font-family:inherit;color-scheme:dark;transition:background var(--t-fast);
  min-width:0;}
.chipv:active{background:var(--card-3);}
input.chipv{max-width:132px;}
input.chipv::-webkit-calendar-picker-indicator{display:none;-webkit-appearance:none;}
input.chipv::-webkit-date-and-time-value{text-align:left;}
.frow .fl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fval{min-width:0;}
.fsel{position:relative;display:inline-flex;}
.fsel select{appearance:none;-webkit-appearance:none;padding-right:26px;text-align:left;}
.fsel .dd-chev{right:11px;}
.fsep{height:1px;background:var(--hairline);margin:var(--gap) 0;}

.photo-modal{text-align:center;}
.photo-modal .ico{width:60px;height:60px;border-radius:50%;margin:6px auto var(--gap);
  display:grid;place-items:center;background:rgba(48,209,88,0.16);}
.photo-modal .ico svg{width:30px;height:30px;color:var(--green);}
.photo-modal .ico.danger{background:rgba(255,69,58,0.16);}
.photo-modal .ico.danger svg{color:var(--red);}
.photo-modal h3{font-size:20px;font-weight:800;margin:0 0 6px;letter-spacing:var(--track-title);}
.photo-modal p{font-size:14px;color:var(--label-2);margin:0 0 var(--gap);line-height:1.45;}
.photo-preview{width:100%;aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;
  background:var(--card-2);margin-bottom:var(--gap);display:none;position:relative;border:none;}
.photo-preview.show{display:block;animation:pop .3s var(--ease-out);}
.photo-preview img{width:100%;height:100%;object-fit:cover;}
.photo-preview .retake{position:absolute;top:10px;right:10px;padding:7px 13px;border-radius:var(--radius-pill);
  background:rgba(0,0,0,0.7);font-size:13px;font-weight:600;color:#fff;}
.photo-btns{display:flex;gap:var(--gap-xs);margin-bottom:var(--gap-xs);}
.photo-btns .btn{flex:1;}

.done-datebar{display:flex;align-items:center;gap:var(--gap-xs);margin-bottom:var(--gap-sm);}
.done-datebar input[type=date]{color-scheme:dark;background:var(--card-2);border:none;
  border-radius:var(--radius-sm);padding:10px 13px;color:var(--label);font-size:15px;font-weight:600;flex:1;}
.done-datebar .mini-btn{flex:0 0 auto;}
.day-gallery{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;}
.gal-item{display:flex;gap:13px;align-items:center;padding:11px;min-width:0;border-radius:var(--radius);}
.gal-item.anim-in{animation:cardIn var(--t-slow) var(--ease-out) backwards;}
.gal-item.tappable{cursor:pointer;transition:transform var(--t-press) var(--ease-out), background var(--t-fast);}
.gal-item.tappable:active{transform:scale(0.98);background:var(--card-2);}
.gal-thumb{width:58px;height:58px;border-radius:var(--radius-sm);overflow:hidden;flex:0 0 auto;
  background:var(--card-2);}
.gal-thumb img{width:100%;height:100%;object-fit:cover;}
.gal-info{flex:1;min-width:0;}
.gal-info .t{font-size:15.5px;font-weight:700;letter-spacing:var(--track-title);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gal-info .m{font-size:12.5px;color:var(--label-2);margin-top:4px;}
.gal-info .m .pts{color:var(--yellow);font-weight:600;}

/* =========================================================================
   LIGHTBOX
   ========================================================================= */
.lightbox{position:absolute;inset:0;z-index:200;background:#000;
  display:flex;align-items:flex-start;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease-out);}
.lightbox.show{opacity:1;pointer-events:auto;}
.lb-scroll{width:100%;max-width:560px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 56px) var(--gap) calc(env(safe-area-inset-bottom) + 20px);}
/* La imagen se ajusta a su tamaño (sin caja fija) para que no quede hueco. */
.lightbox img{max-width:100%;max-height:62vh;width:auto;height:auto;border-radius:var(--radius);
  flex:0 0 auto;transform:scale(0.94);transition:transform .35s var(--ease-out);}
.lightbox.show img{transform:none;}
.lightbox .lb-info{margin-top:var(--gap-sm);text-align:center;}
.lightbox .lb-info .t{font-size:18px;font-weight:700;color:#fff;}
.lightbox .lb-info .m{font-size:13px;color:rgba(255,255,255,0.6);margin-top:5px;}
.lightbox .lb-close{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:var(--pad);z-index:2;
  width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;
  transition:transform var(--t-press) var(--ease-out), background var(--t-fast);}
.lightbox .lb-close svg{width:17px;height:17px;color:#fff;stroke-width:2.6;}
.lightbox .lb-close:active{transform:scale(0.9);background:var(--card-2);}
.lb-comments{width:100%;margin-top:22px;text-align:left;}
.lb-c-title{font-size:13px;font-weight:700;color:rgba(255,255,255,0.55);text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:var(--gap-sm);}
.lb-c-list{display:flex;flex-direction:column;gap:var(--gap-xs);}
.lb-c-item{display:flex;gap:10px;background:var(--card);border-radius:var(--radius-sm);padding:11px 13px;}
.lb-c-av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--blue);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;}
.lb-c-av img{width:100%;height:100%;object-fit:cover;}
.lb-c-body{flex:1;min-width:0;}
.lb-c-head{display:flex;align-items:center;gap:8px;}
.lb-c-item .a{font-size:13px;font-weight:700;color:#fff;}
.lb-c-streak{font-size:12px;font-weight:700;color:var(--orange);}
.lb-c-item .x{font-size:14.5px;color:rgba(255,255,255,0.92);margin-top:2px;white-space:pre-wrap;
  word-break:break-word;line-height:1.35;}
.lb-c-item .when{font-size:11px;color:rgba(255,255,255,0.4);margin-top:4px;}
.lb-c-del{color:rgba(255,120,120,0.9);cursor:pointer;}
.lb-c-empty{font-size:13.5px;color:rgba(255,255,255,0.45);padding:2px 0 4px;}
.lb-c-input{display:flex;gap:var(--gap-xs);margin-top:var(--gap-sm);}
.lb-c-input input{flex:1;min-width:0;background:var(--card);border:none;border-radius:var(--radius-sm);
  padding:12px 14px;color:#fff;font-size:16px;outline:none;}
.lb-c-input input::placeholder{color:rgba(255,255,255,0.4);}
.lb-c-input button{flex:0 0 auto;background:var(--green);color:#000;border:none;
  border-radius:var(--radius-sm);padding:0 18px;font-weight:700;font-size:14px;}
.lb-c-input button:active{filter:brightness(0.88);}
.lb-c-input button:disabled{opacity:0.35;}

/* =========================================================================
   GAMIFICACIÓN
   ========================================================================= */
.points-pop{position:absolute;left:50%;top:42%;z-index:300;transform:translate(-50%,-50%);
  font-size:44px;font-weight:900;color:var(--yellow);pointer-events:none;
  letter-spacing:var(--track-display);animation:ptsPop 1.2s var(--ease-out) forwards;}
@keyframes ptsPop{
  0%{opacity:0;transform:translate(-50%,-30%) scale(0.4);}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}
  35%{transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0;transform:translate(-50%,-130%) scale(0.95);}
}
.rankup{position:absolute;inset:0;z-index:320;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:radial-gradient(circle at 50% 40%, #1a1a1e, #000 72%);
  opacity:0;pointer-events:none;transition:opacity .4s var(--ease-out);text-align:center;padding:var(--gap-lg);}
.rankup.show{opacity:1;pointer-events:auto;}
.rankup .eyebrow{font-size:13px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--label-2);margin-bottom:var(--gap);opacity:0;transform:translateY(10px);}
.rankup.show .eyebrow{animation:riIn .5s .15s var(--ease-out) forwards;}
.rankup .badge{width:126px;height:126px;border-radius:50%;display:grid;place-items:center;
  margin-bottom:var(--gap-lg);background:#101014;
  transform:scale(0.92) rotate(-30deg);opacity:0;}
.rankup.show .badge{animation:riBadge .7s .2s var(--ease) forwards;}
.rankup .badge svg{width:66px;height:66px;}
.rankup .rk{font-size:34px;font-weight:900;letter-spacing:var(--track-display);opacity:0;transform:translateY(14px);}
.rankup.show .rk{animation:riIn .5s .45s var(--ease-out) forwards;}
.rankup .desc{font-size:15px;color:var(--label-2);margin-top:8px;font-weight:500;opacity:0;}
.rankup.show .desc{animation:riIn .5s .6s var(--ease-out) forwards;}
.rankup .cont{margin-top:var(--gap-xl);padding:15px 44px;border-radius:var(--radius);
  background:var(--green);color:#000;font-size:17px;font-weight:700;opacity:0;
  transition:transform var(--t-press) var(--ease-out);}
.rankup.show .cont{animation:riIn .5s .8s var(--ease-out) forwards;}
.rankup .cont:active{transform:scale(0.97);}
@keyframes riIn{to{opacity:1;transform:none;}}
@keyframes riBadge{0%{transform:scale(0.92) rotate(-30deg);opacity:0;}
  60%{transform:scale(1.12) rotate(8deg);opacity:1;}100%{transform:scale(1) rotate(0);opacity:1;}}

.confetti{position:absolute;inset:0;z-index:319;pointer-events:none;overflow:hidden;}
.conf{position:absolute;width:9px;height:14px;border-radius:2px;top:-20px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0.9;}}

.toast{position:absolute;left:50%;top:calc(var(--safe-top) + 12px);z-index:330;
  transform:translateX(-50%) translateY(-120%);
  background:var(--card);border:none;border-radius:var(--radius);padding:13px 20px;
  display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;
  box-shadow:0 12px 34px rgba(0,0,0,0.7);transition:transform .4s var(--ease);max-width:90vw;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast svg{width:19px;height:19px;flex:0 0 auto;}
.streak-banner{position:absolute;left:50%;top:calc(var(--safe-top) + 12px);z-index:331;
  transform:translateX(-50%) translateY(-150%);
  background:linear-gradient(135deg,#FF453A,#FF9F0A);border-radius:var(--radius);
  padding:13px 22px;display:flex;align-items:center;gap:10px;
  box-shadow:0 12px 34px rgba(0,0,0,0.6);transition:transform .5s var(--ease);}
.streak-banner.show{transform:translateX(-50%) translateY(0);}
.streak-banner .fl{font-size:24px;}
.streak-banner .tx{font-weight:800;font-size:16px;color:#fff;}
.streak-banner .tx small{display:block;font-weight:600;font-size:11px;opacity:0.9;}

/* =========================================================================
   ACCESIBILIDAD
   Movimiento reducido NO significa "sin respuesta": significa una respuesta
   más suave y no vestibular. Se conservan opacidad y color; se quitan
   desplazamientos y rebotes. El anillo NUNCA se anima con transición aquí:
   su valor es información, y debe verse al instante.
   ========================================================================= */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;transition-duration:.1s !important;}
  .sheet{transform:none !important;opacity:0;transition:opacity .16s var(--ease-out) !important;}
  .sheet.show{opacity:1;}
  .task-card,.gal-item,.tile,.anim-in{animation:none !important;}
  .btn:active,.chip:active,.seg:active,.day:active,.tb-btn:active,.mini-btn:active,
  .action-btn:active,.task-check:active,.gal-item.tappable:active,.friend-card:active,
  .notif-del:active,.cal-nav button:active,.fab:active,.cal-day.has:active,
  .tile:active,.ring:active,.tile-menu:active{transform:none !important;}
}
/* Aquí ya no hay ningún cristal que quitar: el sistema es opaco de nacimiento. */
@media (prefers-contrast:more){
  :root{
    --label-2:rgba(235,235,245,0.85);
    --label-3:rgba(235,235,245,0.62);
    --label-4:rgba(235,235,245,0.42);
    --card:#26262A; --card-2:#3A3A3E; --card-3:#4A4A4E;
    --hairline:rgba(255,255,255,0.28);
    --ring-track:#6A6A6E;
  }
  .card,.glass,.tile,.chip,.settings-list,.tg-list,.form-group,.task-card{
    outline:1px solid rgba(255,255,255,0.18);outline-offset:-1px;}
}

  /* ── Utilidades internas ── */
  // RNG opcionalmente reproducible (pasa una semilla para resultados deterministas)
  function crearRNG(semilla){
    if(semilla==null) return Math.random;
    let s = typeof semilla==='number' ? (semilla>>>0)
          : [...String(semilla)].reduce((a,c)=>(a*31 + c.charCodeAt(0))>>>0, 7);
    return function(){ s = (s + 0x6D2B79F5)|0; let t = Math.imul(s ^ s>>>15, 1|s);
      t = (t + Math.imul(t ^ t>>>7, 61|t)) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; };
  }
  const pick = (arr,r)=>arr[Math.floor(r()*arr.length)];
  const cap = s => s.charAt(0).toUpperCase()+s.slice(1);

  // Sustituye {slots} de forma recursiva, evitando repetir el mismo valor en una tarea
  function rellenar(plantilla, pools, r){
    let texto = plantilla, usados = {}, pasada = 0;
    while(texto.includes('{') && pasada < 5){
      texto = texto.replace(/\{(\w+)\}/g, (m,key)=>{
        const pool = pools[key];
        if(!pool) return m;
        const set = usados[key] || (usados[key] = new Set());
        let val;
        for(let i=0;i<8;i++){ val = pick(pool,r); if(!set.has(val) || set.size>=pool.length) break; }
        set.add(val);
        return val;
      });
      pasada++;
    }
    return texto;
  }

  return { POOLS, GIROS, TEMAS, DINAMICAS, ESCALA, EPICAS, CATEGORIAS, crearRNG, pick, cap, rellenar };

class GeneradorTareas {
  /**
   * @param {object} [opts]
   * @param {number|string} [opts.semilla]   Semilla para reproducibilidad (omítela para azar real)
   * @param {Set} [opts.historial]           Conjunto de firmas ya vistas (persístelo en tu app)
   */
  constructor(opts = {}){
    this.M = MotorTareas;
    this.rng = this.M.crearRNG(opts.semilla);
    this.historial = opts.historial || new Set();
  }

  /**
   * Genera una tarea única.
   * @param {object} cfg
   * @param {string} [cfg.categoria]  clave de categoría; omítela o 'aleatoria' para azar
   * @param {number} [cfg.duracion=15]  5,10,15,20,30,45,60 (minutos)
   * @param {string} [cfg.personas='solo']  'solo' | '2' | '3' | '3+'
   * @param {number} [cfg.maxIntentos=80]
   * @returns {object} tarea estructurada
   */
  generar(cfg = {}){
    const M = this.M, r = this.rng;
    const duracion = cfg.duracion || 15;
    const personas = cfg.personas || 'solo';
    const claves = Object.keys(M.CATEGORIAS);

    let intentos = cfg.maxIntentos || 80, resultado = null, ultimo = null;
    while(intentos-- > 0){
      const clave = (!cfg.categoria || cfg.categoria==='aleatoria')
        ? M.pick(claves, r) : cfg.categoria;
      const cat = M.CATEGORIAS[clave];
      const pools = { ...M.POOLS, ...(cat.pools||{}), tema: M.TEMAS };

      // En 2 h / 2 h+ se usan tareas épicas (proyectos largos); si no, las de la categoría
      const plantilla = duracion>=120 ? M.pick(M.EPICAS, r) : M.pick(cat.plantillas, r);
      let cuerpo = M.cap(M.rellenar(plantilla, pools, r));

      // ¿la plantilla ya trae tema propio?
      const usaTema = plantilla.includes('{tema}');

      // Capa 1: reto creativo (los "giros"). Casi siempre hay al menos uno.
      let giro = null;
      if(r() < (duracion>=20 ? 0.85 : 0.65)){
        giro = M.pick(M.GIROS, r);
        cuerpo += ' Y hazlo ' + giro + '.';
        // Reto extra: un segundo desafío distinto para subir la dificultad
        if(r() < 0.3){
          let giro2 = giro;
          for(let i=0;i<8 && giro2===giro;i++) giro2 = M.pick(M.GIROS, r);
          if(giro2!==giro){ cuerpo += ' Y, como reto extra, ' + giro2 + '.'; giro = giro + ' + ' + giro2; }
        }
      }
      // Capa 2: tema atmosférico (solo si la plantilla no lo usó ya)
      let tema = null;
      if(!usaTema && r() < 0.45){
        tema = M.pick(M.TEMAS, r);
        cuerpo += ' Déjate inspirar por ' + tema + '.';
      }

      const dinamica   = M.pick(M.DINAMICAS[personas] || M.DINAMICAS['solo'], r);
      const marcoTiempo = M.ESCALA[duracion] || '';

      // Firma = el texto visible exacto (cuerpo + dinámica). Así, una tarea ya
      // mostrada no vuelve a generarse jamás, da igual la duración o el grupo.
      const firma = [clave, cuerpo, dinamica].join('|');

      ultimo = { id:'TSK-'+Math.abs(hash(firma)).toString(36).toUpperCase().padStart(6,'0'),
        firma, categoria:clave, categoriaNombre:cat.nombre, emoji:cat.emoji, color:cat.color,
        duracion, personas, texto:cuerpo, giro, tema, dinamica, marcoTiempo, nuevo:true };

      if(!this.historial.has(firma)){ this.historial.add(firma); resultado = ultimo; break; }
    }
    if(!resultado){ ultimo.nuevo = false; resultado = ultimo; } // espacio agotado para ese filtro
    return resultado;
  }

  reiniciar(){ this.historial.clear(); }

  /** Estimación (conservadora) del nº de combinaciones posibles en total. */
  combinacionesEstimadas(){
    const M = this.M; let total = 0;
    for(const clave in M.CATEGORIAS){
      const cat = M.CATEGORIAS[clave];
      const pools = { ...M.POOLS, ...(cat.pools||{}), tema:M.TEMAS };
      for(const tpl of cat.plantillas){
        const slots = [...tpl.matchAll(/\{(\w+)\}/g)].map(m=>m[1]);
        const usados = {}; let prod = 1;
        for(const s of slots){
          const sz = pools[s] ? pools[s].length : 1;
          prod *= Math.max(1, sz - (usados[s]||0)); usados[s] = (usados[s]||0)+1;
        }
        total += prod;
      }
    }
    // capas adicionales: giro (×~21), tema (×~9), dinámica (×4), duración (×7)
    return Math.floor(total * 21 * 9 * 4 * 7);
  }
}
function hash(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h<<5)-h+str.charCodeAt(i); h|=0; } return h; }

/* ---------------------------------------------------------------------
   Duración y puntos
   --------------------------------------------------------------------- */
/* La duración sobrevive SOLO en el generador, donde sigue haciendo algo: es
   uno de los tres ingredientes con los que se inventa la tarea ("30 minutos de
   ...."). En el formulario ya no se pregunta: desde que los puntos salen del
   anillo, elegir "45 minutos" no cambiaba nada ni se enseñaba en ningún sitio. */
const DURATIONS = [5,10,15,20,30,45,60,120,150];
const durLabel = (m) => m===60 ? "1 hora" : m===120 ? "2 horas" : m===150 ? "2 horas o más" : m+" minutos";
/* EL ANILLO ES LA PUNTUACIÓN.
   Antes los puntos salían de la duración declarada: una tarea de 2 h valía 240
   la hicieras cuando la hicieras, y vencer costaba esos 240 de golpe. Ahora el
   número sale del mismo sitio que el dibujo. Con el anillo verde entero una
   tarea da 500; a la mitad, 250; justo al vencer, nada. Pasado el vencimiento
   el anillo rojo se llena y cobra lo mismo al revés: lleno del todo, −500.
   Las dos consecuencias que importan: lo que ves en la ficha y lo que se apunta
   en el marcador son el mismo número, y el paso de premio a castigo no tiene
   escalón —cruza por cero justo en el vencimiento—. La duración pasa a ser
   solo una nota tuya; ya no decide cuánto vale la tarea. */
const PTS_FULL = 500;
// Las del generador siguen valiendo el doble. Y por lo mismo cuestan el doble.
const taskMaxPoints = (t) => PTS_FULL * ((t && t.random) ? 2 : 1);

/* ---------------------------------------------------------------------
   INTERVALO DE VENCIMIENTO
   Una tarea ya no "toca un día": tiene un instante en que EMPIEZA y un
   intervalo tras el cual VENCE. De ahí sale el anillo. El mes se toma como
   30 días: es una barra de tiempo, no un calendario.
   --------------------------------------------------------------------- */
const endOfDayMs   = (key)=>{ const [y,m,d]=key.split("-").map(Number);
  return new Date(y, m-1, d, 23, 59, 59, 999).getTime(); };
const startOfDayMs = (key)=>{ const [y,m,d]=key.split("-").map(Number);
  return new Date(y, m-1, d, 0, 0, 0, 0).getTime(); };
const weekdayOf  = (key)=>{ const [y,m,d]=key.split("-").map(Number);
  return (new Date(y,m-1,d).getDay()+6)%7; };            // 0=Lunes
const domOfKey   = (key)=> parseInt(key.split("-")[2],10);
const addDaysKey = (key,n)=>{ const [y,m,d]=key.split("-").map(Number);
  const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dateKey(dt); };
const UNIT_MS = { minute:60000, hour:3600000, day:86400000, week:604800000, month:2592000000 };
const UNITS   = [["minute","Minuto"],["hour","Hora"],["day","Día"],["week","Semana"],["month","Mes"]];
const unitLabel = (u,n)=>{ const l=(UNITS.find(x=>x[0]===u)||UNITS[2])[1];
  if(n===1) return l;
  return l==="Mes" ? "Meses" : l+"s"; };
const taskPeriod = (t)=> Math.max(60000, (t.dueN||1) * (UNIT_MS[t.dueUnit||"day"] || UNIT_MS.day));
// Cuándo vence de verdad. Si la tarea es antigua y aún no tiene dueAt, se
// deduce; así el anillo funciona desde el primer momento, sin migrar a mano.
// Valores de vencimiento por defecto para las tareas que no nacen en el
// formulario (generador, compartidas): un día desde ahora, sin repetir.
function defaultDueFields(rec){
  const ty = (rec && rec.type) || "once";
  const repeats = (ty!=="once" && ty!=="date");
  const dueUnit = ty==="monthly" ? "month" : (ty==="weekly"||ty==="custom") ? "week" : "day";
  const startAt = Date.now();
  const base = { startAt, dueN:1, dueUnit, repeats, repeatFrom:"fixed", endMode:false, dueVer:3, recurrence:rec };
  base.dueAt   = computeDueFrom(base, startAt, false);
  base.startAt = computeStartFor(base, base.dueAt);
  return base;
}
/* ---------------------------------------------------------------------
   DÍAS MARCADOS
   Una tarea puede fijar SU RITMO de dos maneras excluyentes:
     a) por INTERVALO — "vence 1 día / 3 semanas después de empezar";
     b) por DÍAS MARCADOS — "lunes, miércoles y viernes".
   Con días marcados, la ventana de la tarea ES ESE DÍA: nace a las 00:00 y
   vence a las 23:59:59 del mismo día. Así el anillo empieza lleno justo
   cuando la tarea aparece en la lista y se vacía a lo largo del día.
   Antes la ventana iba desde que se creó la tarea hasta el próximo día
   marcado, así que el día en que por fin aparecía el anillo ya venía medio
   gastado: el círculo y la lista contaban cosas distintas.
   --------------------------------------------------------------------- */
function markedDays(t){
  const r = (t && t.recurrence) || {};
  if(!t || !t.repeats) return null;
  if(r.days  && r.days.length)  return { kind:"week",  set:r.days  };
  if(r.dates && r.dates.length) return { kind:"month", set:r.dates };
  return null;
}
function nextMarkedKey(t, fromKey, strict){
  const m = markedDays(t); if(!m) return null;
  for(let i = strict?1:0; i<=400; i++){
    const k = addDaysKey(fromKey,i);
    const hit = m.kind==="week" ? m.set.includes(weekdayOf(k)) : m.set.includes(domOfKey(k));
    if(hit) return k;
  }
  return null;
}
function computeDueFrom(t, fromMs, strict){
  if(markedDays(t)){
    const k = nextMarkedKey(t, dateKey(new Date(fromMs)), !!strict);
    if(k) return endOfDayMs(k);
  }
  return fromMs + taskPeriod(t||{});
}
// Arranque de la ventana que termina en dueMs.
function computeStartFor(t, dueMs){
  if(markedDays(t)) return startOfDayMs(dateKey(new Date(dueMs)));
  return dueMs - taskPeriod(t||{});
}
function taskDueAt(t){
  if(t && typeof t.dueAt === "number") return t.dueAt;
  const start = (t && (t.startAt || t.createdAt)) || Date.now();
  return computeDueFrom(t, start, false);
}
/* La VENTANA es la única fuente de verdad: de ella salen el anillo, la
   etiqueta de tiempo, la penalización y el momento en que la tarea aparece.
   Mientras se calculaban por separado, podían contradecirse. */
function taskWindow(t){
  const due = taskDueAt(t);
  let start = (t && typeof t.startAt === "number") ? t.startAt : computeStartFor(t, due);
  if(!(start < due)) start = computeStartFor(t, due);   // datos incoherentes
  return { start, due, period: Math.max(60000, due - start) };
}
// Al completar, el siguiente vencimiento. "intervalo fijo" mantiene el ritmo
// original (aunque la hagas tarde); "última finalización" cuenta desde ahora.
function nextDueAfter(t, completedAt){
  if(!t.repeats) return null;
  // Con días marcados manda el próximo día marcado DESPUÉS de hoy (ya la
  // hiciste hoy); el intervalo y "repetir desde" no pintan nada.
  if(markedDays(t)) return computeDueFrom(t, completedAt, true);
  const period = taskPeriod(t);
  if(t.repeatFrom === "completion") return completedAt + period;
  let next = taskDueAt(t) + period;
  while(next <= completedAt) next += period;   // muy retrasada: salta al próximo
  return next;
}
