   Fechas (clave local YYYY-MM-DD para evitar saltos por zona horaria)
   --------------------------------------------------------------------- */
const dateKey = (d=new Date()) => {
  const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
};
const yesterdayKey = () => { const d=new Date(); d.setDate(d.getDate()-1); return dateKey(d); };
/* Recalcula la racha a partir del historial (días distintos con actividad).
   - current: racha en curso (viva solo si el último día es hoy o ayer).
   - best: racha consecutiva más larga que EXISTE en el historial; así se
     conserva como récord mientras estén esas completadas, pero baja si se
     borran. Al borrar tareas, si un día se queda sin completadas deja de contar. */
function streakFromHistory(history){
  const days = [...new Set((history||[]).map(h=>h.date).filter(Boolean))].sort();
  if(!days.length) return { current:0, best:0, lastDate:null };
  const toD = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
  const consec = (a,b)=> (toD(b) - toD(a))/86400000 === 1;
  // mejor racha = run consecutivo más largo en todo el historial
  let best=1, run=1;
  for(let i=1;i<days.length;i++){ run = consec(days[i-1],days[i]) ? run+1 : 1; if(run>best) best=run; }
  // racha actual = run que termina en el último día con actividad
  let cur=1;
  for(let i=days.length-1; i>0; i--){ if(consec(days[i-1],days[i])) cur++; else break; }
  const last = days[days.length-1];
  const current = (last===dateKey() || last===yesterdayKey()) ? cur : 0; // viva solo si es hoy o ayer
  return { current, best, lastDate:last };
}
const timeLabel = (d=new Date()) => `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

// Ajusta el ancho de un <select> al texto de su opción ACTUAL (por defecto iOS lo
// hace del ancho de la opción MÁS LARGA, dejando mucho hueco antes de la flecha).
function fitSelectWidth(sel){
  if(!sel) return;
  try{
    const opt=sel.options[sel.selectedIndex]; const txt=opt?opt.text:"";
    const cs=getComputedStyle(sel);
    const meas=document.createElement("span");
    meas.style.cssText="position:absolute;visibility:hidden;white-space:pre;font-family:"+cs.fontFamily+";font-size:"+cs.fontSize+";font-weight:"+cs.fontWeight+";letter-spacing:"+cs.letterSpacing;
    meas.textContent=txt; document.body.appendChild(meas);
    const w=meas.getBoundingClientRect().width; meas.remove();
    sel.style.width=(Math.ceil(w)+37)+"px";   // 13 izq + 24 der (texto→flecha)
  }catch(e){}
}

/* ---------------------------------------------------------------------
   RESUMEN SEMANAL (lunes-domingo) — compartido entre tu perfil y el de un
   amigo. El resumen es siempre el de la ÚLTIMA semana YA TERMINADA (nunca
   la que está en curso), comparado con la anterior a esa.
   --------------------------------------------------------------------- */
function shiftDate(key,n){ const [y,m,d]=key.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dateKey(dt); }
function mondayOf(key){ const [y,m,d]=key.split("-").map(Number); const dow=(new Date(y,m-1,d).getDay()+6)%7; return shiftDate(key,-dow); }
function weekStats(history, monday){
  const end=shiftDate(monday,6);
  const items=(history||[]).filter(h=> h.date && h.date>=monday && h.date<=end);
  const cats={};
  items.forEach(h=>{ const c=h.category||"Otra"; cats[c]=(cats[c]||0)+1; });
  let topCategory=null, topCount=0;
  Object.entries(cats).forEach(([c,n])=>{ if(n>topCount){ topCount=n; topCategory=c; } });
  return { points: items.reduce((a,h)=>a+(h.points||0),0), tasks: items.length, topCategory, topCount };
}
function weeklySummaryFor(history){
  const weekStart = shiftDate(mondayOf(dateKey()), -7);
  const weekEnd = shiftDate(weekStart,6);
  const prevStart = shiftDate(weekStart,-7);
  const prevEnd = shiftDate(prevStart,6);
  const cur = weekStats(history, weekStart);
  const prev = weekStats(history, prevStart);
  const hasData = (history||[]).some(h=> h.date && h.date<=weekEnd);
  const hadEarlierActivity = (history||[]).some(h=> h.date && h.date<=prevEnd);
  const diffPoints = cur.points - prev.points, diffTasks = cur.tasks - prev.tasks;
  const vibe = !hadEarlierActivity ? { emoji:"🌱", label:"Primera semana registrada" }
    : diffPoints>0 ? { emoji:"📈", label:"Semana en subida" }
    : diffPoints<0 ? { emoji:"📉", label:"Semana más floja" }
    : { emoji:"⚖️", label:"Ritmo constante" };
  // El resumen de una semana está disponible solo 48 horas después de crearse
  // (se "crea" justo cuando esa semana termina, es decir, al empezar la
  // semana en curso): los primeros dos días de la semana en curso.
  const thisMonday = mondayOf(dateKey());
  const availableUntil = shiftDate(thisMonday, 2);
  const available = hasData && dateKey() < availableUntil;
  return { weekStart, weekEnd, points:cur.points, tasks:cur.tasks, topCategory:cur.topCategory, topCount:cur.topCount,
    diffPoints, diffTasks, hasData, hadEarlierActivity, vibe, available };
}
function weekRangeLabel(weekStart, weekEnd){
  const mo=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  const [,ms,ds]=weekStart.split("-").map(Number); const [,me,de]=weekEnd.split("-").map(Number);
  return ms===me ? `${ds}–${de} ${mo[ms-1]}` : `${ds} ${mo[ms-1]} – ${de} ${mo[me-1]}`;
}
function weekDiffLine(verb, diff, singular, plural){
  if(diff===0) return `${verb} el mismo número de ${plural} que la semana anterior`;
  const abs=Math.abs(diff), noun = abs===1?singular:plural;
  return `${verb} ${abs} ${noun} ${diff>0?"más":"menos"} que la semana anterior`;
}

// Anima de 0 al valor final todos los números marcados con data-count dentro
// de un contenedor (usado al abrir el resumen de la semana).
function animateCounters(root, duration){
  duration = duration || 900;
  const els=(root||document).querySelectorAll("[data-count]");
  els.forEach(el=>{
    const target=parseInt(el.getAttribute("data-count"),10)||0;
    const t0=performance.now();
    function tick(now){
      const p=Math.min(1,(now-t0)/duration);
      const eased=1-Math.pow(1-p,3);
      el.textContent=Math.round(target*eased);
      if(p<1) requestAnimationFrame(tick); else el.textContent=target;
    }
    requestAnimationFrame(tick);
  });
}

      const url = h.photoUrl || (Cloud.guessPhotoUrl && Cloud.guessPhotoUrl(h.id));

// Borra una completación del historial: resta sus puntos, borra su foto (local y
// nube), reabre la tarea para poder rehacerla y recalcula la racha.
function deleteCompletion(h){
  const photoId=h.photoId;
  Store.update(s=>{
    const idx=(s.history||[]).findIndex(x=>x.id===h.id);
    if(idx<0) return;
    const entry=s.history[idx];
    s.points=Math.max(0,(s.points||0)-(entry.points||0));
    s.history.splice(idx,1);
    // si la tarea sigue existiendo, permitir rehacerla ese día
    const t=(s.tasks||[]).find(x=>x.id===entry.taskId);
    if(t){ const ty=t.recurrence && t.recurrence.type;
      if(ty && ty!=="once" && ty!=="date"){ if(t.lastDone===entry.date) t.lastDone=null; }
      else { if(entry.date===dateKey()) t.done=false; }
    }
    const st=streakFromHistory(s.history);
    s.streak.current=st.current; s.streak.lastDate=st.lastDate; s.streak.best=st.best;
  });
  if(photoId) DB.del(photoId);
  if(Cloud.enabled && Cloud.enabled()){ Cloud.pushProfile && Cloud.pushProfile(); Cloud.reconcile && Cloud.reconcile(); }
}

/* ---------------------------------------------------------------------
   DB — fotografías en IndexedDB (capacidad muy superior a localStorage)
   --------------------------------------------------------------------- */
const DB = (() => {
  let dbp = null;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res,rej)=>{
      const r = indexedDB.open("rachas_db", 1);
      r.onupgradeneeded = () => { const db=r.result; if(!db.objectStoreNames.contains("photos")) db.createObjectStore("photos"); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }).catch(()=>null);
    return dbp;
  }
  async function tx(mode){ const db = await open(); if(!db) return null; return db.transaction("photos",mode).objectStore("photos"); }
  return {
    async put(id, dataUrl){ try{ const st=await tx("readwrite"); if(!st) return; st.put(dataUrl,id); }catch(e){} },
    get(id){ return new Promise(async (res)=>{ try{ const st=await tx("readonly"); if(!st) return res(null); const r=st.get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null);}catch(e){res(null);} }); },
    async del(id){ try{ const st=await tx("readwrite"); if(st) st.delete(id);}catch(e){} }
  };
})();

/* ---------------------------------------------------------------------
   Store — estado de la app en localStorage (todo menos fotos)
   --------------------------------------------------------------------- */
const Store = (() => {
  const KEY = "rachas_state_v1";
  const defaults = () => ({
    profile:{ name:"Atleta", avatar:null },
    tasks:[],          // {id,title,desc,category,minutes,urgent,recurrence:{type,days[]},random,createdAt,done,lastDone}
    history:[],        // {id,taskId,title,category,minutes,points,random,date,time,photoId}
    points:0,
    streak:{ current:0, best:0, lastDate:null },
    friends:[],        // {id,cloudId,name,avatar,points,streak,dates:[],history:[],addedAt}
    cloud:{ syncedCompletions:[], avatarUrl:null, avatarSrc:null },
    notifs:[],         // notificaciones descargadas de la nube
    notifSeen:[],      // ids ya mostrados como aviso del sistema
    deletedShared:[],  // ids de tareas compartidas que borraste (no re-sincronizar)
    penalties:0        // puntos descontados por tareas no completadas en su día
  });
  let state;
  function load(){
    if(saveTimer) saveNow();   // vuelca lo pendiente ANTES de releer (o se perdería)
    try{ state = JSON.parse(localStorage.getItem(KEY)) || defaults(); }
    catch(e){ state = defaults(); }
    // normalizar racha al cargar: si el último día válido es anterior a ayer, se rompe
    if (state.streak.lastDate){
      if (state.streak.lastDate !== dateKey() && state.streak.lastDate !== yesterdayKey()){
        state.streak.current = 0;
      }
    }
    if(!Array.isArray(state.friends)) state.friends = []; // migración: usuarios antiguos
    const nf = state.friends.filter(f=> f && f.cloudId); // amigos solo por nube (se eliminó el sistema de códigos)
    if(nf.length!==state.friends.length){ state.friends=nf; save(); }
    if(!state.cloud) state.cloud={ syncedCompletions:[], avatarUrl:null, avatarSrc:null };
    if(!Array.isArray(state.notifs)) state.notifs=[];
    if(!Array.isArray(state.notifSeen)) state.notifSeen=[];
    if(!Array.isArray(state.deletedShared)) state.deletedShared=[];
    // Las tareas guardadas antes del intervalo no tienen ni inicio ni
    // vencimiento. Se deducen de su repetición para que estrenen anillo sin
    // que tengas que volver a crear nada.
    (state.tasks||[]).forEach(t=>{
      if(typeof t.dueN !== "number"){
        const ty = (t.recurrence && t.recurrence.type) || "once";
        t.dueN = 1;
        t.dueUnit = ty==="monthly" ? "month" : (ty==="weekly"||ty==="custom") ? "week" : "day";
        t.repeats = (ty!=="once" && ty!=="date");
        t.repeatFrom = "fixed";
      }
      if(typeof t.startAt !== "number"){
        // el ciclo en curso arranca en la última vez que la hiciste
        const last = t.lastDone ? (()=>{ const [y,m,d]=t.lastDone.split("-").map(Number);
          return new Date(y,m-1,d,23,59,59,999).getTime(); })() : 0;
        t.startAt = Math.max(t.createdAt || Date.now(), last);
      }
      /* dueVer 3: la ventana de una tarea con días marcados es AHORA ese día
         entero (00:00 → 23:59), no el hueco desde que se creó. Se recalcula
         una sola vez por tarea.
         Importante: un recálculo NO debe cobrarte puntos por días que ya
         pasaron. Si el vencimiento nuevo cae en el pasado se marca como ya
         cobrado, así la migración nunca resta nada; a partir de aquí las
         penalizaciones vuelven a contar con normalidad. */
      if(t.dueVer !== 3 || typeof t.dueAt !== "number"){
        const anchor  = (typeof t.startAt === "number") ? t.startAt : (t.createdAt || Date.now());
        const newDue  = computeDueFrom(t, anchor, false);
        t.dueAt   = newDue;
        t.startAt = computeStartFor(t, newDue);
        if(newDue < Date.now()) t.penalizedFor = newDue;
        t.dueVer  = 3;
      }
    });
    if(typeof state.penalties!=='number') state.penalties=0;
    /* El castigo vuelve a ser un solo cobro, al llenarse el anillo rojo. Hay
       que deshacer el goteo proporcional que estuvo vivo entre medias:

       1. Lo que el goteo ya descontó SE DEVUELVE. Era un cobro de una regla
          retirada, y dejarlo puesto sería cobrar por algo que ya no existe.
          `penalizedPts` es justo lo que se llevó de cada tarea. Nunca por
          debajo de cero.
       2. Una tarea que YA tiene el anillo rojo lleno al llegar aquí se da por
          saldada: se marca su vencimiento como cobrado sin cobrar nada. Se
          borrará, que es lo que toca, pero sin pasar una factura de 500 por
          un tiempo que transcurrió bajo otras reglas.

       Las tareas con `penalizedFor` pero SIN `penalizedPts` no se tocan: son
       cobros enteros de antes del goteo, y esos sí fueron correctos. */
    if(state.ptsVer !== 2){
      const nowMs = Date.now();
      let back = 0;
      (state.tasks||[]).forEach(t=>{
        if(typeof t.penalizedPts === "number"){
          back += t.penalizedPts;
          delete t.penalizedPts; delete t.penalizedFor;
        }
        const w = taskWindow(t);
        if(nowMs >= w.due + w.period && t.penalizedFor === undefined) t.penalizedFor = w.due;
      });
      if(back > 0) state.penalties = Math.max(0, (state.penalties||0) - back);
      state.ptsVer = 2;
    }
    // Las recurrentes antiguas arrancan su contador de penalización desde ayer,
    // para no descontar retroactivamente días pasados antes de esta función.
    (state.tasks||[]).forEach(t=>{ const ty=t.recurrence&&t.recurrence.type;
      if(ty && ty!=='once' && ty!=='date' && !t.penalizedUpTo) t.penalizedUpTo=yesterdayKey(); });
    // Auto-corrección: puntos = historial − penalizaciones. La penalización se
    // TOPA en el total ganado: nunca se pierde más de lo que has sumado, así
    // completar una tarea siempre suma (no queda un "déficit" invisible en 0).
    const rawSum=(state.history||[]).reduce((a,h)=>a+(h.points||0),0);
    const cappedPen=Math.min(state.penalties||0, rawSum);
    const ptsSum=rawSum - cappedPen;
    const stk=streakFromHistory(state.history||[]);
    if(state.points!==ptsSum || state.penalties!==cappedPen || state.streak.current!==stk.current || state.streak.best!==stk.best){
      state.points=ptsSum; state.penalties=cappedPen;
      state.streak.current=stk.current; state.streak.best=stk.best; state.streak.lastDate=stk.lastDate;
      save();
    }
    return state;
  }
  // Guardado DIFERIDO y fusionado: serializar todo el estado (historial +
  // avatar) en localStorage es costoso y una sola acción dispara varios
  // update() seguidos. Se agrupan en UN solo guardado en el siguiente tick,
  // fuera del camino del toque (la interfaz responde primero). Al ocultar o
  // cerrar la app se vuelca al instante para no perder nada.
  let saveTimer=null;
  function saveNow(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; }
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function save(){ if(!saveTimer) saveTimer=setTimeout(saveNow, 0);
    // Todo cambio local viaja a la nube por su cuenta. No hay ningún botón de
    // "sincronizar": si hiciera falta pulsarlo, la sincronización no existiría.
    try{ if(window.Sync && Sync.schedule) Sync.schedule(); }catch(e){} }
  window.addEventListener("pagehide", saveNow);
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden) saveNow(); });
  return {
    get:()=>state || load(),
    load, save,
    update(fn){ fn(state); save(); }
  };
})();

/* ---------------------------------------------------------------------

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

const esc = (s)=> (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* =====================================================================
   GENERADOR
   ===================================================================== */
const Generator = (() => {
  /* =====================================================================
     UI del generador. La generación la realiza el módulo GeneradorTareas
     (motor integrado): elige la tarea según categoría, duración y grupo,
     escala la complejidad con el tiempo y evita repetir hasta agotar el
     ciclo de cada combinación.
     ===================================================================== */
  let selCat = CATEGORIES[0].name;
  let selDur = 10;
  let selPeople = 1;             // 1=solo · 2 · 3 · 4(=3+)
  let current = null;            // {title, category, minutes, people, points}
  let genPartner = null;         // amigo con quien compartir la tarea generada

  const catKey  = (name)=> name.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); // "Música" -> "musica"
  const grupoDe = (k)=> k<=1 ? "solo" : k===2 ? "2" : k===3 ? "3" : "3+";

  function build(){
    let texto;
    try {
      const t = _genTareas.generar({ categoria:catKey(selCat), duracion:selDur, personas:grupoDe(selPeople) });
      texto = t.texto + (t.dinamica ? " " + t.dinamica : "");
      saveGenHist(_genTareas.historial); // persistir para no repetir nunca
    } catch(e){
      texto = "Dedica este tiempo a tu categoría elegida.";
    }
    current = { title:texto, category:selCat, minutes:selDur, people:selPeople, points:PTS_FULL*2 };
    return current;
  }
  function clearOutput(){ current=null; genPartner=null; const o=$("#genOutput"); if(o) o.innerHTML=""; }

  function renderControls(){
    const catSel=$("#genCat");
    if(catSel){
      catSel.innerHTML = CATEGORIES.map(c=>`<option value="${esc(c.name)}"${c.name===selCat?" selected":""}>${Icons.raw(c.name)}  ${esc(c.name)}</option>`).join("");
      catSel.onchange=()=>{ selCat=catSel.value; haptic(); clearOutput(); fitSelectWidth(catSel); };
      fitSelectWidth(catSel);
    }
    const pplSel=$("#genPeople");
    if(pplSel){
      pplSel.innerHTML = PEOPLE.map(p=>`<option value="${p.k}"${p.k===selPeople?" selected":""}>${esc(peopleShort(p.k))}</option>`).join("");
      pplSel.onchange=()=>{ selPeople=+pplSel.value; haptic(); clearOutput(); fitSelectWidth(pplSel); };
      fitSelectWidth(pplSel);
    }
    const durSel=$("#genDur");
    if(durSel){
      durSel.innerHTML = DURATIONS.map(m=>`<option value="${m}"${m===selDur?" selected":""}>⏱  ${esc(durLabel(m))}</option>`).join("");
      durSel.onchange=()=>{ selDur=+durSel.value; haptic(); clearOutput(); fitSelectWidth(durSel); };
      fitSelectWidth(durSel);
    }
  }
  function renderOutput(){
    const out = $("#genOutput");
    if (!current){ out.innerHTML=""; return; }
    const color = catColor(current.category);
    out.innerHTML = `
      <div class="card gen-result">
        <span class="cat-badge" style="background:${hexA(color,0.15)};color:${color}">${Icons.get(current.category)}${esc(current.category)}</span>
        <div class="task-text">${esc(current.title)}</div>
        <div class="meta">
          <span class="pill">${clockSvg()} ${durLabel(current.minutes)}</span>
          ${current.people>1?`<span class="pill">${peopleSvg()} ${peopleShort(current.people)}</span>`:""}
          <span class="pill pts">${starSvg()} hasta ${current.points} pts</span>
        </div>
      </div>
      ${Cloud.configured()?`<div id="genShareWrap" style="margin-top:14px"><div class="lbl-sm">Compartir con un amigo</div><div class="chips" id="genShare"></div><div class="hint" id="genShareHint" style="display:none">Si tú o tu amigo la completáis o la borráis, se hace para los dos.</div></div>`:""}
      <div class="gen-actions">
        <button class="btn secondary" id="genSwap">${refreshSvg()} Generar otra</button>
        <button class="btn" id="genAdd">${plusSvg()} Agregar</button>
      </div>`;
    out.querySelector("#genSwap").onclick = ()=>{ haptic(); build(); animateSwap(); };
    out.querySelector("#genAdd").onclick = ()=>{ haptic(12); addCurrent(); };
    renderGenShare();
  }
  function renderGenShare(){
    const w=$("#genShare"); if(!w) return; w.innerHTML="";
    const friends=Store.get().friends.filter(f=>f.cloudId);
    if(!friends.length){ w.innerHTML=`<span class="hint" style="margin:0">Añade amigos (Perfil → icono de amigos) para compartir tareas.</span>`; return; }
    friends.forEach(f=>{ const chip=el("button","chip"+(genPartner&&genPartner.cloudId===f.cloudId?" sel":""));
      chip.style.setProperty("--accent","#5E5CE6");
      chip.innerHTML=`<span class="friend-av" style="width:22px;height:22px;font-size:11px">${f.avatar?`<img src="${esc(f.avatar)}">`:esc((f.name||"A").charAt(0).toUpperCase())}</span>${esc(f.name)}`;
      chip.onclick=()=>{ genPartner = (genPartner&&genPartner.cloudId===f.cloudId)?null:{cloudId:f.cloudId,name:f.name}; haptic(); renderGenShare(); const h=$("#genShareHint"); if(h) h.style.display=genPartner?"block":"none"; };
      w.appendChild(chip); });
  }
  function animateSwap(){
    renderOutput();
    const card = $("#genOutput .gen-result");
    if(card){ card.style.animation="none"; void card.offsetWidth; card.style.animation="cardIn .35s var(--ease-out)"; }
  }
  function addCurrent(){
    if(!current) return;
    const newId=uid();
    const rec={type:"once",days:[]};
    const partner=genPartner;
    // Con compañero: es solo una INVITACIÓN (como una solicitud de amistad). No
    // se añade a tu lista todavía; se añadirá a ambas listas cuando la acepte.
    if(!partner){
      Store.update(s=>{
        s.tasks.unshift(Object.assign({
          id:newId, title:current.title, desc:"", category:current.category,
          minutes:current.minutes, people:current.people||1, urgent:false, recurrence:rec,
          random:true, createdAt:Date.now(), done:false, lastDone:null
        }, defaultDueFields(rec)));
      });
    }
    if(partner){
      const meName=Store.get().profile.name||"Atleta";
      Cloud.createShared({ id:newId, owner_id:Cloud.myId(), owner_name:meName, partner_id:partner.cloudId, partner_name:partner.name,
        title:current.title, descr:"", category:current.category, minutes:current.minutes, people:current.people||1, urgent:false, recurrence:rec, only_on_days:false });
    }
    UI.toast(partner?`Invitación enviada a ${esc(partner.name)}`:"Añadida a tus tareas", "check", "var(--green)");
    UI.renderTasks();
    UI.flashTab("tasks");
    clearOutput();
  }
  function generate(){ haptic(12); build(); renderOutput();
    requestAnimationFrame(()=>{ const o=$("#genOutput"); o && o.scrollIntoView({behavior:"smooth",block:"nearest"}); });
  }

  function init(){
    renderControls();
    $("#genBtn").onclick = generate;
  }
  return { init };
})();
